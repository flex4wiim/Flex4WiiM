splay:flex;align-items:flex-start;gap:10px;margin:9px 0}.annotation-legend .badge{display:inline-flex;align-items:center;justify-content:center;background:#b81024;color:white;border:2px solid white;box-shadow:0 0 0 1px #b81024;border-radius:50%;min-width:25px;height:25px;font:700 14px/1 system-ui;margin-top:2px;flex-shrink:0}.annotations-off .annotation-stage>svg{display:none}.annotation-stage:focus-within{outline:2px solid #bd97ff}<\/style><style>.step-label{width:auto!important;min-width:0!important;height:auto!important;padding:5px 10px!important;border-radius:7px!important;font-size:14px!important;white-space:nowrap}.callout-heading{font-weight:700;margin:16px 0 8px}.annotation-legend{counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"group\"><main><header><h1>Create &amp; switch groups<\/h1><p>Create, save and manage a group of WiiM devices.<\/p><\/header><section class=\"manual-update\" id=\"update133-9\"><h2>Group changes and related scenes<\/h2><div class=\"annotation-stage\" data-source=\"05-3950.jpg\"><img src=\"images/v133-05-3950.jpg\" alt=\"Group changes and related scenes\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1536 609\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"84.48\" y=\"219.23999999999998\" width=\"1367.04\" height=\"155.29500000000002\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"138.24\" cy=\"161.47999999999996\" r=\"53.760000000000005\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"138.24\" y=\"161.47999999999996\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"67.2\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Saving a different group leader deletes that group’s scenes after showing the affected count. Deleting a saved group also deletes its related scenes. Cancel keeps them. Recreate the scenes for the new leader, whose presets may differ. Changing the name or keeping the same leader does not trigger this automatic cleanup. Deleting the saved group does not erase presets on the devices or change current playback. This screenshot shows the group-deletion confirmation; Android’s dialog buttons may follow the system language.<\/span><\/li><\/ol><\/section><section id=\"topic-0\"><h2><span class=\"num step-label\">Step 1<\/span>Open the group creation screen<\/h2><p>Tap the grid icon at the top right of the app to open the group creation screen.<\/p><figure><img src=\"images/71d795a90ec27af89b641d25ccbdd7cc67ec46470e470f09f1c26e4a6e5b9b6f.png\" alt=\"Open the group creation screen\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-1\"><h2><span class=\"num step-label\">Step 2<\/span>Enter a group name<\/h2><p>Enter a name for the group. Use an easy-to-understand name, such as “Living Room” or “Whole House”.<\/p><figure><img src=\"images/e3b4426b38d07940b72a38ff946e67674f0417db68575424ffbfa65e805f7aa5.png\" alt=\"Enter a group name\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-2\"><h2><span class=\"num step-label\">Step 3<\/span>Select the group type<\/h2><p>Tap “Type” and select the group type.<\/p><figure><img src=\"images/45e3ba154e06c33938489f17e940c08f2552b29205cc9f6849c8e7cbcac682f1.png\" alt=\"Select the group type\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><p>Multi-room: Group multiple WiiM devices for synchronized playback.<\/p><p>Home theater: For home theater setup.<\/p><p>Stereo pair (linked volume): Pair two WiiM devices as left/right with linked volume.<\/p><p>In this example, select “Multi-room”.<\/p><\/div><\/section><section id=\"topic-3\"><h2><span class=\"num step-label\">Step 4<\/span>Select the devices to include<\/h2><p>Select the WiiM devices to include in the group. Registered devices on the same network are listed. In this example, three devices are selected.<\/p><figure><img src=\"images/509dd56dcbb9e4f91f362f7495698bd3945c40615992fc3c82c164a60b347943.png\" alt=\"Select the devices to include\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-4\"><h2><span class=\"num step-label\">Step 5<\/span>Select the leader device<\/h2><p>Tap “Leader” and select the device that will control the group. The leader manages group playback. In this example, “WiiM Bar-DB90” is selected.<\/p><figure><img src=\"images/5af27290f6b5b04c12602c03d685c859f1e17623f886738ea82e9d9596bbc4f7.png\" alt=\"Select the leader device\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-5\"><h2><span class=\"num step-label\">Step 6<\/span>Save the group<\/h2><p>After confirming the name, color, type, devices and leader, tap “Save” to register the group.<\/p><figure><img src=\"images/471a191fbbb4380262ebd37134f9bd12b11d29a71eb7eec6ba31b838171a490a.png\" alt=\"Save the group\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><p>Saving the group does not change the actual speaker connections.<\/p><\/div><\/section><section id=\"topic-6\"><h2><span class=\"num step-label\">Step 7<\/span>The group is added<\/h2><p>The group icon is added at the top of the main screen. Tap it to select the group. The device card and player will follow your selection.<\/p><figure><img src=\"images/f57f1ec77999e32ff7864a35a39dcf35199e6df190cc0f3d1b5d70bc99fb2289.png\" alt=\"The group is added\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-7\"><h2><span class=\"num step-label\">Step 8<\/span>Open the group control panel<\/h2><p>Long press a group icon to open its control panel. Here you can change the display name, icon colour and image; these changes are saved automatically and apply only in this app. You can also adjust each member's volume, check the saved and current leaders, and use the Input, Output, EQ and Scenes controls. Tap the pencil icon at the top to open the group editor.<\/p><figure class=\"manual-detail\"><figcaption>Long press<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/1050.4573484069888\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:8.091713588267236%;width:90%;height:89.05238749822666%\"><img src=\"images/f57f1ec77999e32ff7864a35a39dcf35199e6df190cc0f3d1b5d70bc99fb2289.png\" alt=\"Long press\" loading=\"eager\" decoding=\"async\" style=\"width:357.1428571428571%!important;left:-257.1428571428571%;top:-21.951219512195124%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1050.4573484069888\" aria-hidden=\"true\"><rect x=\"178.5714285714286\" y=\"176.26413155190136\" width=\"739.2857142857143\" height=\"752.9290853031861\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"532.1428571428572\" cy=\"564.136690647482\" r=\"25\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"5\"><\/circle><circle cx=\"532.1428571428572\" cy=\"564.136690647482\" r=\"14\" fill=\"#ed2244\" fill-opacity=\".22\" stroke=\"#ed2244\" stroke-width=\"3\"><\/circle><path d=\"M 567.1428571428572 602.136690647482 L 539.1428571428572 570.136690647482 L 544.1428571428572 607.136690647482\" fill=\"white\" stroke=\"#ed2244\" stroke-width=\"4\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><\/figure><figure><img src=\"images/0c71416836da5263638ee30dc4f49e69740f10bb46b10961f76a44dc4fbef298.jpg\" alt=\"Open the group control panel\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><p>The saved group configuration may differ from the current speaker connections.<\/p><\/div><\/section><section id=\"topic-8\"><h2><span class=\"num step-label\">Step 9<\/span>Edit the group<\/h2><p>Tap the pencil icon in the group control panel to open Edit group. Choose the group type, select or deselect member devices, and choose the leader. Tap Save to save these group-configuration changes.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/651.1190168175939\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:3.839543824443936%;width:90%;height:91.55300358622334%\"><img src=\"images/0c71416836da5263638ee30dc4f49e69740f10bb46b10961f76a44dc4fbef298.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:238.09523809523813%!important;left:-85.71428571428571%;top:-3.571428571428571%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 651.1190168175939\" aria-hidden=\"true\"><rect x=\"285.7142857142858\" y=\"110.15985954537057\" width=\"225.0\" height=\"229.93162077250048\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><figure><img src=\"images/9e2118097f2d78617b19d5a10932df62980f0fc3a23642a6b85bff891521ff5d.jpg\" alt=\"Edit the group\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><p>The group name, icon colour and image are edited in the control panel and saved automatically.<\/p><\/div><\/section><section id=\"topic-9\"><h2><span class=\"num step-label\">Step 10<\/span>Change the group icon image<\/h2><p>Tap “Change image” to select a group icon. Choose a preset room label or symbol, or upload your own image using “Choose image”.<\/p><figure><img src=\"images/c8f3d2edb32614be841221590015c12e08af6e573b3ef2c3613c8ad49a27731d.png\" alt=\"Change the group icon image\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><\/main><\/body><\/html>"}, {"id": "pair", "group": "groups", "title": "Stereo pair", "blocks": [{"id": "topic-0", "title": "About stereo pairs in this app", "text": "About stereo pairs in this appThis guide registers two speakers as a left/right, linked-volume group in Flex4WiiM. This is distinct from importing or recreating an official WiiM Home stereo pair."}, {"id": "topic-1", "title": "Step 1Create a stereo pair", "text": "Step 1Create a stereo pairTap the grid icon on the main screen to open Create group. Enter a name, choose an icon colour, select “Stereo pair (linked volume)” as the type, and check the two devices to pair.Tap1Enter a pair name.2Choose an icon colour.3Select Stereo pair (linked volume).4Select the two speakers to pair.1234Example: WiiM Sound Lite and WiiM Sound."}, {"id": "topic-2", "title": "Step 2Set the leader and channels", "text": "Step 2Set the leader and channelsChoose the leader device, then set the initial playback channel for each speaker. In this example, WiiM Sound Lite is the leader and plays Left (L), while WiiM Sound plays Right (R).1Select the leader.2Set the left and right channels.12Channel choices: Current (keep existing), Stereo (both channels), Left (L), and Right (R)."}, {"id": "topic-3", "title": "Step 3Lock stereo pair", "text": "Step 3Lock stereo pairTurn “Lock stereo pair” on or off depending on how you want the pair maintained when changing connections in this app.On: the app keeps the speakers paired, retains or restores the pair when another group is released, and synchronizes pair volume and EQ. When activating the pair, a follower volume changed elsewhere is aligned with the leader. Single-device playback of either paired speaker is unavailable in this app while the lock is on.Off: the app does not maintain pair connections or synchronize EQ. Volume changes preserve left/right differences. Theater automatic detachment can still restore registered pairs.The lock applies to operations in this app. It does not monitor or reverse pair changes made in WiiM Home or other apps."}, {"id": "topic-4", "title": "Step 4Save and check the pair", "text": "Step 4Save and check the pairTap Save to store the pair; a group icon with ↔ appears on the main screen. Saving a new pair does not connect the speakers. Tap its icon to activate it, then check each speaker’s current channel.Tap the pair icon to select it, or long press it to open the control screen."}, {"id": "topic-5", "title": "Step 5Control the stereo pair", "text": "Step 5Control the stereo pairLong press the stereo-pair icon to open its control screen. Adjust the member volumes, review or change the left/right channel assignments, and use “Swap L / R” to exchange the channels.Long pressThe control screen also shows the saved and current leader."}, {"id": "topic-6", "title": "Step 6Show the channel swap button", "text": "Step 6Show the channel swap buttonEnable “Show the channel swap switch on the pair icon”. A swap button then appears at the bottom centre of the stereo-pair icon. Tap it to exchange left and right without opening the control screen."}, {"id": "topic-7", "title": "Step 7Edit the stereo pair", "text": "Step 7Edit the stereo pairTap the pencil icon in the pair control screen to open Edit group. You can change the group type, selected devices, leader and stereo-pair lock setting. Tap Save to apply these changes.TapName, colour and image are edited and saved automatically in the control popup."}, {"id": "topic-8", "title": "Step 8Using the channel swap", "text": "Step 8Using the channel swapThe swap is useful when the listener sits between a WiiM Bar / TV and the stereo pair, facing opposite directions for TV viewing and music listening.For TV viewing, face the WiiM Bar and swap left/right channels to suit that direction.For music, face the stereo pair and swap again to restore the normal stereo orientation."}], "text": "Stereo pairSet up, control and edit a stereo pair.About stereo pairs in this appThis guide registers two speakers as a left/right, linked-volume group in Flex4WiiM. This is distinct from importing or recreating an official WiiM Home stereo pair.Step 1Create a stereo pairTap the grid icon on the main screen to open Create group. Enter a name, choose an icon colour, select “Stereo pair (linked volume)” as the type, and check the two devices to pair.Tap1Enter a pair name.2Choose an icon colour.3Select Stereo pair (linked volume).4Select the two speakers to pair.1234Example: WiiM Sound Lite and WiiM Sound.Step 2Set the leader and channelsChoose the leader device, then set the initial playback channel for each speaker. In this example, WiiM Sound Lite is the leader and plays Left (L), while WiiM Sound plays Right (R).1Select the leader.2Set the left and right channels.12Channel choices: Current (keep existing), Stereo (both channels), Left (L), and Right (R).Step 3Lock stereo pairTurn “Lock stereo pair” on or off depending on how you want the pair maintained when changing connections in this app.On: the app keeps the speakers paired, retains or restores the pair when another group is released, and synchronizes pair volume and EQ. When activating the pair, a follower volume changed elsewhere is aligned with the leader. Single-device playback of either paired speaker is unavailable in this app while the lock is on.Off: the app does not maintain pair connections or synchronize EQ. Volume changes preserve left/right differences. Theater automatic detachment can still restore registered pairs.The lock applies to operations in this app. It does not monitor or reverse pair changes made in WiiM Home or other apps.Step 4Save and check the pairTap Save to store the pair; a group icon with ↔ appears on the main screen. Saving a new pair does not connect the speakers. Tap its icon to activate it, then check each speaker’s current channel.Tap the pair icon to select it, or long press it to open the control screen.Step 5Control the stereo pairLong press the stereo-pair icon to open its control screen. Adjust the member volumes, review or change the left/right channel assignments, and use “Swap L / R” to exchange the channels.Long pressThe control screen also shows the saved and current leader.Step 6Show the channel swap buttonEnable “Show the channel swap switch on the pair icon”. A swap button then appears at the bottom centre of the stereo-pair icon. Tap it to exchange left and right without opening the control screen.Step 7Edit the stereo pairTap the pencil icon in the pair control screen to open Edit group. You can change the group type, selected devices, leader and stereo-pair lock setting. Tap Save to apply these changes.TapName, colour and image are edited and saved automatically in the control popup.Step 8Using the channel swapThe swap is useful when the listener sits between a WiiM Bar / TV and the stereo pair, facing opposite directions for TV viewing and music listening.For TV viewing, face the WiiM Bar and swap left/right channels to suit that direction.For music, face the stereo pair and swap again to restore the normal stereo orientation.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Create a Stereo Pair<\/title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#242238;font:16px/1.65 system-ui,-apple-system,\"Noto Sans\",sans-serif}\nmain{max-width:760px;margin:0 auto;padding:12px 14px 42px}\nheader{background:linear-gradient(100deg,#42009c,#7112b7);color:#fff;border-radius:13px;padding:19px 20px;margin-bottom:17px}\nheader h1{font-size:clamp(23px,5vw,32px);line-height:1.23;margin:0}\nheader p{margin:8px 0 0;color:#f2e8ff}\nsection{border:1px solid #e6e1ef;border-radius:16px;padding:17px;margin:15px 0;background:#fff}\nh2{font-size:21px;line-height:1.3;color:#6411b9;margin:0 0 12px;display:flex;gap:11px;align-items:center}\n.num{flex:0 0 42px;height:42px;background:linear-gradient(145deg,#fa006e,#ae35ce);border-radius:50%;color:white;display:inline-grid;place-items:center;font-weight:800}\np{margin:9px 0}ul,ol{padding-left:24px}li{margin:7px 0}strong{color:#5812a6}\nfigure{margin:14px 0}figure img{display:block;max-width:100%;width:100%;height:auto;object-fit:contain;border-radius:10px;background:#18131e}\nfigcaption{font-size:13px;color:#6d6780;margin-top:6px}\n.note{background:#edf3ff;border-radius:10px;padding:12px 14px;margin:13px 0;color:#254b80}\n.warn{background:#fcecf5;border-radius:10px;padding:12px 14px;margin:13px 0}\n.sub{background:#f8f5fc;border-radius:10px;padding:11px 14px;margin:12px 0}\nfooter{font-size:13px;color:#777;margin:22px 4px}\n@media(max-width:420px){section{padding:13px}h2{font-size:19px}main{padding:9px 10px 30px}}<\/style><style>html,body{margin:0!important;min-height:0!important;overflow-x:hidden!important}body{padding:8px!important;box-sizing:border-box!important}main,.wrap,.page{width:auto!important;max-width:100%!important;margin:0 auto!important;box-sizing:border-box!important}img{max-width:100%!important;height:auto!important;object-fit:contain!important;cursor:zoom-in}figure{max-width:100%;margin-left:0!important;margin-right:0!important}h1{font-size:clamp(23px,4vw,34px)!important}p,li,figcaption{overflow-wrap:anywhere}section,article{min-width:0;box-sizing:border-box}.new-section{padding:20px;border:1px solid #aaa6;border-radius:16px;margin:20px 0}.new-section p{line-height:1.8}.new-section figure{margin-top:20px}mark{background:#ffe476;color:#17131f} @media(max-width:520px){main,.wrap,.page{padding:8px!important}section,article{padding-left:12px!important;padding-right:12px!important}.items,.points,.grid{grid-template-columns:1fr!important}}<\/style><style>.annotation-stage{position:relative;display:block;width:100%;margin:0 auto;line-height:0}.annotation-stage>img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;margin:0!important;border-radius:0!important}.annotation-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotation-legend{font-size:16px;line-height:1.75;margin:12px 0 22px!important;padding:0!important;list-style:none!important}.annotation-legend li{display:flex;align-items:flex-start;gap:10px;margin:9px 0}.annotation-legend .badge{display:inline-flex;align-items:center;justify-content:center;background:#b81024;color:white;border:2px solid white;box-shadow:0 0 0 1px #b81024;border-radius:50%;min-width:25px;height:25px;font:700 14px/1 system-ui;margin-top:2px;flex-shrink:0}.annotations-off .annotation-stage>svg{display:none}.annotation-stage:focus-within{outline:2px solid #bd97ff}<\/style><style>.step-label{width:auto!important;min-width:0!important;height:auto!important;padding:5px 10px!important;border-radius:7px!important;font-size:14px!important;white-space:nowrap}.callout-heading{font-weight:700;margin:16px 0 8px}.annotation-legend{counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"pair\"><main><header><h1>Stereo pair<\/h1><p>Set up, control and edit a stereo pair.<\/p><\/header><section class=\"new-section\" id=\"topic-0\"><h2>About stereo pairs in this app<\/h2><p>This guide registers two speakers as a left/right, linked-volume group in Flex4WiiM. This is distinct from importing or recreating an official WiiM Home stereo pair.<\/p><\/section><section id=\"topic-1\"><h2><span class=\"num step-label\">Step 1<\/span>Create a stereo pair<\/h2><p>Tap the grid icon on the main screen to open Create group. Enter a name, choose an icon colour, select “Stereo pair (linked volume)” as the type, and check the two devices to pair.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/1169.0848371220998\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:2.1384247922966595%;width:90%;height:95.29546545694735%\"><img src=\"images/71d795a90ec27af89b641d25ccbdd7cc67ec46470e470f09f1c26e4a6e5b9b6f.png\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:294.1176470588235%!important;left:-152.94117647058826%;top:-10.526315789473685%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1169.0848371220998\" aria-hidden=\"true\"><rect x=\"235.29411764705873\" y=\"200.90813217717363\" width=\"608.8235294117646\" height=\"703.6325287086945\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><ol class=\"manual-numbered\"><li><b>1<\/b><span>Enter a pair name.<\/span><\/li><li><b>2<\/b><span>Choose an icon colour.<\/span><\/li><li><b>3<\/b><span>Select Stereo pair (linked volume).<\/span><\/li><li><b>4<\/b><span>Select the two speakers to pair.<\/span><\/li><\/ol><figure><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/991.3157894736843\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:8.574462436952482%;width:90%;height:88.39925670294664%\"><img src=\"images/d933e16bf25faae44c8ffbce40dbf81c75910a1386c31ea476c0a60e56f1580b.png\" alt=\"Create a stereo pair\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 991.3157894736843\" aria-hidden=\"true\"><circle cx=\"90.05000000000001\" cy=\"262.0157894736842\" r=\"46\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"90.05000000000001\" y=\"263.0157894736842\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"56.12\" font-family=\"Arial,sans-serif\" font-weight=\"700\">1<\/text><circle cx=\"90.05000000000001\" cy=\"447.79473684210524\" r=\"46\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"90.05000000000001\" y=\"448.79473684210524\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"56.12\" font-family=\"Arial,sans-serif\" font-weight=\"700\">2<\/text><circle cx=\"90.05000000000001\" cy=\"616.9236842105263\" r=\"46\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"90.05000000000001\" y=\"617.9236842105263\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"56.12\" font-family=\"Arial,sans-serif\" font-weight=\"700\">3<\/text><circle cx=\"86.0\" cy=\"845.6421052631579\" r=\"46\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"86.0\" y=\"846.6421052631579\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"56.12\" font-family=\"Arial,sans-serif\" font-weight=\"700\">4<\/text><\/svg><\/div><\/figure><div class=\"note\"><ul><li>Example: WiiM Sound Lite and WiiM Sound.<\/li><\/ul><\/div><\/section><section id=\"topic-2\"><h2><span class=\"num step-label\">Step 2<\/span>Set the leader and channels<\/h2><p>Choose the leader device, then set the initial playback channel for each speaker. In this example, WiiM Sound Lite is the leader and plays Left (L), while WiiM Sound plays Right (R).<\/p><ol class=\"manual-numbered\"><li><b>1<\/b><span>Select the leader.<\/span><\/li><li><b>2<\/b><span>Set the left and right channels.<\/span><\/li><\/ol><figure><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/741.5086206896552\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:11.463116898215427%;width:90%;height:84.49107713770854%\"><img src=\"images/2a23acc6ad8b8eeb18a6c33c81b607c7c0c0155e82ae3ebf41e9533e7dc95d38.png\" alt=\"Set the leader and channels\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 741.5086206896552\" aria-hidden=\"true\"><circle cx=\"81.5\" cy=\"235.36206896551724\" r=\"44\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"81.5\" y=\"236.36206896551724\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"53.68\" font-family=\"Arial,sans-serif\" font-weight=\"700\">1<\/text><circle cx=\"81.5\" cy=\"511.0258620689656\" r=\"44\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"81.5\" y=\"512.0258620689656\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"53.68\" font-family=\"Arial,sans-serif\" font-weight=\"700\">2<\/text><\/svg><\/div><\/figure><div class=\"note\"><ul><li>Channel choices: Current (keep existing), Stereo (both channels), Left (L), and Right (R).<\/li><\/ul><\/div><\/section><section id=\"topic-3\"><h2><span class=\"num step-label\">Step 3<\/span>Lock stereo pair<\/h2><p>Turn “Lock stereo pair” on or off depending on how you want the pair maintained when changing connections in this app.<\/p><figure><img src=\"images/17058e3faf4d79e5d03776912638c754786ba6b1d30c8aa2764d69d91fce2bce.png\" alt=\"Lock stereo pair\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"warn\"><ul><li>On: the app keeps the speakers paired, retains or restores the pair when another group is released, and synchronizes pair volume and EQ. When activating the pair, a follower volume changed elsewhere is aligned with the leader. Single-device playback of either paired speaker is unavailable in this app while the lock is on.<\/li><li>Off: the app does not maintain pair connections or synchronize EQ. Volume changes preserve left/right differences. Theater automatic detachment can still restore registered pairs.<\/li><li>The lock applies to operations in this app. It does not monitor or reverse pair changes made in WiiM Home or other apps.<\/li><\/ul><\/div><\/section><section id=\"topic-4\"><h2><span class=\"num step-label\">Step 4<\/span>Save and check the pair<\/h2><p>Tap Save to store the pair; a group icon with ↔ appears on the main screen. Saving a new pair does not connect the speakers. Tap its icon to activate it, then check each speaker’s current channel.<\/p><figure><img src=\"images/36e18abb92b6f519960266a1e7edfd5ab7782f026227d73635a6b26dac64a5cf.png\" alt=\"Save and check the pair\" loading=\"eager\" decoding=\"async\"><\/figure><figure><img src=\"images/4ec31db7e1197b082c7e64982f7d88243b11c1cc1cf0a9700fef0396b1a4f950.png\" alt=\"Save and check the pair\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>Tap the pair icon to select it, or long press it to open the control screen.<\/li><\/ul><\/div><\/section><section id=\"topic-5\"><h2><span class=\"num step-label\">Step 5<\/span>Control the stereo pair<\/h2><p>Long press the stereo-pair icon to open its control screen. Adjust the member volumes, review or change the left/right channel assignments, and use “Swap L / R” to exchange the channels.<\/p><figure class=\"manual-detail\"><figcaption>Long press<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/611.8\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:13.893429225237005%;width:90%;height:81.203007518797%\"><img src=\"images/36e18abb92b6f519960266a1e7edfd5ab7782f026227d73635a6b26dac64a5cf.png\" alt=\"Long press\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 611.8\" aria-hidden=\"true\"><rect x=\"113.0\" y=\"119.77600000000001\" width=\"774.0\" height=\"427.248\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"644.0\" cy=\"308.56\" r=\"25\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"5\"><\/circle><circle cx=\"644.0\" cy=\"308.56\" r=\"14\" fill=\"#ed2244\" fill-opacity=\".22\" stroke=\"#ed2244\" stroke-width=\"3\"><\/circle><path d=\"M 679.0 346.56 L 651.0 314.56 L 656.0 351.56\" fill=\"white\" stroke=\"#ed2244\" stroke-width=\"4\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><\/figure><figure><img src=\"images/3ba66f7eca429771a65aacd23beaeaf0ba467ab9b945ac6d7859f4f2d832172c.png\" alt=\"Control the stereo pair\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>The control screen also shows the saved and current leader.<\/li><\/ul><\/div><\/section><section id=\"topic-6\"><h2><span class=\"num step-label\">Step 6<\/span>Show the channel swap button<\/h2><p>Enable “Show the channel swap switch on the pair icon”. A swap button then appears at the bottom centre of the stereo-pair icon. Tap it to exchange left and right without opening the control screen.<\/p><figure><img src=\"images/be94576ba87ef3c18c7bf31e825c6f6ae4cda63c53e629b8c0aeb97a301571cc.png\" alt=\"Show the channel swap button\" loading=\"eager\" decoding=\"async\"><\/figure><figure><img src=\"images/26a2d7c2caac89feec91f8b18e0ea6afb24dea48ab83c2b4f5f7cd33a8b067b5.png\" alt=\"Show the channel swap button\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-7\"><h2><span class=\"num step-label\">Step 7<\/span>Edit the stereo pair<\/h2><p>Tap the pencil icon in the pair control screen to open Edit group. You can change the group type, selected devices, leader and stereo-pair lock setting. Tap Save to apply these changes.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/651.1190168175939\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:3.839543824443936%;width:90%;height:91.55300358622334%\"><img src=\"images/0c71416836da5263638ee30dc4f49e69740f10bb46b10961f76a44dc4fbef298.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:238.09523809523813%!important;left:-85.71428571428571%;top:-3.571428571428571%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 651.1190168175939\" aria-hidden=\"true\"><rect x=\"285.7142857142858\" y=\"110.15985954537057\" width=\"225.0\" height=\"229.93162077250048\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><figure><img src=\"images/8c698afc262e9242405b96c8bfdc41eeb5f0e64b2bcad9cae5ec17283d7ba0ea.png\" alt=\"Edit the stereo pair\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>Name, colour and image are edited and saved automatically in the control popup.<\/li><\/ul><\/div><\/section><section id=\"topic-8\"><h2><span class=\"num step-label\">Step 8<\/span>Using the channel swap<\/h2><p>The swap is useful when the listener sits between a WiiM Bar / TV and the stereo pair, facing opposite directions for TV viewing and music listening.<\/p><figure><img src=\"images/1cba8eb6964f26e8a59640f5f5181831988fc637f03ddcdc589cd3239c7ed4cb.png\" alt=\"Using the channel swap\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>For TV viewing, face the WiiM Bar and swap left/right channels to suit that direction.<\/li><li>For music, face the stereo pair and swap again to restore the normal stereo orientation.<\/li><\/ul><\/div><\/section><\/main><\/body><\/html>"}, {"id": "theater", "group": "groups", "title": "Home theater & monitoring", "blocks": [{"id": "topic-0", "title": "Step 1Create a group", "text": "Step 1Create a groupOpen Create group from the grid icon. Enter a group name and choose an icon colour. Select “Home theater” as the type, check the member devices, and choose the leader.1234Numbers in this image1Name: enter a name for the group.2Colour: choose the group icon colour.3Type: select Home theater.4Check the member speakers, then choose the leader further down.In this example, “Bar” is the leader, with WiiM Sound Lite and WiiM Sound as rear speakers.Beforehand, configure the compatible home theater and surround speakers in WiiM Home."}, {"id": "topic-1", "title": "Step 2Activate the group", "text": "Step 2Activate the groupSet the rear speakers to their usual listening volume, then tap “Activate”. Wait for the operation to complete without closing the screen.Tap12Numbers in this image1Leader: select the device connected to the TV.2Set rears to their usual levels, then tap Activate. The first setup also records baseline levels.Activation saves and connects the group. On first setup, normal volume and mute baselines are recorded for members other than the leader.After the completion message, stay on this screen and continue to volume correction and automatic monitoring below.The screenshot still contains an instruction to save and reopen the editor. After successful activation, reopening is unnecessary: continue on the same screen."}, {"id": "topic-2", "title": "Step 3Set volume correction", "text": "Step 3Set volume correctionReview the recorded normal volumes and, if needed, enter a surround-only volume offset for the rear speakers. Leave the value at 0 if no adjustment is needed.123456Numbers in this image1Check the success message and continue on the same screen.2Review the recorded normal volume levels.3Volume offsets: enter the required rear-speaker offsets. See the text for when they apply.4Expand this section to configure automatic monitoring.5Save: saves the basic setup and closes the screen.6After configuring monitoring, use this button to save and start it.Example: a normal volume of 50 plus an offset of 10 results in 60.Volume corrections apply when automatic monitoring identifies HDMI audio as 5.1-channel. Manually selecting a group does not apply these corrections.For manual switching, tap the leader device icon to disconnect the group; tap the home theater group icon to reconnect it, then select the TV input.Basic home theater setup is complete. Tap Save to finish without automatic monitoring, or continue with the settings below."}, {"id": "topic-3", "title": "Step 4Choose the switching method", "text": "Step 4Choose the switching methodExpand “Automatic monitoring settings” and choose how the rear speakers behave when switching to stereo playback.12345Numbers in this image1Switching method: choose Mute or Ungroup.2Check the inputs that should use the rear speakers.3Enable HDMI stereo/5.1 detection if required.4Review advanced settings, long-running checks and screen-off guidance.5Save the settings and start monitoring on this device.Mute: keeps the group connected and automatically mutes or unmutes rear speakers.Ungroup: disconnects the rear speakers for stereo playback and restores registered stereo pairs; the group reconnects for selected surround inputs."}, {"id": "topic-4", "title": "Step 5Configure inputs and options", "text": "Step 5Configure inputs and optionsSelect the inputs on which the rear speakers should play. Checked inputs use the rears; unchecked inputs do not.Optionally enable automatic stereo/5.1 detection using HDMI audio information.For the Mute method, Advanced settings can mute followers when stop or pause is detected."}, {"id": "topic-5", "title": "Step 6Save and start monitoring", "text": "Step 6Save and start monitoringTap “Save and start automatic switching on this device”. If Android asks for notification permission, grant it and start again. A confirmation message appears.Monitoring continues in the background with the screen off.Manual playback, volume, input or group operations in this app stop monitoring."}, {"id": "topic-6", "title": "Step 7Start monitoring", "text": "Step 7Start monitoringWhen the “Background monitoring started” message appears, tap “Got it” to close it.Monitoring can continue while the screen is off. Android battery optimisation or other system restrictions may interrupt it."}, {"id": "topic-7", "title": "Step 8Control from notifications", "text": "Step 8Control from notificationsOpen the Android notification panel to check the monitoring status. Tap “Stop” to stop monitoring. After stopping, tap “Resume” to restart it.The notification can also show status and connection information."}, {"id": "topic-8", "title": "Step 9Use the Quick Settings tile", "text": "Step 9Use the Quick Settings tileOpen Android Quick Settings editing, find “Theater Monitor” and add it to the panel. Tap the tile to turn monitoring on or off.The tile can be used without opening the app.Quick Settings editing differs by Android device."}, {"id": "manual-theater-beta", "title": "Manual home theater switching (beta)", "text": "Manual home theater switching (beta)Open the home theater group editor. Activate the group and record the normal follower volumes using the existing baseline controls. If you adjust those volumes, record them again. Configure the follower corrections, then use the separate Manual switching (beta) options and save.1231Volume correction: enable this option to apply the recorded normal volume plus the saved correction. Repeated activation does not keep adding the correction. Volume stays within 0–100; linked pairs retain their recorded level difference.2Channels: enable this independently of volume correction. Channel-only operation does not require a volume baseline.3Choose Left (L), Right (R), or Stereo for every follower, then save the group.Tap the saved group icon or recall one of its scenes. For scenes with playback content, the manual settings are applied after playback or the preset starts and the resulting group is verified. The editor’s Activate button and scheduled alarm recalls do not apply these options.When leaving through this app, the changed fields are restored to the recorded normal volume and previous channels if the original group and device identities can still be verified. Later external changes are preserved. If another app or a preset has already changed the group, automatic restoration is not guaranteed.Both options are off by default and separate from automatic monitoring. Manual activation does not wait for HDMI 5.1 detection. If the group changes or volume correction reports a missing baseline, record the normal volumes again. The feature remains beta; check actual follower levels and channel routing."}], "text": "Home theater & monitoringBasic setup and automatic monitoringBasic setupStep 1Create a groupOpen Create group from the grid icon. Enter a group name and choose an icon colour. Select “Home theater” as the type, check the member devices, and choose the leader.1234Numbers in this image1Name: enter a name for the group.2Colour: choose the group icon colour.3Type: select Home theater.4Check the member speakers, then choose the leader further down.In this example, “Bar” is the leader, with WiiM Sound Lite and WiiM Sound as rear speakers.Beforehand, configure the compatible home theater and surround speakers in WiiM Home.Step 2Activate the groupSet the rear speakers to their usual listening volume, then tap “Activate”. Wait for the operation to complete without closing the screen.Tap12Numbers in this image1Leader: select the device connected to the TV.2Set rears to their usual levels, then tap Activate. The first setup also records baseline levels.Activation saves and connects the group. On first setup, normal volume and mute baselines are recorded for members other than the leader.After the completion message, stay on this screen and continue to volume correction and automatic monitoring below.The screenshot still contains an instruction to save and reopen the editor. After successful activation, reopening is unnecessary: continue on the same screen.Step 3Set volume correctionReview the recorded normal volumes and, if needed, enter a surround-only volume offset for the rear speakers. Leave the value at 0 if no adjustment is needed.123456Numbers in this image1Check the success message and continue on the same screen.2Review the recorded normal volume levels.3Volume offsets: enter the required rear-speaker offsets. See the text for when they apply.4Expand this section to configure automatic monitoring.5Save: saves the basic setup and closes the screen.6After configuring monitoring, use this button to save and start it.Example: a normal volume of 50 plus an offset of 10 results in 60.Volume corrections apply when automatic monitoring identifies HDMI audio as 5.1-channel. Manually selecting a group does not apply these corrections.For manual switching, tap the leader device icon to disconnect the group; tap the home theater group icon to reconnect it, then select the TV input.Basic home theater setup is complete. Tap Save to finish without automatic monitoring, or continue with the settings below.Automatic monitoringStep 4Choose the switching methodExpand “Automatic monitoring settings” and choose how the rear speakers behave when switching to stereo playback.12345Numbers in this image1Switching method: choose Mute or Ungroup.2Check the inputs that should use the rear speakers.3Enable HDMI stereo/5.1 detection if required.4Review advanced settings, long-running checks and screen-off guidance.5Save the settings and start monitoring on this device.Mute: keeps the group connected and automatically mutes or unmutes rear speakers.Ungroup: disconnects the rear speakers for stereo playback and restores registered stereo pairs; the group reconnects for selected surround inputs.Step 5Configure inputs and optionsSelect the inputs on which the rear speakers should play. Checked inputs use the rears; unchecked inputs do not.Optionally enable automatic stereo/5.1 detection using HDMI audio information.For the Mute method, Advanced settings can mute followers when stop or pause is detected.Step 6Save and start monitoringTap “Save and start automatic switching on this device”. If Android asks for notification permission, grant it and start again. A confirmation message appears.Monitoring continues in the background with the screen off.Manual playback, volume, input or group operations in this app stop monitoring.Step 7Start monitoringWhen the “Background monitoring started” message appears, tap “Got it” to close it.Monitoring can continue while the screen is off. Android battery optimisation or other system restrictions may interrupt it.Step 8Control from notificationsOpen the Android notification panel to check the monitoring status. Tap “Stop” to stop monitoring. After stopping, tap “Resume” to restart it.The notification can also show status and connection information.Step 9Use the Quick Settings tileOpen Android Quick Settings editing, find “Theater Monitor” and add it to the panel. Tap the tile to turn monitoring on or off.The tile can be used without opening the app.Quick Settings editing differs by Android device.Manual home theater switching (beta)Open the home theater group editor. Activate the group and record the normal follower volumes using the existing baseline controls. If you adjust those volumes, record them again. Configure the follower corrections, then use the separate Manual switching (beta) options and save.1231Volume correction: enable this option to apply the recorded normal volume plus the saved correction. Repeated activation does not keep adding the correction. Volume stays within 0–100; linked pairs retain their recorded level difference.2Channels: enable this independently of volume correction. Channel-only operation does not require a volume baseline.3Choose Left (L), Right (R), or Stereo for every follower, then save the group.Tap the saved group icon or recall one of its scenes. For scenes with playback content, the manual settings are applied after playback or the preset starts and the resulting group is verified. The editor’s Activate button and scheduled alarm recalls do not apply these options.When leaving through this app, the changed fields are restored to the recorded normal volume and previous channels if the original group and device identities can still be verified. Later external changes are preserved. If another app or a preset has already changed the group, automatic restoration is not guaranteed.Both options are off by default and separate from automatic monitoring. Manual activation does not wait for HDMI 5.1 detection. If the group changes or volume correction reports a missing baseline, record the normal volumes again. The feature remains beta; check actual follower levels and channel routing.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Home Theater Group Setup Guide<\/title><style>*{box-sizing:border-box}body{margin:0;background:white;color:#24213a;font:16px/1.65 system-ui,-apple-system,\"Noto Sans\",sans-serif}main{max-width:760px;margin:auto;padding:12px 14px 40px}header{background:linear-gradient(110deg,#46009f,#6510b5);border-radius:14px;color:white;padding:19px 20px}header h1{font-size:clamp(22px,5vw,31px);line-height:1.25;margin:0}header p{margin:8px 0 0;color:#f5eaff}.part{margin:23px 3px 12px;border-bottom:2px solid #e7dafa;color:#6814ba;font-size:20px;font-weight:800;padding-bottom:5px}section{border:1px solid #e8e2f1;border-radius:16px;padding:17px;margin:15px 0}h2{font-size:21px;color:#6512b8;line-height:1.3;margin:0 0 10px;display:flex;align-items:center;gap:11px}.num{display:inline-grid;place-items:center;flex:0 0 42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#f60076,#ad31cc);color:white;font-weight:800}p{margin:9px 0}figure{margin:14px 0}figure img{display:block;width:100%;height:auto;border-radius:10px;background:#18141e}ul{padding-left:23px;margin:10px 0}li{margin:8px 0}.note{background:#eaf2ff;color:#244b83;padding:11px 14px;border-radius:10px;margin:13px 0}.important{background:#fff0f7;color:#9e115c;padding:12px 14px;border-radius:10px;margin:13px 0;font-weight:650}footer{color:#777;font-size:13px;margin:20px 3px}@media(max-width:420px){main{padding:9px 10px 30px}section{padding:13px}h2{font-size:19
