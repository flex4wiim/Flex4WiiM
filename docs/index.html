ion-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"local\"><main><header><div class=\"brand\">Flex4WiiM<\/div><h1>My Music<\/h1><p>Browse, search, and play music stored in your Android device’s Music folder.<\/p><\/header><section class=\"step\" id=\"topic-0\"><div class=\"head\"><span class=\"num step-label\">Step 1<\/span><h2>Enable the My music section<\/h2><\/div><div class=\"shot\"><img alt=\"Flex4WiiM My Music step 1\" loading=\"eager\" src=\"images/05dc4b639dabc9e44e3878bca3248d5205d294a5d8ee684872f48365f2e3c7cd.jpg\" decoding=\"async\"><\/div><p>Open the app settings and, under “Layout”, check “My music”. The section will appear on the main screen. You can drag the reorder handle to change its position.<\/p><\/section><section class=\"step\" id=\"topic-1\"><div class=\"head\"><span class=\"num step-label\">Step 2<\/span><h2>Open My music and allow access<\/h2><\/div><div class=\"shot\"><img alt=\"Flex4WiiM My Music step 2\" loading=\"eager\" src=\"images/caed0f96e05f917d3e65c6c3f6c15cfcdd1745517251806cd37fb3e1259db367.jpg\" decoding=\"async\"><\/div><p>Tap “My music” on the main screen, then tap “Load music”. When Android requests permission to access music and audio files, tap “Allow”. The app will then read the Music folder on your device.<\/p><\/section><section class=\"step\" id=\"topic-2\"><div class=\"head\"><span class=\"num step-label\">Step 3<\/span><h2>Browse and play music<\/h2><\/div><div class=\"shot\"><img alt=\"Flex4WiiM My Music step 3\" loading=\"eager\" src=\"images/ae4974e7617404851e058372466042284c906d775fa536c4cddf74940ca3d9d2.jpg\" decoding=\"async\"><\/div><p>Use the tabs to switch between Folders, Albums, Artists, Tracks, Album artists, Composers, and Genres. Use the search box to find music. Change the display order with the sort menu and toggle ascending/descending order with the arrow. Tap a folder to browse inside it, the play button to start playback, or the shuffle button for random playback. Tap the refresh icon at the top right to reload the music list, or the home icon to return to the app’s main screen. The shuffle button starts random playback of music in the current view. Tap “+ Scene” to open the scene creation screen and register the selected music folder as a scene for quick playback.<\/p><\/section><section class=\"step\" id=\"topic-3\"><div class=\"head\"><span class=\"num step-label\">Step 4<\/span><h2>Play from recently played music<\/h2><\/div><div class=\"shot\"><img alt=\"Flex4WiiM My Music step 4\" loading=\"eager\" src=\"images/24d5a61c360268c6d3468dfc860d9a9dc7c984b03247ee0ff60bb6f1f621ae62.jpg\" decoding=\"async\"><\/div><p>The My music section shows up to five recently played items. Tap an item to play it again. Tap “More” to view the complete playback history, or “Clear history” to delete the history.<\/p><\/section><\/main><\/body><\/html>"}, {"id": "scenes", "group": "music", "title": "Scenes", "blocks": [{"id": "update133-0", "title": "Register scenes for every device and group", "text": "Register scenes for every device and group11Tap the bulk-registration icon immediately left of History in Scenes. This is separate from the add/update buttons in an individual scene editor, which apply only to that scene’s target."}, {"id": "update133-1", "title": "Choose what to register", "text": "Choose what to register11Choose Presets, My Music, or Open Network Stream. Presets are read from each device or each group’s current saved leader. My Music folders and registered streams create separate scenes for each target. Prepare the folders or streams first. This operation does not start playback or change speaker connections."}, {"id": "update133-2", "title": "Review the results and register", "text": "Review the results and register11Review New, Updated and Skipped, then tap Register. Unreachable or identity-mismatched targets are skipped; their existing scenes remain. Existing matching scenes are updated rather than duplicated. The limit remains 500 scenes; if the batch would exceed it, nothing is saved. Closing the dialog cancels registration."}, {"id": "update133-3", "title": "Specify a missing preset number", "text": "Specify a missing preset number11In Create scene, select Preset, then Specify preset number. Choose a number and enter its name on the same row; check the scene name, then Save. Only numbers 1–12 missing from a successfully retrieved preset list are offered. Manual entries are saved as scenes; they do not add presets to the device’s automatic list. Saving does not execute the preset. When recalled, a preset may also restore output or group settings saved in WiiM Home. For example, a headphone preset that includes a group change will perform both actions."}, {"id": "topic-0", "title": "Step 1Open the Create Scene screen", "text": "Step 1Open the Create Scene screenSelect the device or group you want to use, then tap the + button on its device card."}, {"id": "topic-1", "title": "Step 2Enter scene details", "text": "Step 2Enter scene detailsEnter the scene name, optional notes, and playback source. The device/group field is fixed.123456Numbers in this image1Check the target device/group.2Scene name: the button label for an individually saved scene.3Notes: shown only in the editor.4Playback source: choose setup only, a preset, My Music or a stream.5Bulk registration: add/update presets, streams or My Music folders.6Save: saves an individual scene with the entered details.The scene name becomes the button label under the device/group tab. Notes are for editing only and do not appear in the Scenes list.The device/group tab retains its device/group name, even when the scene button has a different name."}, {"id": "topic-2", "title": "Step 3Select a playback source", "text": "Step 3Select a playback sourceTap Playback source and choose one of the four available options.Setup only: switch the saved device/group setup without starting music.Preset: choose an existing WiiM preset.My music folder: choose a folder from My Music on your Android device.Open Network Stream: choose a registered network stream, such as internet radio.Available sources depend on device, service, and app settings. For bulk registration, the preset/folder/stream name is used as the scene name."}, {"id": "topic-3", "title": "Step 4Add or update all presets", "text": "Step 4Add or update all presetsChoose Preset as the playback source and tap Add / update all presets. All registered presets for the selected device or group are added or updated as scene buttons.Existing scenes are matched by their target and playback content, such as the preset number—not by name alone. This does not change the presets on the WiiM device."}, {"id": "topic-4", "title": "Bulk-add streams and My Music as scenes", "text": "Bulk-add streams and My Music as scenesUse Add / update all streams for registered streams, or Add / update My music folders for My Music folders, to add or update scenes for the selected device/group. Register streams or prepare music folders first.Bulk registration uses each preset, stream or folder name instead of the name entered in Scene name. Review the confirmation when existing scenes will be updated.For a Home Music Share folder, open the folder and use + Scene to register it."}, {"id": "topic-5", "title": "Step 5View registered scenes", "text": "Step 5View registered scenesThe device/group tab displays scene buttons using the registered preset names."}, {"id": "topic-6", "title": "Step 6Play a scene", "text": "Step 6Play a sceneSelect a device/group tab and tap the desired scene button. The saved configuration is activated and playback starts when the scene includes music."}, {"id": "topic-7", "title": "Step 7Switch between tabs", "text": "Step 7Switch between tabsSwitch among device/group tabs such as Bedroom, Living, and Living+Bed to display their scenes."}, {"id": "topic-8", "title": "Step 8Check scene history", "text": "Step 8Check scene historyTap History on the Scenes screen to open the shared history for all devices and groups. Tap a history item to play that scene again.History may show the scene name, device/group, date and time, and artwork when available. The most recently used scene appears first. Tap Clear history to delete history.The number of stored records and playback time information may vary."}, {"id": "topic-9", "title": "Step 9Open Manage scenes", "text": "Step 9Open Manage scenesTap the pencil icon on the Scenes screen to open Manage scenes. Reorder scene buttons and tabs, collapse categories, or delete scenes.Deleting scenes does not delete WiiM device presets or groups."}, {"id": "topic-10", "title": "Step 10Reorder scene buttons", "text": "Step 10Reorder scene buttonsLong-press and drag the ≡ handle beside a scene to change its order."}, {"id": "topic-11", "title": "Step 11Reorder device/group tabs", "text": "Step 11Reorder device/group tabsDrag the ≡ handle beside each category to change the tab order, including collapsed categories."}, {"id": "topic-12", "title": "Step 12Collapse or expand categories", "text": "Step 12Collapse or expand categoriesTap a category name to collapse or expand its list of scene buttons."}, {"id": "topic-13", "title": "Step 13Delete selected scenes", "text": "Step 13Delete selected scenesCheck one or more scenes, then tap Delete selected. Tap Delete all to remove every scene."}, {"id": "topic-14", "title": "Step 14Delete all scenes in one category", "text": "Step 14Delete all scenes in one categoryTap Delete target scenes for the desired category."}, {"id": "topic-15", "title": "Step 15Organize with collapsed categories", "text": "Step 15Organize with collapsed categoriesCollapse all categories to make tab reordering easier. Changes are saved automatically.Deleting scenes leaves device presets and groups unchanged."}, {"id": "topic-16", "title": "Step 16Edit a Scene (Long Press)", "text": "Step 16Edit a Scene (Long Press)Long press a scene button to open the Edit scene screen. You can review and update its settings.Long pressDevice / group：Shows the device or group assigned to this scene.Scene name：Change the name displayed on the scene button.Notes (editor only)：Add a private memo. It is not shown in the scene list.Leader：Displays the leader associated with the scene configuration.Playback source and preset：Review or change the playback source and, for Preset, select the preset to use.Change image：Choose a different image for the scene button.Save：Save your edits.Delete this scene：Delete this scene button."}, {"id": "operation-complete", "title": "Completing an operation", "text": "Completing an operationThe scene picker closes when a scene recall is accepted; progress and errors appear on the main screen. Device registration closes after the selected devices are saved successfully. Bulk scene registration closes when nothing was skipped. Failed checks, import issues, and skipped targets remain visible. Image, colour, volume, and channel adjustment panels stay open for further changes."}, {"id": "scene-tab-swipe-139", "title": "Scenes", "text": "In tab view, swipe the scene grid left for the next device/group tab or right for the previous tab. The first and last tabs wrap around. This works on the home screen and in the scene picker. Changing tabs does not change playback or group connections. Vertical scrolling, tap-to-recall and hold-to-edit remain available."}], "text": "ScenesRegister scenes for every device and group11Tap the bulk-registration icon immediately left of History in Scenes. This is separate from the add/update buttons in an individual scene editor, which apply only to that scene’s target.Choose what to register11Choose Presets, My Music, or Open Network Stream. Presets are read from each device or each group’s current saved leader. My Music folders and registered streams create separate scenes for each target. Prepare the folders or streams first. This operation does not start playback or change speaker connections.Review the results and register11Review New, Updated and Skipped, then tap Register. Unreachable or identity-mismatched targets are skipped; their existing scenes remain. Existing matching scenes are updated rather than duplicated. The limit remains 500 scenes; if the batch would exceed it, nothing is saved. Closing the dialog cancels registration.Specify a missing preset number11In Create scene, select Preset, then Specify preset number. Choose a number and enter its name on the same row; check the scene name, then Save. Only numbers 1–12 missing from a successfully retrieved preset list are offered. Manual entries are saved as scenes; they do not add presets to the device’s automatic list. Saving does not execute the preset. When recalled, a preset may also restore output or group settings saved in WiiM Home. For example, a headphone preset that includes a group change will perform both actions.Step 1Open the Create Scene screenSelect the device or group you want to use, then tap the + button on its device card.Step 2Enter scene detailsEnter the scene name, optional notes, and playback source. The device/group field is fixed.123456Numbers in this image1Check the target device/group.2Scene name: the button label for an individually saved scene.3Notes: shown only in the editor.4Playback source: choose setup only, a preset, My Music or a stream.5Bulk registration: add/update presets, streams or My Music folders.6Save: saves an individual scene with the entered details.The scene name becomes the button label under the device/group tab. Notes are for editing only and do not appear in the Scenes list.The device/group tab retains its device/group name, even when the scene button has a different name.Step 3Select a playback sourceTap Playback source and choose one of the four available options.Setup only: switch the saved device/group setup without starting music.Preset: choose an existing WiiM preset.My music folder: choose a folder from My Music on your Android device.Open Network Stream: choose a registered network stream, such as internet radio.Available sources depend on device, service, and app settings. For bulk registration, the preset/folder/stream name is used as the scene name.Step 4Add or update all presetsChoose Preset as the playback source and tap Add / update all presets. All registered presets for the selected device or group are added or updated as scene buttons.Existing scenes are matched by their target and playback content, such as the preset number—not by name alone. This does not change the presets on the WiiM device.Bulk-add streams and My Music as scenesUse Add / update all streams for registered streams, or Add / update My music folders for My Music folders, to add or update scenes for the selected device/group. Register streams or prepare music folders first.Bulk registration uses each preset, stream or folder name instead of the name entered in Scene name. Review the confirmation when existing scenes will be updated.For a Home Music Share folder, open the folder and use + Scene to register it.Step 5View registered scenesThe device/group tab displays scene buttons using the registered preset names.Step 6Play a sceneSelect a device/group tab and tap the desired scene button. The saved configuration is activated and playback starts when the scene includes music.Step 7Switch between tabsSwitch among device/group tabs such as Bedroom, Living, and Living+Bed to display their scenes.Step 8Check scene historyTap History on the Scenes screen to open the shared history for all devices and groups. Tap a history item to play that scene again.History may show the scene name, device/group, date and time, and artwork when available. The most recently used scene appears first. Tap Clear history to delete history.The number of stored records and playback time information may vary.Step 9Open Manage scenesTap the pencil icon on the Scenes screen to open Manage scenes. Reorder scene buttons and tabs, collapse categories, or delete scenes.Deleting scenes does not delete WiiM device presets or groups.Step 10Reorder scene buttonsLong-press and drag the ≡ handle beside a scene to change its order.Step 11Reorder device/group tabsDrag the ≡ handle beside each category to change the tab order, including collapsed categories.Step 12Collapse or expand categoriesTap a category name to collapse or expand its list of scene buttons.Step 13Delete selected scenesCheck one or more scenes, then tap Delete selected. Tap Delete all to remove every scene.Step 14Delete all scenes in one categoryTap Delete target scenes for the desired category.Step 15Organize with collapsed categoriesCollapse all categories to make tab reordering easier. Changes are saved automatically.Deleting scenes leaves device presets and groups unchanged.Step 16Edit a Scene (Long Press)Long press a scene button to open the Edit scene screen. You can review and update its settings.Long pressDevice / group：Shows the device or group assigned to this scene.Scene name：Change the name displayed on the scene button.Notes (editor only)：Add a private memo. It is not shown in the scene list.Leader：Displays the leader associated with the scene configuration.Playback source and preset：Review or change the playback source and, for Preset, select the preset to use.Change image：Choose a different image for the scene button.Save：Save your edits.Delete this scene：Delete this scene button.Completing an operationThe scene picker closes when a scene recall is accepted; progress and errors appear on the main screen. Device registration closes after the selected devices are saved successfully. Bulk scene registration closes when nothing was skipped. Failed checks, import issues, and skipped targets remain visible. Image, colour, volume, and channel adjustment panels stay open for further changes. In tab view, swipe the scene grid left for the next device/group tab or right for the previous tab. The first and last tabs wrap around. This works on the home screen and in the on:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"scenes\"><main><header><h1>Scenes<\/h1><\/header><section class=\"manual-update\" id=\"update133-0\"><h2>Register scenes for every device and group<\/h2><div class=\"annotation-stage\" data-source=\"01-3920.jpg\"><img src=\"images/v133-01-3920.jpg\" alt=\"Register scenes for every device and group\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1536 357\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"960.0\" y=\"67.83\" width=\"115.19999999999999\" height=\"114.24000000000001\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"1013.76\" cy=\"57.760000000000005\" r=\"53.760000000000005\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"1013.76\" y=\"57.760000000000005\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"67.2\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Tap the bulk-registration icon immediately left of History in Scenes. This is separate from the add/update buttons in an individual scene editor, which apply only to that scene’s target.<\/span><\/li><\/ol><\/section><section class=\"manual-update\" id=\"update133-1\"><h2>Choose what to register<\/h2><div class=\"annotation-stage\" data-source=\"02-3922.jpg\"><img src=\"images/v133-02-3922.jpg\" alt=\"Choose what to register\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1536 1079\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"84.48\" y=\"399.23\" width=\"1359.3600000000001\" height=\"539.5\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"138.24\" cy=\"341.47\" r=\"53.760000000000005\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"138.24\" y=\"341.47\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"67.2\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Choose Presets, My Music, or Open Network Stream. Presets are read from each device or each group’s current saved leader. My Music folders and registered streams create separate scenes for each target. Prepare the folders or streams first. This operation does not start playback or change speaker connections.<\/span><\/li><\/ol><\/section><section class=\"manual-update\" id=\"update133-2\"><h2>Review the results and register<\/h2><div class=\"annotation-stage\" data-source=\"03-3924.jpg\"><img src=\"images/v133-03-3924.jpg\" alt=\"Review the results and register\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1536 1458\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"92.16\" y=\"976.86\" width=\"1336.32\" height=\"349.91999999999996\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"145.92000000000002\" cy=\"919.1\" r=\"53.760000000000005\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"145.92000000000002\" y=\"919.1\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"67.2\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Review New, Updated and Skipped, then tap Register. Unreachable or identity-mismatched targets are skipped; their existing scenes remain. Existing matching scenes are updated rather than duplicated. The limit remains 500 scenes; if the batch would exceed it, nothing is saved. Closing the dialog cancels registration.<\/span><\/li><\/ol><\/section><section class=\"manual-update\" id=\"update133-3\"><h2>Specify a missing preset number<\/h2><div class=\"annotation-stage\" data-source=\"04-3926.jpg\"><img src=\"images/v133-04-3926.jpg\" alt=\"Specify a missing preset number\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 772 1536\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"42.46\" y=\"806.4000000000001\" width=\"687.08\" height=\"238.07999999999998\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"72.46000000000001\" cy=\"772.4000000000001\" r=\"30\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"72.46000000000001\" y=\"772.4000000000001\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"37.5\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>In Create scene, select Preset, then Specify preset number. Choose a number and enter its name on the same row; check the scene name, then Save. Only numbers 1–12 missing from a successfully retrieved preset list are offered. Manual entries are saved as scenes; they do not add presets to the device’s automatic list. Saving does not execute the preset. When recalled, a preset may also restore output or group settings saved in WiiM Home. For example, a headphone preset that includes a group change will perform both actions.<\/span><\/li><\/ol><\/section><section id=\"topic-0\"><h2><span class=\"num step-label\">Step 1<\/span>Open the Create Scene screen<\/h2><p>Select the device or group you want to use, then tap the + button on its device card.<\/p><figure><img loading=\"eager\" src=\"images/3d9410bc3fe6196053d07e9f4c6b08835a92c3c56123cfde15c1a0beaec0f852.jpg\" alt=\"Open the Create Scene screen\" decoding=\"async\"><\/figure><\/section><section id=\"topic-1\"><h2><span class=\"num step-label\">Step 2<\/span>Enter scene details<\/h2><p>Enter the scene name, optional notes, and playback source. The device/group field is fixed.<\/p><figure><div class=\"annotation-stage\" data-source=\"01-3870.jpg\"><img loading=\"eager\" src=\"images/f0cad1abffbae0aebecde0b4aba0c8253c7d4509a2af66b5531cb417e9d081b5.jpg\" alt=\"Enter scene details\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1761.467889908257\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"45.0\" y=\"220.18348623853208\" width=\"910\" height=\"98.64220183486238\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"193.76146788990826\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"193.76146788990826\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"45.0\" y=\"387.5229357798165\" width=\"910\" height=\"98.64220183486238\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"361.10091743119267\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"361.10091743119267\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><rect x=\"45.0\" y=\"554.862385321101\" width=\"910\" height=\"184.954128440367\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"528.440366972477\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"528.440366972477\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">3<\/text><rect x=\"45.0\" y=\"898.348623853211\" width=\"910\" height=\"100.40366972477064\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"871.9266055045872\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"871.9266055045872\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">4<\/text><rect x=\"45.0\" y=\"1144.954128440367\" width=\"910\" height=\"343.48623853211006\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"1127.3394495412845\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"1127.3394495412845\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">5<\/text><rect x=\"45.0\" y=\"1555.3761467889908\" width=\"910\" height=\"105.6880733944954\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"1532.4770642201836\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"1532.4770642201836\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">6<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Check the target device/group.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Scene name: the button label for an individually saved scene.<\/span><\/li><li><span class=\"badge\">3<\/span><span>Notes: shown only in the editor.<\/span><\/li><li><span class=\"badge\">4<\/span><span>Playback source: choose setup only, a preset, My Music or a stream.<\/span><\/li><li><span class=\"badge\">5<\/span><span>Bulk registration: add/update presets, streams or My Music folders.<\/span><\/li><li><span class=\"badge\">6<\/span><span>Save: saves an individual scene with the entered details.<\/span><\/li><\/ol><\/figure><div class=\"note\"><p>The scene name becomes the button label under the device/group tab. Notes are for editing only and do not appear in the Scenes list.<\/p><p>The device/group tab retains its device/group name, even when the scene button has a different name.<\/p><\/div><\/section><section id=\"topic-2\"><h2><span class=\"num step-label\">Step 3<\/span>Select a playback source<\/h2><p>Tap Playback source and choose one of the four available options.<\/p><figure><img loading=\"eager\" src=\"images/f54d863a0b244fd03851a3bf2eaa64ed0e288dc1ac63b4d51010d8c2f5958084.jpg\" alt=\"Select a playback source\" decoding=\"async\"><\/figure><figure><img loading=\"eager\" src=\"images/e51ddd936f51abc85014db8783b506c6ba83aa1a57e69daab2d2fcc4e2792fa4.jpg\" alt=\"Select a playback source\" decoding=\"async\"><\/figure><figure><img loading=\"eager\" src=\"images/854b5eeb2d66396410fc57f824abed82062859ffcecd745f1b22bf8614bfa8ac.jpg\" alt=\"Select a playback source\" decoding=\"async\"><\/figure><figure><img loading=\"eager\" src=\"images/236d8e24e6a7cb29e5b931cea898ec84472d6d205e543e58ed769c9f3ebf642f.jpg\" alt=\"Select a playback source\" decoding=\"async\"><\/figure><figure><img loading=\"eager\" src=\"images/2a67414f4b58268f9f93b56c9365bde7faf31cf0b683f9203f9f3fd3a0386185.jpg\" alt=\"Select a playback source\" decoding=\"async\"><\/figure><div class=\"note\"><p>Setup only: switch the saved device/group setup without starting music.<\/p><p>Preset: choose an existing WiiM preset.<\/p><p>My music folder: choose a folder from My Music on your Android device.<\/p><p>Open Network Stream: choose a registered network stream, such as internet radio.<\/p><p>Available sources depend on device, service, and app settings. For bulk registration, the preset/folder/stream name is used as the scene name.<\/p><\/div><\/section><section id=\"topic-3\"><h2><span class=\"num step-label\">Step 4<\/span>Add or update all presets<\/h2><p>Choose Preset as the playback source and tap Add / update all presets. All registered presets for the selected device or group are added or updated as scene buttons.<\/p><figure><img loading=\"eager\" src=\"images/32afa54ef762b7e41f97ca236101a6d24ec192520816295c2c09aa426ba0233d.jpg\" alt=\"Add or update all presets\" decoding=\"async\"><\/figure><div class=\"note\"><p>Existing scenes are matched by their target and playback content, such as the preset number—not by name alone. This does not change the presets on the WiiM device.<\/p><\/div><\/section><section class=\"new-section\" id=\"topic-4\"><h2>Bulk-add streams and My Music as scenes<\/h2><p>Use Add / update all streams for registered streams, or Add / update My music folders for My Music folders, to add or update scenes for the selected device/group. Register streams or prepare music folders first.<\/p><p>Bulk registration uses each preset, stream or folder name instead of the name entered in Scene name. Review the confirmation when existing scenes will be updated.<\/p><p>For a Home Music Share folder, open the folder and use + Scene to register it.<\/p><\/section><section id=\"topic-5\"><h2><span class=\"num step-label\">Step 5<\/span>View registered scenes<\/h2><p>The device/group tab displays scene buttons using the registered preset names.<\/p><figure><img loading=\"eager\" src=\"images/8cc510755c2cfd0ea1ab349ff6ad9dc9f02f08b85a0cd94fbea36befe2eec662.jpg\" alt=\"View registered scenes\" decoding=\"async\"><\/figure><\/section><section id=\"topic-6\"><h2><span class=\"num step-label\">Step 6<\/span>Play a scene<\/h2><p>Select a device/group tab and tap the desired scene button. The saved configuration is activated and playback starts when the scene includes music.<\/p><figure><img loading=\"eager\" src=\"images/c8ec873d070b8cbac634d54b8abedccb9dae2eedc023a4a53a59a381ded65fc0.jpg\" alt=\"Play a scene\" decoding=\"async\"><\/figure><\/section><section id=\"topic-7\"><h2><span class=\"num step-label\">Step 7<\/span>Switch between tabs<\/h2><p>Switch among device/group tabs such as Bedroom, Living, and Living+Bed to display their scenes.<\/p><figure><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/206.74418604651163\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:12.092238470191226%;width:90%;height:73.3970753655793%\"><img src=\"images/81da065c8488e375ee8d49275bb17e9ac64c14806ec0c1ac5f3c81657c58aa3a.jpg\" alt=\"Switch between tabs\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 206.74418604651163\" aria-hidden=\"true\"><rect x=\"81.5\" y=\"103.90697674418605\" width=\"576.0\" height=\"65.25000000000001\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><\/section><section id=\"topic-8\"><h2><span class=\"num step-label\">Step 8<\/span>Check scene history<\/h2><p>Tap History on the Scenes screen to open the shared history for all devices and groups. Tap a history item to play that scene again.<\/p><figure><img loading=\"eager\" src=\"images/8a50b8a44df2b468318b0843a1cf3898fd91e8e7d4d137e33fe9846ade7f1d7d.jpg\" alt=\"Check scene history\" decoding=\"async\"><\/figure><figure><img loading=\"eager\" src=\"images/b7435955ef63528d130490f03a567fdfacaec28d165dafb63fad3d9ca89361c8.jpg\" alt=\"Check scene history\" decoding=\"async\"><\/figure><div class=\"note\"><p>History may show the scene name, device/group, date and time, and artwork when available. The most recently used scene appears first. Tap Clear history to delete history.<\/p><p>The number of stored records and playback time information may vary.<\/p><\/div><\/section><section id=\"topic-9\"><h2><span class=\"num step-label\">Step 9<\/span>Open Manage scenes<\/h2><p>Tap the pencil icon on the Scenes screen to open Manage scenes. Reorder scene buttons and tabs, collapse categories, or delete scenes.<\/p><figure><img loading=\"eager\" src=\"images/55d5906ab8346b3e3145ef03937bd9e0c435bbddc74993547111f44545ebb81b.jpg\" alt=\"Open Manage scenes\" decoding=\"async\"><\/figure><figure><img loading=\"eager\" src=\"images/64d6843d575f262d1c760972e2d53c21d634cff2f3140cd1c5d0d1491d480498.jpg\" alt=\"Open Manage scenes\" decoding=\"async\"><\/figure><div class=\"note\"><p>Deleting scenes does not delete WiiM device presets or groups.<\/p><\/div><\/section><section id=\"topic-10\"><h2><span class=\"num step-label\">Step 10<\/span>Reorder scene buttons<\/h2><p>Long-press and drag the ≡ handle beside a scene to change its order.<\/p><figure><img loading=\"eager\" src=\"images/d4f1b8b01edc31e828d1a03b3c15ff559bb8d020bf63d0bab056257fd65bbbbc.jpg\" alt=\"Reorder scene buttons\" decoding=\"async\"><\/figure><\/section><section id=\"topic-11\"><h2><span class=\"num step-label\">Step 11<\/span>Reorder device/group tabs<\/h2><p>Drag the ≡ handle beside each category to change the tab order, including collapsed categories.<\/p><figure><img loading=\"eager\" src=\"images/72ce272b5d25146be9f27b1d15c99786d8912f55544d9ed20f320ad8d92eb7d9.jpg\" alt=\"Reorder device/group tabs\" decoding=\"async\"><\/figure><\/section><section id=\"topic-12\"><h2><span class=\"num step-label\">Step 12<\/span>Collapse or expand categories<\/h2><p>Tap a category name to collapse or expand its list of scene buttons.<\/p><figure><img loading=\"eager\" src=\"images/6ea70e693d3826ef53a436b83c1263eb522270b53b0e86dbb9deee909c143029.jpg\" alt=\"Collapse or expand categories\" decoding=\"async\"><\/figure><\/section><section id=\"topic-13\"><h2><span class=\"num step-label\">Step 13<\/span>Delete selected scenes<\/h2><p>Check one or more scenes, then tap Delete selected. Tap Delete all to remove every scene.<\/p><figure><img loading=\"eager\" src=\"images/e4b3ffed01b25e5541fc2b9c7f568769aedf57a33a26fd36a273a3e488449039.jpg\" alt=\"Delete selected scenes\" decoding=\"async\"><\/figure><\/section><section id=\"topic-14\"><h2><span class=\"num step-label\">Step 14<\/span>Delete all scenes in one category<\/h2><p>Tap Delete target scenes for the desired category.<\/p><figure><img loading=\"eager\" src=\"images/1b153b8900a24ec6135b3963942131240ec020c4323ac7ae24cf03ab4cc7cb27.jpg\" alt=\"Delete all scenes in one category\" decoding=\"async\"><\/figure><\/section><section id=\"topic-15\"><h2><span class=\"num step-label\">Step 15<\/span>Organize with collapsed categories<\/h2><p>Collapse all categories to make tab reordering easier. Changes are saved automatically.<\/p><figure><img loading=\"eager\" src=\"images/f8e0b220271d219c47dbbf287d85952d4913c4c4b5c1228bfcfce63dc9d49447.jpg\" alt=\"Organize with collapsed categories\" decoding=\"async\"><\/figure><div class=\"note\"><p>Deleting scenes leaves device presets and groups unchanged.<\/p><\/div><\/section><section id=\"topic-16\"><h2><span class=\"num step-label\">Step 16<\/span>Edit a Scene (Long Press)<\/h2><p>Long press a scene button to open the Edit scene screen. You can review and update its settings.<\/p><figure class=\"manual-detail\"><figcaption>Long press<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/677.5373754152823\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:12.54543337153925%;width:90%;height:83.02676661497631%\"><img src=\"images/8cc510755c2cfd0ea1ab349ff6ad9dc9f02f08b85a0cd94fbea36befe2eec662.jpg\" alt=\"Long press\" loading=\"eager\" decoding=\"async\" style=\"width:285.7142857142857%!important;left:-93.14285714285715%;top:-140.68965517241378%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 677.5373754152823\" aria-hidden=\"true\"><rect x=\"98.85714285714276\" y=\"135.4343853820599\" width=\"797.1428571428572\" height=\"469.4277408637874\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"626.0000000000001\" cy=\"457.4385382059801\" r=\"25\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"5\"><\/circle><circle cx=\"626.0000000000001\" cy=\"457.4385382059801\" r=\"14\" fill=\"#ed2244\" fill-opacity=\".22\" stroke=\"#ed2244\" stroke-width=\"3\"><\/circle><path d=\"M 661.0000000000001 495.4385382059801 L 633.0000000000001 463.4385382059801 L 638.0000000000001 500.4385382059801\" fill=\"white\" stroke=\"#ed2244\" stroke-width=\"4\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><\/figure><figure><img loading=\"eager\" src=\"images/91a1d2148f056a3add02bb3bfb96f12aab66a04f62764486cb76b549d9144991.jpg\" alt=\"Edit scene screen\" decoding=\"async\"><\/figure><div class=\"note\"><p><strong>Device / group<\/strong>：Shows the device or group assigned to this scene.<\/p><p><strong>Scene name<\/strong>：Change the name displayed on the scene button.<\/p><p><strong>Notes (editor only)<\/strong>：Add a private memo. It is not shown in the scene list.<\/p><p><strong>Leader<\/strong>：Displays the leader associated with the scene configuration.<\/p><p><strong>Playback source and preset<\/strong>：Review or change the playback source and, for Preset, select the preset to use.<\/p><p><strong>Change image<\/strong>：Choose a different image for the scene button.<\/p><p><strong>Save<\/strong>：Save your edits.<\/p><p><strong>Delete this scene<\/strong>：Delete this scene button.<\/p><\/div><\/section><section id=\"operation-complete\" data-revision=\"137\"><h2>Completing an operation<\/h2><p>The scene picker closes when a scene recall is accepted; progress and errors appear on the main screen. Device registration closes after the selected devices are saved successfully. Bulk scene registration closes when nothing was skipped. Failed checks, import issues, and skipped targets remain visible. Image, colour, volume, and channel adjustment panels stay open for further changes.<\/p><\/section><\/main><section id=\"scene-tab-swipe-139\"><p>In tab view, swipe the scene grid left for the next device/group tab or right for the previous tab. The first and last tabs wrap around. This works on the home screen and in the scene picker. Changing tabs does not change playback or group connections. Vertical scrolling, tap-to-recall and hold-to-edit remain available.<\/p><\/section><\/body><\/html>"}, {"id": "alarm", "group": "music", "title": "Scene alarms", "blocks": [{"id": "topic-0", "title": "Open the alarm screen", "text": "Step 1Open the alarm screenWith the clock displayed in the full-screen player, tap the alarm-clock icon to open Scene Alarm."}, {"id": "topic-1", "title": "Allow notification and alarm permissions", "text": "Step 2Allow notification and alarm permissionsOn first use, tap “Notification / alarm permissions” and allow the required Android permissions. Then tap “+ Add alarm”.Tap"}, {"id": "topic-2", "title": "Set the name, time and days", "text": "Step 3Set the name, time and daysEnter an optional alarm name. Swipe the hour and minute selectors to set the time. Select the days: all days checked means every day; none checked means a one-time alarm."}, {"id": "topic-3", "title": "Choose a device or group", "text": "Step 4Choose a device or groupSelect the WiiM device or group that should play when the alarm goes off."}, {"id": "topic-4", "title": "Choose a scene", "text": "Step 5Choose a sceneSelect a saved scene as the playback source. The scene and Internet radio options are mutually exclusive."}, {"id": "topic-5", "title": "Or choose Internet radio", "text": "Step 6Or choose Internet radioSelect a station from Open Network Stream instead. Selecting a station clears the selected scene; return to scene selection if needed."}, {"id": "topic-6", "title": "Set the playback time limit", "text": "Step 7Set the playback time limitUncheck “No playback time limit” to choose a duration with the hour and minute selectors. Leave it checked to play without a time limit."}, {"id": "topic-7", "title": "Set precise duration and temporary volume", "text": "Step 8Set precise duration and temporary volumeOptionally enter a precise playback duration in seconds or minutes. Enable “Use temporary alarm volume” to set a dedicated volume; the original levels are restored when the alarm ends. Tap “Save and enable”."}, {"id": "topic-8", "title": "View and manage alarms", "text": "Step 9View and manage alarmsThe alarm list shows the name, time, target, playback source, days, duration and next scheduled time. Use the checkbox to enable or disable, “Edit” to change, “Delete” to remove, or “+ Add alarm” to create another."}, {"id": "topic-9", "title": "Edit an existing alarm", "text": "Step 10Edit an existing alarmTap “Edit” to open the alarm editor. Adjust the time, days, target device/group, scene or radio, then tap “Save and enable”.Tap"}, {"id": "topic-10", "title": "Check the alarm bell on the player", "text": "Step 11Check the alarm bell on the playerWhen an alarm is set for the selected device or group, a yellow bell appears at the top of the full-screen player. Tap it to open the alarm list."}], "text": "Scene alarmsSet a time to play music automatically on a WiiM device or group.Step 1Open the alarm screenWith the clock displayed in the full-screen player, tap the alarm-clock icon to open Scene Alarm.Step 2Allow notification and alarm permissionsOn first use, tap “Notification / alarm permissions” and allow the required Android permissions. Then tap “+ Add alarm”.TapStep 3Set the name, time and daysEnter an optional alarm name. Swipe the hour and minute selectors to set the time. Select the days: all days checked means every day; none checked means a one-time alarm.Step 4Choose a device or groupSelect the WiiM device or group that should play when the alarm goes off.Step 5Choose a sceneSelect a saved scene as the playback source. The scene and Internet radio options are mutually exclusive.Step 6Or choose Internet radioSelect a station from Open Network Stream instead. Selecting a station clears the selected scene; return to scene selection if needed.Step 7Set the playback time limitUncheck “No playback time limit” to choose a duration with the hour and minute selectors. Leave it checked to play without a time limit.Step 8Set precise duration and temporary volumeOptionally enter a precise playback duration in seconds or minutes. Enable “Use temporary alarm volume” to set a dedicated volume; the original levels are restored when the alarm ends. Tap “Save and enable”.Step 9View and manage alarmsThe alarm list shows the name, time, target, playback source, days, duration and next scheduled time. Use the checkbox to enable or disable, “Edit” to change, “Delete” to remove, or “+ Add alarm” to create another.Step 10Edit an existing alarmTap “Edit” to open the alarm editor. Adjust the time, days, target device/group, scene or radio, then tap “Save and enable”.TapStep 11Check the alarm bell on the playerWhen an alarm is set for the selected device or group, a yellow bell appears at the top of the full-screen player. Tap it to open the alarm list.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM Scene Alarm Guide (EN)<\/title><style>:root{--purple:#5400b6;--pink:#ff1680;--ink:#1d1841}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.65 system-ui,-apple-system,'Noto Sans',sans-serif}main{max-width:800px;margin:auto;padding:12px}header{background:linear-gradient(105deg,#40116b,#4300d5);border-radius:14px;color:white;padding:20px 22px;margin-bottom:14px}header h1{margin:0;font-size:clamp(24px,5vw,38px);line-height:1.2}header p{margin:7px 0 0;color:#f0e9ff}.step{border:1px solid #e3def0;border-radius:17px;padding:18px;margin:0 0 14px;background:linear-gradient(145deg,#fff,#faf9ff)}.heading{display:flex;gap:14px;align-items:center}.num{display:grid;place-items:center;flex:none;width:49px;height:49px;border-radius:50%;background:linear-gradient(135deg,#f80070,#ff459f);color:white;font-size:28px;font-weight:800}h2{font-size:clamp(19px,4vw,25px);line-height:1.25;color:var(--purple);margin:0}p{margin:12px 0}img{width:100%;height:auto;display:block;border-radius:10px;background:#1b1724;object-fit:contain}.sub{margin:18px 0;padding:12px 16px;background:#f3eafa;border-radius:10px;color:#4a267b;font-weight:700}footer{color:#777;font-size:13px;padding:14px 3px 25px}@media(max-width:480px){main{padding:8px}.step{padding:12px}.heading{gap:10px}.num{width:42px;height:42px;font-size:24px}}<\/style><style>html,body{margin:0!important;min-height:0!important;overflow-x:hidden!important}body{padding:8px!important;box-sizing:border-box!important}main,.wrap,.page{width:auto!important;max-width:100%!important;margin:0 auto!important;box-sizing:border-box!important}img{max-width:100%!important;height:auto!important;object-fit:contain!important;cursor:zoom-in}figure{max-width:100%;margin-left:0!important;margin-right:0!important}h1{font-size:clamp(23px,4vw,34px)!important}p,li,figcaption{overflow-wrap:anywhere}section,article{min-width:0;box-sizing:border-box}.new-section{padding:20px;border:1px solid #aaa6;border-radius:16px;margin:20px 0}.new-section p{line-height:1.8}.new-section figure{margin-top:20px}mark{background:#ffe476;color:#17131f} @media(max-width:520px){main,.wrap,.page{padding:8px!important}section,article{padding-left:12px!important;padding-right:12px!important}.items,.points,.grid{grid-template-columns:1fr!important}}<\/style><style>.annotation-stage{position:relative;display:block;width:100%;margin:0 auto;line-height:0}.annotation-stage>img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;margin:0!important;border-radius:0!important}.annotation-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotation-legend{font-size:16px;line-height:1.75;margin:12px 0 22px!important;padding:0!important;list-style:none!important}.annotation-legend li{display:flex;align-items:flex-start;gap:10px;margin:9px 0}.annotation-legend .badge{display:inline-flex;align-items:center;justify-content:center;background:#b81024;color:white;border:2px solid white;box-shadow:0 0 0 1px #b81024;border-radius:50%;min-width:25px;height:25px;font:700 14px/1 system-ui;margin-top:2px;flex-shrink:0}.annotations-off .annotation-stage>svg{display:none}.annotation-stage:focus-within{outline:2px solid #bd97ff}<\/style><style>.step-label{width:auto!important;min-width:0!important;height:auto!important;padding:5px 10px!important;border-radius:7px!important;font-size:14px!important;white-space:nowrap}.callout-heading{font-weight:700;margin:16px 0 8px}.annotation-legend{counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"alarm\"><main><header><h1>Scene alarms<\/h1><p>Set a time to play music automatically on a WiiM device or group.<\/p><\/header><section class=\"step\" id=\"topic-0\"><div class=\"heading\"><span class=\"num step-label\">Step 1<\/span><h2>Open the alarm screen<\/h2><\/div><p>With the clock displayed in the full-screen player, tap the alarm-clock icon to open Scene Alarm.<\/p><img src=\"images/7e48f58158b231ab530f68db91c9a2ab07917e93088986f44d1e50d4b94aa4d8.jpg\" alt=\"Scene Alarm screenshot 1\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-1\"><div class=\"heading\"><span class=\"num step-label\">Step 2<\/span><h2>Allow notification and alarm permissions<\/h2><\/div><p>On first use, tap “Notification / alarm permissions” and allow the required Android permissions. Then tap “+ Add alarm”.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/475.79999999999995\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:5.254308532997058%;width:90%;height:88.44052122740648%\"><img src=\"images/5e92591e118bcc3faf379de2db1aa0ca736358bfb1b9e65d5b2e9aef83616456.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:277.77777777777777%!important;left:-5.555555555555555%;top:-240.625%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 475.79999999999995\" aria-hidden=\"true\"><rect x=\"75.0\" y=\"69.71000000000018\" width=\"755.0\" height=\"315.59999999999997\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img src=\"images/df75afbc52e9d6e57e1b71d1172b36b3f63fbf09383c3af3c36447dafb13df78.jpg\" alt=\"Scene Alarm screenshot 2\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-2\"><div class=\"heading\"><span class=\"num step-label\">Step 3<\/span><h2>Set the name, time and days<\/h2><\/div><p>Enter an optional alarm name. Swipe the hour and minute selectors to set the time. Select the days: all days checked means every day; none checked means a one-time alarm.<\/p><img src=\"images/ea3719e35f7aadbfd3dd3305c2e7d3bf3152c7cb003295618066e57a62ffa33a.jpg\" alt=\"Scene Alarm screenshot 3\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-3\"><div class=\"heading\"><span class=\"num step-label\">Step 4<\/span><h2>Choose a device or group<\/h2><\/div><p>Select the WiiM device or group that should play when the alarm goes off.<\/p><img src=\"images/c7ef3e88d8733b695a4cbe0b6de0bf34b59b0b1e26445809470db183c0cf3e8e.jpg\" alt=\"Scene Alarm screenshot 4\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-4\"><div class=\"heading\"><span class=\"num step-label\">Step 5<\/span><h2>Choose a scene<\/h2><\/div><p>Select a saved scene as the playback source. The scene and Internet radio options are mutually exclusive.<\/p><img src=\"images/96dc267f023e87ed7dd6710acebb6b49bba96966856c09694d48d06954edd9e4.jpg\" alt=\"Scene Alarm screenshot 5\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-5\"><div class=\"heading\"><span class=\"num step-label\">Step 6<\/span><h2>Or choose Internet radio<\/h2><\/div><p>Select a station from Open Network Stream instead. Selecting a station clears the selected scene; return to scene selection if needed.<\/p><img src=\"images/7be1831621efc859a81de571bf74eb4d5f825d19c3ad4ab762a268c1c883eadf.jpg\" alt=\"Scene Alarm screenshot 6\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-6\"><div class=\"heading\"><span class=\"num step-label\">Step 7<\/span><h2>Set the playback time limit<\/h2><\/div><p>Uncheck “No playback time limit” to choose a duration with the hour and minute selectors. Leave it checked to play without a time limit.<\/p><img src=\"images/aba8c04217d44c9b0dc209a4654379a2bf229060b40bd1324b5a211c2286b9b8.jpg\" alt=\"Scene Alarm screenshot 7\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-7\"><div class=\"heading\"><span class=\"num step-label\">Step 8<\/span><h2>Set precise duration and temporary volume<\/h2><\/div><p>Optionally enter a precise playback duration in seconds or minutes. Enable “Use temporary alarm volume” to set a dedicated volume; the original levels are restored when the alarm ends. Tap “Save and enable”.<\/p><img src=\"images/698b051af0410906703b476b8f13672be073ba9a65337924536a6a3af86bb0ee.jpg\" alt=\"Scene Alarm screenshot 8\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-8\"><div class=\"heading\"><span class=\"num step-label\">Step 9<\/span><h2>View and manage alarms<\/h2><\/div><p>The alarm list shows the name, time, target, playback source, days, duration and next scheduled time. Use the checkbox to enable or disable, “Edit” to change, “Delete” to remove, or “+ Add alarm” to create another.<\/p><img src=\"images/5e92591e118bcc3faf379de2db1aa0ca736358bfb1b9e65d5b2e9aef83616456.jpg\" alt=\"Scene Alarm screenshot 9\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-9\"><div class=\"heading\"><span class=\"num step-label\">Step 10<\/span><h2>Edit an existing alarm<\/h2><\/div><p>Tap “Edit” to open the alarm editor. Adjust the time, days, target device/group, scene or radio, then tap “Save and enable”.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/343.1565217391304\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:7.285305222613587%;width:90%;height:83.97232851025011%\"><img src=\"images/5e92591e118bcc3faf379de2db1aa0ca736358bfb1b9e65d5b2e9aef83616456.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:217.39130434782606%!important;left:-32.608695652173914%;top:-596.4285714285713%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 343.1565217391304\" aria-hidden=\"true\"><rect x=\"108.69565217391305\" y=\"68.22347826086954\" width=\"352.17391304347825\" height=\"205.82608695652175\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img src=\"images/9c211a1de058d91b7b7cd8631908c63e88fc46eef07ea92a2b40347c17f62b87.jpg\" alt=\"Scene Alarm screenshot 10\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-10\"><div class=\"heading\"><span class=\"num step-label\">Step 11<\/span><h2>Check the alarm bell on the player<\/h2><\/div><p>When an alarm is set for the selected device or group, a yellow bell appears at the top of the full-screen player. Tap it to open the alarm list.<\/p><img src=\"images/787bf0cc4e3dbc0ea2e79dc420b1e070667c13881c5b60a67fd7ff7dc104f587.jpg\" alt=\"Scene Alarm screenshot 11\" loading=\"eager\" decoding=\"async\"><\/section><\/main><\/body><\/html>"}, {"id": "widgets", "group": "extras", "title": "Home-screen widgets", "blocks": [{"id": "topic-0", "title": "Open the widget menu", "text": "Step 1Open the widget menuOn your Android home screen, long-press an empty area and tap “Widgets”.NoteThe method for opening the widget menu, its labels and layout may differ by Android device and home launcher."}, {"id": "topic-1", "title": "Select Flex4WiiM", "text": "Step 2Select Flex4WiiMFind “Flex4WiiM” in the Android widget list. Tap its widget (for example, 2 × 2) to add it to your home screen.12Numbers in this image1The compact 1×1 widget is selected.2Add it to the home screen, then configure the scene or preset to run.NoteAvailable widget sizes vary by device."}, {"id": "topic-2", "title": "Configure the widget", "text": "Step 3Configure the widgetFlex4WiiM opens the widget configuration screen. The default type is “Scene”. Choose one of four types: Scene (single scene button), Scene section (tabs), Scene section (list), or Preset (single preset button).NoteA scene or preset widget opens the app and runs the selected item when tapped."}, {"id": "topic-3", "title": "Create a preset button", "text": "Step 4Create a preset buttonSelect “Preset”, choose the target WiiM device or group, then select the preset you want to launch from the home screen.NoteTap the completed widget to open Flex4WiiM and start the selected preset on that device or group."}, {"id": "topic-4", "title": "Create a scene section widget", "text": "Step 5Create a scene section widgetSelect “Scene section (tabs)” or “Scene section (list)”, then tap “Add scene section”. A scene section widget appears on the Android home screen. The example shows the tabs layout.NoteThe tabs layout lets you switch between device/group categories. Enlarge the widget if needed."}, {"id": "topic-5", "title": "Resize the widget", "text": "Step 6Resize the widgetLong-press the widget on the home screen and choose “Resize”. Drag its edges to make it larger or smaller.NoteThe resizing method and maximum size depend on your Android device and home launcher."}, {"id": "topic-6", "title": "Use the widget", "text": "Step 7Use the widgetFor a single-button widget, tap the scene or preset button. For a scene section widget, select a device/group tab and then tap the scene button you want to run.NoteThe app opens and executes the selected scene or preset."}, {"id": "topic-7", "title": "Open the app from the widget", "text": "Step 8Open the app from the widgetTap the gear icon in the upper-right corner of the scene section widget to open Flex4WiiM.NoteYou can then change scene or preset settings in the app."}, {"id": "topic-8", "title": "Resize a widget", "text": "Resize a widgetSingle-button widgets support 1×1. Long-press after placement to resize them. Initial, minimum and maximum sizes depend on the device and home launcher; expansion to 4×4 is not guaranteed.12Numbers in this image1This is the larger option labelled 4×4. The actual placement size is limited by your home launcher.2Add it to the home screen. Long-press after placement to resize it.Larger widget option; actual size depends on your launcher."}], "text": "Flex4WiiMHome Screen Widget GuideAdd scene and preset shortcuts to your Android home screen.Step 1Open the widget menuOn your Android home screen, long-press an empty area and tap “Widgets”.NoteThe method for opening the widget menu, its labels and layout may differ by Android device and home launcher.Step 2Select Flex4WiiMFind “Flex4WiiM” in the Android widget list. Tap its widget (for example, 2 × 2) to add it to your home screen.12Numbers in this image1The compact 1×1 widget is selected.2Add it to the home screen, then configure the scene or preset to run.NoteAvailable widget sizes vary by device.Step 3Configure the widgetFlex4WiiM opens the widget configuration screen. The default type is “Scene”. Choose one of four types: Scene (single scene button), Scene section (tabs), Scene section (list), or Preset (single preset button).NoteA scene or preset widget opens the app and runs the selected item when tapped.Step 4Create a preset buttonSelect “Preset”, choose the target WiiM device or group, then select the preset you want to launch from the home screen.NoteTap the completed widget to open Flex4WiiM and start the selected preset on that device or group.Step 5Create a scene section widgetSelect “Scene section (tabs)” or “Scene section (list)”, then tap “Add scene section”. A scene section widget appears on the Android home screen. The example shows the tabs layout.NoteThe tabs layout lets you switch between device/group categories. Enlarge the widget if needed.Step 6Resize the widgetLong-press the widget on the home screen and choose “Resize”. Drag its edges to make it larger or smaller.NoteThe resizing method and maximum size depend on your Android device and home launcher.Step 7Use the widgetFor a single-button widget, tap the scene or preset button. For a scene section widget, select a device/group tab and then tap the scene button you want to run.NoteThe app opens and executes the selected scene or preset.Step 8Open the app from the widgetTap the gear icon in the upper-right corner of the scene section widget to open Flex4WiiM.NoteYou can then change scene or preset settings in the app.Resize a widgetSingle-button widgets support 1×1. Long-press after placement to resize them. Initial, minimum and maximum sizes depend on the device and home launcher; expansion to 4×4 is not guaranteed.12Numbers in this image1This is the larger option labelled 4×4. The actual placement size is limited by your home launcher.2Add it to the home screen. Long-press after placement to resize it.Larger widget option; actual size depends on your launcher.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM Home Screen Widget Guide (EN)<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#142451;font-family:system-ui,-apple-system,\"Noto Sans\",sans-serif;line-height:1.65}.wrap{max-width:780px;margin:auto;padding:14px 12px 40px}.hero{background:linear-gradient(115deg,#380078,#6b00b8,#2200df);color:white;padding:20px;border-radius:13px;margin-bottom:15px}.hero strong{font-size:clamp(25px,5vw,38px);display:block;line-height:1.2}.hero p{margin:8px 0 0;color:#f1e9ff}.step{background:white;border:1px solid #dfe6f4;border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 2px 9px #18224a0b}.heading{display:flex;gap:13px;align-items:center;margin-bottom:8px}.num{background:linear-gradient(145deg,#ff0067,#ee348f);color:white;border-radius:50%;width:51px;height:51px;flex:0 0 51px;display:grid;place-items:center;font-size:27px;font-weight:800}h2{font-size:clamp(19px,4vw,25px);line-height:1.25;color:#3a04b5;margin:0}.desc{margin:7px 0 15px;color:#1254bb;font-size:16px}.screen{display:block;width:100%;height:auto;border-radius:12px;margin:10px auto;border:1px solid #dde0e9;background:#17141e}.note{background:#eaf4ff;color:#0755b9;border-radius:12px;padding:12px 15px;margin-top:13px}.note strong{color:#c90066}.foot{color:#69738d;text-align:center;font-size:12px;margin:25px 0}<\/style><style>html,body{margin:0!important;min-height:0!important;overflow-x:hidden!important}body{padding:8px!important;box-sizing:border-box!important}main,.wrap,.page{wid counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"widgets\"><main class=\"wrap\"><header class=\"hero\"><strong>Flex4WiiM<\/strong><strong>Home Screen Widget Guide<\/strong><p>Add scene and preset shortcuts to your Android home screen.<\/p><\/header><section class=\"step\" id=\"topic-0\"><div class=\"heading\"><span class=\"num step-label\">Step 1<\/span><h2>Open the widget menu<\/h2><\/div><p class=\"desc\">On your Android home screen, long-press an empty area and tap “Widgets”.<\/p><img class=\"screen\" loading=\"eager\" src=\"images/f1a9f80479297c25751105ff044da53acf86248b7cdd65c535067de278f2470c.jpg\" alt=\"Step 1 screenshot 1\" decoding=\"async\"><aside class=\"note\"><strong>Note<\/strong><div>The method for opening the widget menu, its labels and layout may differ by Android device and home launcher.<\/div><\/aside><\/section><section class=\"step\" id=\"topic-1\"><div class=\"heading\"><span class=\"num step-label\">Step 2<\/span><h2>Select Flex4WiiM<\/h2><\/div><p class=\"desc\">Find “Flex4WiiM” in the Android widget list. Tap its widget (for example, 2 × 2) to add it to your home screen.<\/p><div class=\"annotation-stage\" data-source=\"01-5775.jpg\"><img class=\"screen\" loading=\"eager\" src=\"images/197e8b5f8038dd1f0581d6780e24f04bd7ec13429614e0da332bc03093017368.jpg\" alt=\"1×1 widget picker\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1927.2271016311167\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"140\" y=\"289.0840652446675\" width=\"740\" height=\"211.99498117942284\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"910\" cy=\"327.62860727728986\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"910\" y=\"327.62860727728986\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"40\" y=\"1773.0489335006275\" width=\"920\" height=\"134.90589711417817\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"910\" cy=\"1753.7766624843164\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"910\" y=\"1753.7766624843164\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>The compact 1×1 widget is selected.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Add it to the home screen, then configure the scene or preset to run.<\/span><\/li><\/ol><aside class=\"note\"><strong>Note<\/strong><div>Available widget sizes vary by device.<\/div><\/aside><\/section><section class=\"step\" id=\"topic-2\"><div class=\"heading\"><span class=\"num step-label\">Step 3<\/span><h2>Configure the widget<\/h2><\/div><p class=\"desc\">Flex4WiiM opens the widget configuration screen. The default type is “Scene”. Choose one of four types: Scene (single scene button), Scene section (tabs), Scene section (list), or Preset (single preset button).<\/p><img class=\"screen\" loading=\"eager\" src=\"images/dfbce10a915ef989621c0adb597768a6b10bdc05dddedb40858cc02badc1204d.jpg\" alt=\"Step 3 screenshot 1\" decoding=\"async\"><aside class=\"note\"><strong>Note<\/strong><div>A scene or preset widget opens the app and runs the selected item when tapped.<\/div><\/aside><\/section><section class=\"step\" id=\"topic-3\"><div class=\"heading\"><span class=\"num step-label\">Step 4<\/span><h2>Create a preset button<\/h2><\/div><p class=\"desc\">Select “Preset”, choose the target WiiM device or group, then select the preset you want to launch from the home screen.<\/p><img class=\"screen\" loading=\"eager\" src=\"images/2319d501160432247b8b95624273b5b61952347440bcc705528d9afbd2d10e06.jpg\" alt=\"Step 4 screenshot 1\" decoding=\"async\"><aside class=\"note\"><strong>Note<\/strong><div>Tap the completed widget to open Flex4WiiM and start the selected preset on that device or group.<\/div><\/aside><\/section><section class=\"step\" id=\"topic-4\"><div class=\"heading\"><span class=\"num step-label\">Step 5<\/span><h2>Create a scene section widget<\/h2><\/div><p class=\"desc\">Select “Scene section (tabs)” or “Scene section (list)”, then tap “Add scene section”. A scene section widget appears on the Android home screen. The example shows the tabs layout.<\/p><img class=\"screen\" loading=\"eager\" src=\"images/70463af4a4ae51bda692b78fca6018b68ca8500aebf9f45af1f724856c5524d1.jpg\" alt=\"Step 5 screenshot 1\" decoding=\"async\"><aside class=\"note\"><strong>Note<\/strong><div>The tabs layout lets you switch between device/group categories. Enlarge the widget if needed.<\/div><\/aside><\/section><section class=\"step\" id=\"topic-5\"><div class=\"heading\"><span class=\"num step-label\">Step 6<\/span><h2>Resize the widget<\/h2><\/div><p class=\"desc\">Long-press the widget on the home screen and choose “Resize”. Drag its edges to make it larger or smaller.<\/p><img class=\"screen\" loading=\"eager\" src=\"images/76291110121d474562cb482dfe51010688059d532ad59c94d3d0b4c29f1a4243.jpg\" alt=\"Step 6 screenshot 1\" decoding=\"async\"><aside class=\"note\"><strong>Note<\/strong><div>The resizing method and maximum size depend on your Android device and home launcher.<\/div><\/aside><\/section><section class=\"step\" id=\"topic-6\"><div class=\"heading\"><span class=\"num step-label\">Step 7<\/span><h2>Use the widget<\/h2><\/div><p class=\"desc\">For a single-button widget, tap the scene or preset button. For a scene section widget, select a device/group tab and then tap the scene button you want to run.<\/p><img class=\"screen\" loading=\"eager\" src=\"images/9a80feedbd1a4066bc1dd9b8e37a19ad633574c8a93d9b444f66f42e3cd99f28.jpg\" alt=\"Step 7 screenshot 1\" decoding=\"async\"><aside class=\"note\"><strong>Note<\/strong><div>The app opens and executes the selected scene or preset.<\/div><\/aside><\/section><section class=\"step\" id=\"topic-7\"><div class=\"heading\"><span class=\"num step-label\">Step 8<\/span><h2>Open the app from the widget<\/h2><\/div><p class=\"desc\">Tap the gear icon in the upper-right corner of the scene section widget to open Flex4WiiM.<\/p><img class=\"screen\" loading=\"eager\" src=\"images/cc4adb261670647d82bbfa0f52c80beb0a227d5e257b29a98450bc25c6b0a004.jpg\" alt=\"Step 8 screenshot 1\" decoding=\"async\"><aside class=\"note\"><strong>Note<\/strong><div>You can then change scene or preset settings in the app.<\/div><\/aside><\/section><section class=\"new-section\" id=\"topic-8\"><h2>Resize a widget<\/h2><p>Single-button widgets support 1×1. Long-press after placement to resize them. Initial, minimum and maximum sizes depend on the device and home launcher; expansion to 4×4 is not guaranteed.<\/p><figure><div class=\"annotation-stage\" data-source=\"02-5777.jpg\"><img src=\"images/50eaf96c33116f0cc204b2a758d74782780d00ca9e90fcbeca58b339db7d8e09.jpg\" alt=\"Larger widget option; actual size depends on your launcher.\" loading=\"eager\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1987.0633893919794\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"140\" y=\"337.8007761966365\" width=\"740\" height=\"218.57697283311774\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"910\" cy=\"337.8007761966365\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"910\" y=\"337.8007761966365\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"40\" y=\"1828.098318240621\" width=\"920\" height=\"139.09443725743856\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"910\" cy=\"1808.2276843467012\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"910\" y=\"1808.2276843467012\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>This is the larger option labelled 4×4. The actual placement size is limited by your home launcher.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Add it to the home screen. Long-press after placement to resize it.<\/span><\/li><\/ol><figcaption>Larger widget option; actual size depends on your launcher.<\/figcaption><\/figure><\/section><\/main><\/body><\/html>"}, {"id": "external", "group": "extras", "title": "External apps", "blocks": [{"id": "topic-0", "title": "Enable the External Apps section", "text": "Step 1Enable the External Apps sectionOpen the app settings, go to “Layout” and check “External apps” to show this section on the main screen.Tap the settings icon on the main screen.Go to “Layout”.Enable “External apps” in the list.The External Apps section will be added to the main screen."}, {"id": "topic-1", "title": "Open the app selection screen", "text": "Step 2Open the app selection screenTap the “Edit” button on the right side of the External Apps section.After enabling the section, the External Apps section will appear on the main screen.Tap “Edit” on the right to open the app selection screen."}, {"id": "topic-2", "title": "Select external apps", "text": "Step 3Select external appsA list of installed apps will be displayed. Check the apps you want to add. You can also search for apps using the search field.Select the apps you want to add by checking the boxes.Use the search field to find apps.Close the screen when you are done. The selected apps will appear in the External Apps section."}, {"id": "topic-3", "title": "Launch an external app", "text": "Step 4Launch an external appTap an app icon to launch the app.Tap an app icon to open the app.You can add or remove apps at any time using the “Edit” button."}], "text": "Flex4WiiMExternal appsAdd your favorite apps and launch them with one tap.Step 1Enable the External Apps sectionOpen the app settings, go to “Layout” and check “External apps” to show this section on the main screen.Tap the settings icon on the main screen.Go to “Layout”.Enable “External apps” in the list.The External Apps section will be added to the main screen.Step 2Open the app selection screenTap the “Edit” button on the right side of the External Apps section.After enabling the section, the External Apps section will appear on the main screen.Tap “Edit” on the right to open the app selection screen.Step 3Select external appsA list of installed apps will be displayed. Check the apps you want to add. You can also search for apps using the search field.Select the apps you want to add by checking the boxes.Use the search field to find apps.Close the screen when you are done. The selected apps will appear in the External Apps section.Step 4Launch an external appTap an app icon to launch the app.Tap an app icon to open the app.You can add or remove apps at any time using the “Edit” button.", "html": "
