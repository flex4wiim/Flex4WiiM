t-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"external\"><main class=\"wrap\"><header class=\"banner\"><div class=\"brand\">Flex4WiiM<\/div><h1>External apps<\/h1><p>Add your favorite apps and launch them with one tap.<\/p><\/header><section class=\"step\" id=\"topic-0\"><div class=\"head\"><span class=\"num step-label\">Step 1<\/span><div><h2>Enable the External Apps section<\/h2><p>Open the app settings, go to “Layout” and check “External apps” to show this section on the main screen.<\/p><\/div><\/div><img class=\"shot\" src=\"images/77202c0660d08cd1ff45ae6443404b1e9faf543d6e1673fc05a7cc8c3f5bce1c.png\" alt=\"Flex4WiiM screenshot, step 1\" loading=\"eager\" decoding=\"async\"><div class=\"notes\"><ul><li>Tap the settings icon on the main screen.<\/li><li>Go to “Layout”.<\/li><li>Enable “External apps” in the list.<\/li><li>The External Apps section will be added to the main screen.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-1\"><div class=\"head\"><span class=\"num step-label\">Step 2<\/span><div><h2>Open the app selection screen<\/h2><p>Tap the “Edit” button on the right side of the External Apps section.<\/p><\/div><\/div><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/393.4839650145773\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.353499055310635%;width:90%;height:86.0223020783166%\"><img src=\"images/e6f233b62c12cce11dee3e5dc82947c6048fb8dae212743bfa701e56342e52f8.png\" alt=\"Flex4WiiM screenshot, step 2\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 393.4839650145773\" aria-hidden=\"true\"><rect x=\"743.0000000000001\" y=\"89.31195335276969\" width=\"144.00000000000003\" height=\"152.31778425655978\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><div class=\"notes\"><ul><li>After enabling the section, the External Apps section will appear on the main screen.<\/li><li>Tap “Edit” on the right to open the app selection screen.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-2\"><div class=\"head\"><span class=\"num step-label\">Step 3<\/span><div><h2>Select external apps<\/h2><p>A list of installed apps will be displayed. Check the apps you want to add. You can also search for apps using the search field.<\/p><\/div><\/div><img class=\"shot\" src=\"images/d8edfab4c8494905c9d634a2380c40f60e7d2660ae4c4ce8f02628130a4ed695.png\" alt=\"Flex4WiiM screenshot, step 3\" loading=\"eager\" decoding=\"async\"><div class=\"notes\"><ul><li>Select the apps you want to add by checking the boxes.<\/li><li>Use the search field to find apps.<\/li><li>Close the screen when you are done. The selected apps will appear in the External Apps section.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-3\"><div class=\"head\"><span class=\"num step-label\">Step 4<\/span><div><h2>Launch an external app<\/h2><p>Tap an app icon to launch the app.<\/p><\/div><\/div><img class=\"shot\" src=\"images/659cb3f8d2e3d0e56e27ec17ef60b3dde92aa38f5f15eb2b93c809cc0e7a388a.png\" alt=\"Flex4WiiM screenshot, step 4\" loading=\"eager\" decoding=\"async\"><div class=\"notes\"><ul><li>Tap an app icon to open the app.<\/li><li>You can add or remove apps at any time using the “Edit” button.<\/li><\/ul><\/div><\/section><\/main><\/body><\/html>"}, {"id": "analyzer", "group": "extras", "title": "Analyzer (Beta)", "blocks": [{"id": "topic-0", "title": "Enable the Analyzer section", "text": "Step 1Enable the Analyzer sectionOpen the app settings and expand “Layout”.Check “Analyzer (Beta)” to display the section on the main screen."}, {"id": "topic-1", "title": "Analyzer screen", "text": "Step 2Analyzer screenThe Analyzer analyzes source audio, not WiiM playback or DSP output.Turn on “Automatically follow the selected device” to follow a supported source.Choose “Choose audio file” to analyze a local audio file, or expand “Analyze radio streaming” to select a radio station.The Analyzer reads supported streams separately; availability and timing may differ from WiiM playback."}, {"id": "topic-2", "title": "Compact display", "text": "Step 3Compact displayTap the square button in the upper right to hide the description and settings and enlarge the Analyzer.Tap the button again to return to the full display.Help (?) icons are hidden in compact mode."}, {"id": "topic-3", "title": "VU meter", "text": "Step 4VU meterShows separate left and right VU meters.The area below displays the RMS level for left and right channels.The display uses smoothed RMS with a VU-style presentation, not standardized VU ballistics."}, {"id": "topic-4", "title": "Adjust VU meter sensitivity", "text": "Step 5Adjust VU meter sensitivityUse the “0 VU reference” slider to adjust meter sensitivity.The reference is expressed in dBFS RMS."}, {"id": "topic-5", "title": "Spectrum", "text": "Step 6SpectrumShows real-time FFT frequency spectra for the left and right channels.Horizontal axis: frequency (Hz). Vertical axis: level (dBFS).Left and right are analyzed independently."}, {"id": "topic-6", "title": "Peak", "text": "Step 7PeakShows left and right peak levels.Displays the received-segment sample peaks for both channels.Shows the count of samples at or above 0 dBFS."}, {"id": "topic-7", "title": "DSP and headroom information", "text": "Step 8DSP and headroom informationShows leader DSP settings and calculated theoretical headroom.Displays recommended volume limits and values based on readable DSP stages.These are estimates, not verified safety limits. They may vary by device or firmware.Auto Headroom and unavailable DSP stages are excluded from the calculation."}, {"id": "topic-8", "title": "Dynamics and loudness", "text": "Step 9Dynamics and loudnessDisplays estimated dynamic range, crest factor, LUFS and true-peak indicators.Some indicators need about 60 seconds of measurement. Keep the Analyzer open and on the same source.The rolling 60-second figures are not whole-track measurements; TT DR is an experimental compatibility estimate."}], "text": "Flex4WiiMAnalyzer (Beta) GuideAudio analysis, meters, spectrum, DSP and loudnessStep 1Enable the Analyzer sectionOpen the app settings and expand “Layout”.Check “Analyzer (Beta)” to display the section on the main screen.Step 2Analyzer screenThe Analyzer analyzes source audio, not WiiM playback or DSP output.Turn on “Automatically follow the selected device” to follow a supported source.Choose “Choose audio file” to analyze a local audio file, or expand “Analyze radio streaming” to select a radio station.The Analyzer reads supported streams separately; availability and timing may differ from WiiM playback.Step 3Compact displayTap the square button in the upper right to hide the description and settings and enlarge the Analyzer.Tap the button again to return to the full display.Help (?) icons are hidden in compact mode.Step 4VU meterShows separate left and right VU meters.The area below displays the RMS level for left and right channels.The display uses smoothed RMS with a VU-style presentation, not standardized VU ballistics.Step 5Adjust VU meter sensitivityUse the “0 VU reference” slider to adjust meter sensitivity.The reference is expressed in dBFS RMS.Step 6SpectrumShows real-time FFT frequency spectra for the left and right channels.Horizontal axis: frequency (Hz). Vertical axis: level (dBFS).Left and right are analyzed independently.Step 7PeakShows left and right peak levels.Displays the received-segment sample peaks for both channels.Shows the count of samples at or above 0 dBFS.Step 8DSP and headroom informationShows leader DSP settings and calculated theoretical headroom.Displays recommended volume limits and values based on readable DSP stages.These are estimates, not verified safety limits. They may vary by device or firmware.Auto Headroom and unavailable DSP stages are excluded from the calculation.Step 9Dynamics and loudnessDisplays estimated dynamic range, crest factor, LUFS and true-peak indicators.Some indicators need about 60 seconds of measurement. Keep the Analyzer open and on the same source.The rolling 60-second figures are not whole-track measurements; TT DR is an experimental compatibility estimate.NotesSource analysis is separate from WiiM DSP output.Results depend on source availability, device capabilities and firmware.The Analyzer is a beta feature; measurements and DSP estimates are informational.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM Analyzer (Beta) Guide (EN)<\/title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f7f8fc;color:#17234b;font-family:system-ui,-apple-system,\"Noto Sans JP\",sans-serif;line-height:1.65}.wrap{max-width:820px;margin:auto;padding:14px 13px 38px}.hero{background:linear-gradient(115deg,#351084,#6500bf 58%,#2600db);border-radius:13px;color:white;padding:22px 23px;margin-bottom:16px}.brand{font-size:clamp(26px,5vw,39px);font-weight:850;line-height:1.2}.subtitle{font-size:15px;opacity:.94;margin-top:5px}.step{background:white;border:1px solid #e2e8f4;border-radius:17px;padding:18px 18px 20px;margin:0 0 15px;box-shadow:0 2px 10px #20205008}.head{display:flex;gap:13px;align-items:center;margin-bottom:11px}.num{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;background:linear-gradient(150deg,#ff168d,#ed0068);color:white;font-size:26px;font-weight:800}.step h2{font-size:clamp(19p  settings and expand “Layout”.<\/li><li>Check “Analyzer (Beta)” to display the section on the main screen.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-1\"><div class=\"head\"><span class=\"num step-label\">Step 2<\/span><h2>Analyzer screen<\/h2><\/div><img class=\"shot tall\" loading=\"eager\" src=\"images/95640f6c2ca1f1a41c1bfd33c3adf2003bb418684f19ff54a8c10a9a04f36861.jpg\" alt=\"Analyzer screenshot, step 2\" decoding=\"async\"><div class=\"explain\"><ul><li>The Analyzer analyzes source audio, not WiiM playback or DSP output.<\/li><li>Turn on “Automatically follow the selected device” to follow a supported source.<\/li><li>Choose “Choose audio file” to analyze a local audio file, or expand “Analyze radio streaming” to select a radio station.<\/li><li>The Analyzer reads supported streams separately; availability and timing may differ from WiiM playback.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-2\"><div class=\"head\"><span class=\"num step-label\">Step 3<\/span><h2>Compact display<\/h2><\/div><img class=\"shot \" loading=\"eager\" src=\"images/9280da0c1a6e6abe6318bb3cf870473c9b003862a94d4b1cea77436b9efaacb3.jpg\" alt=\"Analyzer screenshot, step 3\" decoding=\"async\"><div class=\"explain\"><ul><li>Tap the square button in the upper right to hide the description and settings and enlarge the Analyzer.<\/li><li>Tap the button again to return to the full display.<\/li><li>Help (?) icons are hidden in compact mode.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-3\"><div class=\"head\"><span class=\"num step-label\">Step 4<\/span><h2>VU meter<\/h2><\/div><img class=\"shot \" loading=\"eager\" src=\"images/00b16e6dbd1c94bed8aad54ab5504c3b6bce9a283b467a8eae171d1c4b13bd90.jpg\" alt=\"Analyzer screenshot, step 4\" decoding=\"async\"><div class=\"explain\"><ul><li>Shows separate left and right VU meters.<\/li><li>The area below displays the RMS level for left and right channels.<\/li><li>The display uses smoothed RMS with a VU-style presentation, not standardized VU ballistics.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-4\"><div class=\"head\"><span class=\"num step-label\">Step 5<\/span><h2>Adjust VU meter sensitivity<\/h2><\/div><img class=\"shot \" loading=\"eager\" src=\"images/ac0599d3547ccac033d857d9d5d636c9546710628ef59fd2e10bb7cfa6c4f773.jpg\" alt=\"Analyzer screenshot, step 5\" decoding=\"async\"><div class=\"explain\"><ul><li>Use the “0 VU reference” slider to adjust meter sensitivity.<\/li><li>The reference is expressed in dBFS RMS.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-5\"><div class=\"head\"><span class=\"num step-label\">Step 6<\/span><h2>Spectrum<\/h2><\/div><img class=\"shot \" loading=\"eager\" src=\"images/2f19f3e981f6eb2150579031a65221f55440bec9e80d118f4d41a861ab5d8da5.jpg\" alt=\"Analyzer screenshot, step 6\" decoding=\"async\"><div class=\"explain\"><ul><li>Shows real-time FFT frequency spectra for the left and right channels.<\/li><li>Horizontal axis: frequency (Hz). Vertical axis: level (dBFS).<\/li><li>Left and right are analyzed independently.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-6\"><div class=\"head\"><span class=\"num step-label\">Step 7<\/span><h2>Peak<\/h2><\/div><img class=\"shot \" loading=\"eager\" src=\"images/a90f38c387c254b1f9b4259c612c75cbda3e999614cc8733bdb39201466a21ff.jpg\" alt=\"Analyzer screenshot, step 7\" decoding=\"async\"><div class=\"explain\"><ul><li>Shows left and right peak levels.<\/li><li>Displays the received-segment sample peaks for both channels.<\/li><li>Shows the count of samples at or above 0 dBFS.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-7\"><div class=\"head\"><span class=\"num step-label\">Step 8<\/span><h2>DSP and headroom information<\/h2><\/div><img class=\"shot tall\" loading=\"eager\" src=\"images/e15fc7f4d783bb5ade58ab061f73c085eb19a6fcebf21730937668a465178090.jpg\" alt=\"Analyzer screenshot, step 8\" decoding=\"async\"><div class=\"explain\"><ul><li>Shows leader DSP settings and calculated theoretical headroom.<\/li><li>Displays recommended volume limits and values based on readable DSP stages.<\/li><li>These are estimates, not verified safety limits. They may vary by device or firmware.<\/li><li>Auto Headroom and unavailable DSP stages are excluded from the calculation.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-8\"><div class=\"head\"><span class=\"num step-label\">Step 9<\/span><h2>Dynamics and loudness<\/h2><\/div><img class=\"shot \" loading=\"eager\" src=\"images/cf9a36c9c1761dd0a30f1fd2ebb35cd934f47253d812a65676c9d2951d3dba29.jpg\" alt=\"Analyzer screenshot, step 9\" decoding=\"async\"><img class=\"shot \" loading=\"eager\" src=\"images/22e4c4d85de6e7861f5377d7b000964b7795d881ffe8062581f555b744bbacf3.jpg\" alt=\"Analyzer screenshot, step 9 detail\" decoding=\"async\"><div class=\"explain\"><ul><li>Displays estimated dynamic range, crest factor, LUFS and true-peak indicators.<\/li><li>Some indicators need about 60 seconds of measurement. Keep the Analyzer open and on the same source.<\/li><li>The rolling 60-second figures are not whole-track measurements; TT DR is an experimental compatibility estimate.<\/li><\/ul><\/div><\/section><aside class=\"note\"><h2>Notes<\/h2><ul><li>Source analysis is separate from WiiM DSP output.<\/li><li>Results depend on source availability, device capabilities and firmware.<\/li><li>The Analyzer is a beta feature; measurements and DSP estimates are informational.<\/li><\/ul><\/aside><\/main><\/body><\/html>"}, {"id": "settings-0", "group": "settings", "title": "Layout", "blocks": [{"id": "topic-0", "title": "Layout", "text": "LayoutStep 1Open the Settings screenTap the gear icon at the top right of the main screen, then expand “Layout”.Step 2Select the icon layoutFixed: saved order. Smart sort: moves the selected playing icon to the front temporarily and restores it when paused or stopped. Wrap: fits icons to screen width. None of these changes the saved order.Step 3Show, hide and reorder sectionsCheck sections to show them. Drag the ≡ handle to reorder. “Restore default layout” returns to the initial layout. The arrangement is saved on this controller.Step 4Configure the mini playerShow or hide the mini player, reverse its button order, and choose Standard or Seamless animation.Step 5Set device and group icon orderUse checkboxes to show or hide each icon. Drag ≡ to change the order; put frequently used devices first.Step 6Keep the screen onPrevents automatic screen-off while Flex4WiiM is in the foreground. Switching apps restores normal screen-off behavior. The power button still turns the screen off."}, {"id": "full-player-devices-138", "title": "Layout", "text": "In Settings → Layout → Mini player, enable “Show device icons in the full-screen player”. When the device/group section is pinned first, icons appear at the top in portrait or on the left in landscape. Tap an icon to switch without leaving the player. Text and control sizes are preserved; artwork fits the remaining space. Off by default. Icons are not shown when the section is hidden, is not first, or uses the Wrap layout."}], "text": "LayoutStep 1Open the Settings screenTap the gear icon at the top right of the main screen, then expand “Layout”.Step 2Select the icon layoutFixed: saved order. Smart sort: moves the selected playing icon to the front temporarily and restores it when paused or stopped. Wrap: fits icons to screen width. None of these changes the saved order.Step 3Show, hide and reorder sectionsCheck sections to show them. Drag the ≡ handle to reorder. “Restore default layout” returns to the initial layout. The arrangement is saved on this controller.Step 4Configure the mini playerShow or hide the mini player, reverse its button order, and choose Standard or Seamless animation.Step 5Set device and group icon orderUse checkboxes to show or hide each icon. Drag ≡ to change the order; put frequently used devices first.Step 6Keep the screen onPrevents automatic screen-off while Flex4WiiM is in the foreground. Switching apps restores normal screen-off behavior. The power button still turns the screen off. In Settings → Layout → Mini player, enable “Show device icons in the full-screen player”. When the device/group section is pinned first, icons appear at the top in portrait or on the left in landscape. Tap an icon to switch without leaving the player. Text and control sizes are preserved; artwork fits the remaining space. Off by default. Icons are not shown when the section is hidden, is not first, or uses the Wrap layout.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM Settings Guide<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#151a39;font:16px/1.65 system-ui,-apple-system,\"Noto Sans\",sans-serif}.wrap{max-width:760px;margin:auto;padding:12px 12px 40px}.hero{background:linear-gradient(110deg,#300083,#6200ca,#2a05d5);color:#fff;padding:22px 20px;border-radius:14px;margin:0 0 18px}.hero h1{font-size:clamp(23px,5vw,34px);margin:0}.intro{margin:6px 0 0;opacity:.9}.section{margin:0 0 30px}.section-head{background:linear-gradient(90deg,#5c04bf,#e6e9ff);color:#fff;padding:12px 16px;border-radius:13px;font-weight:800;font-size:22px;margin-bottom:12px}.step{background:white;border:1px solid #e0e6f2;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 7px #2020500a}.step-head{display:flex;align-items:center;gap:13px;margin-bottom:10px}.num{background:linear-gradient(140deg,#ff0075,#f6259b);color:#fff;border-radius:50%;width:48px;height:48px;flex:none;display:grid;place-items:center;font-size:26px;font-weight:800}.step h3{font-size:21px;line-height:1.25;color:#3500c9;margin:0}.shot{display:block;width:100%;height:auto;max-width:100%;object-fit:contain;border-radius:10px;background:#17141f;margin:12px auto}.explain{bac border-radius:50%;min-width:25px;height:25px;font:700 14px/1 system-ui;margin-top:2px;flex-shrink:0}.annotations-off .annotation-stage>svg{display:none}.annotation-stage:focus-within{outline:2px solid #bd97ff}<\/style><style>.step-label{width:auto!important;min-width:0!important;height:auto!important;padding:5px 10px!important;border-radius:7px!important;font-size:14px!important;white-space:nowrap}.callout-heading{font-weight:700;margin:16px 0 8px}.annotation-legend{counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"settings-0\"><main class=\"wrap\"><section class=\"section\" id=\"topic-0\"><div class=\"section-head\">Layout<\/div><article class=\"step\" id=\"topic-1\"><div class=\"step-head\"><span class=\"num step-label\">Step 1<\/span><h3>Open the Settings screen<\/h3><\/div><img class=\"shot\" alt=\"Open the Settings screen screenshot\" src=\"images/0f64217877e84bb29f8d85620f43e0b4ba2af48a260f35dfad3cf2449d464dc3.png\" loading=\"eager\" decoding=\"async\"><p class=\"explain\">Tap the gear icon at the top right of the main screen, then expand “Layout”.<\/p><\/article><article class=\"step\" id=\"topic-2\"><div class=\"step-head\"><span class=\"num step-label\">Step 2<\/span><h3>Select the icon layout<\/h3><\/div><img class=\"shot\" alt=\"Select the icon layout screenshot\" src=\"images/0ce4babaa780078ae69f7e7b47ac1101b37a9c007deb7dd0a664d4a8c51bacdc.png\" loading=\"eager\" decoding=\"async\"><p class=\"explain\">Fixed: saved order. Smart sort: moves the selected playing icon to the front temporarily and restores it when paused or stopped. Wrap: fits icons to screen width. None of these changes the saved order.<\/p><\/article><article class=\"step\" id=\"topic-3\"><div class=\"step-head\"><span class=\"num step-label\">Step 3<\/span><h3>Show, hide and reorder sections<\/h3><\/div><img class=\"shot\" alt=\"Show, hide and reorder sections screenshot\" src=\"images/37e19585ee7d7098875daef8102824cea9905250ffd5023931955b00086c3344.png\" loading=\"eager\" decoding=\"async\"><p class=\"explain\">Check sections to show them. Drag the ≡ handle to reorder. “Restore default layout” returns to the initial layout. The arrangement is saved on this controller.<\/p><\/article><article class=\"step\" id=\"topic-4\"><div class=\"step-head\"><span class=\"num step-label\">Step 4<\/span><h3>Configure the mini player<\/h3><\/div><img class=\"shot\" alt=\"Configure the mini player screenshot\" src=\"images/b2223c99bc63a88a78e5d7cec3ed54146a1794eef52e5660e1949d7c333b9685.png\" loading=\"eager\" decoding=\"async\"><p class=\"explain\">Show or hide the mini player, reverse its button order, and choose Standard or Seamless animation.<\/p><\/article><article class=\"step\" id=\"topic-5\"><div class=\"step-head\"><span class=\"num step-label\">Step 5<\/span><h3>Set device and group icon order<\/h3><\/div><img class=\"shot\" alt=\"Set device and group icon order screenshot\" src=\"images/95e3884014043508743cfa3c8d9c82356ff1603e5fb99a66395354b07305b366.png\" loading=\"eager\" decoding=\"async\"><p class=\"explain\">Use checkboxes to show or hide each icon. Drag ≡ to change the order; put frequently used devices first.<\/p><\/article><article class=\"step\" id=\"topic-6\"><div class=\"step-head\"><span class=\"num step-label\">Step 6<\/span><h3>Keep the screen on<\/h3><\/div><img class=\"shot\" alt=\"Keep the screen on screenshot\" src=\"images/8186d26267dddaa55044001d305714464ba079e90b8c9de7e4a5f90fd1f36d4b.png\" loading=\"eager\" decoding=\"async\"><p class=\"explain\">Prevents automatic screen-off while Flex4WiiM is in the foreground. Switching apps restores normal screen-off behavior. The power button still turns the screen off.<\/p><\/article><\/section><\/main><section id=\"full-player-devices-138\"><p>In Settings → Layout → Mini player, enable “Show device icons in the full-screen player”. When the device/group section is pinned first, icons appear at the top in portrait or on the left in landscape. Tap an icon to switch without leaving the player. Text and control sizes are preserved; artwork fits the remaining space. Off by default. Icons are not shown when the section is hidden, is not first, or uses the Wrap layout.<\/p><\/section><\/body><\/html>"}, {"id": "settings-1", "group": "settings", "title": "Theme", "blocks": [{"id": "topic-0", "title": "Theme", "text": "ThemeStep 1Language1Select the app language. The guide shows English and Japanese, with more languages planned.Step 2Theme2Choose Dark or Light mode.Step 3Text color3Tap “Color” to customize the text color.Step 4Icon size4Choose Large, Medium or Small for device and group icons.Step 5Preset size5Choose Large, Medium or Small for preset buttons.Step 6Scene size6Choose Large, Medium or Small for scene buttons."}], "text": "ThemeStep 1Language1Select the app language. The guide shows English and Japanese, with more languages planned.Step 2Theme2Choose Dark or Light mode.Step 3Text color3Tap “Color” to customize the text color.Step 4Icon size4Choose Large, Medium or Small for device and group icons.Step 5Preset size5Choose Large, Medium or Small for preset buttons.Step 6Scene size6Choose Large, Medium or Small for scene buttons.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM Settings Guide<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#151a39;font:16px/1.65 system-ui,-apple-system,\"Noto Sans\",sans-serif}.wrap{max-width:760px;margin:auto;padding:12px 12px 40px}.hero{background:lin $('guide-data').remove();const language=document.createElement('select');language.id='manual-language';language.setAttribute('aria-label',T('言語','Language'));Object.entries(D.languages).forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;language.append(o)});language.value=D.lang;language.onchange=()=>location.href=language.value+'.html'+location.hash;document.querySelector('header').append(language);if(!['ja','en'].includes(D.lang)){const note=document.createElement('p');note.className='translation-note';note.textContent=T('','Automatic translation. If a technical instruction is unclear, switch to English. Screenshots retain their original language.');document.querySelector('header').after(note);const reference=document.createElement('button');reference.textContent=T('','English reference');reference.onclick=()=>location.href='en.html'+location.hash;note.append(' ',reference);}document.title='Flex4WiiM · '+T('操作ガイド','User Guide')+' '+(D.version||'1.1.34');$('heading').textContent=T('操作ガイド · 番号・赤枠付き版','User guide · annotated edition');$('ann-label').textContent=T('番号・赤枠を表示','Show numbers & outlines');$('ann-toggle').onchange=()=>{const off=!$('ann-toggle').checked;$('frame').contentDocument?.body?.classList.toggle('annotations-off',off);$('zoomstage').classList.toggle('annotations-off',off)};$('searchlabel').textContent=T('マニュアルを検索','Search the user guide');$('query').placeholder=T('例：音量、シーン、ホームシアター','Try volume, scenes or home theater');$('searchbutton').textContent=T('検索','Search');$('toctitle').textContent=T('目次','Contents');document.querySelectorAll('.back').forEach(b=>{b.textContent=T('目次に戻る','Back to contents');b.onclick=back});$('zoomclose').textContent=T('閉じる','Close');$('zoomhelp').textContent=T('元画像に番号と赤枠だけを重ねています。端末の拡大操作でも確認できます。','Numbers and outlines are layered over the unchanged image. You can also use your device’s zoom gesture.');$('zoomclose').onclick=()=>$('zoom').close();
let recent=[];try{const x=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(x))recent=x.filter(v=>typeof v==='string').slice(0,8)}catch(_){}
function save(q){if(!q.trim())return;recent=[q.trim(),...recent.filter(x=>x!==q.trim())].slice(0,8);try{localStorage.setItem(key,JSON.stringify(recent))}catch(_){}}
const norm=s=>s.normalize('NFKC').toLocaleLowerCase();const aliases=[['ミュート','消音','mute'],['音量','volume'],['シーン','scene'],['アラーム','alarm'],['ホームシアター','home theater','home theatre'],['グループ解除','切り離し','ungroup'],['スリープ','sleep'],['時計','clock'],['登録','registration'],['画像','image'],['ウィジェット','widget'],['ストリーム','stream'],['バックアップ','backup']];
const buttons=new Map();D.groups.forEach((g,i)=>{const det=document.createElement('details');det.id='group-'+g.id;const sum=document.createElement('summary'),n=document.createElement('span');n.className='number';n.textContent=String(i+1).padStart(2,'0');sum.append(n,document.createTextNode(g.title));det.append(sum);const links=document.createElement('div');links.className='links';D.chapters.filter(c=>c.group===g.id).forEach(c=>{const b=document.createElement('button');b.className='chapter-link';b.textContent=c.title;b.setAttribute('aria-controls','reader');b.onclick=()=>openChapter(c.id);buttons.set(c.id,b);links.append(b)});det.append(links);$('toc').append(det)});
function hits(q){const tokens=norm(q).trim().split(/\s+/).filter(Boolean);if(!tokens.length)return[];return D.chapters.map(c=>{const scoreText=s=>tokens.every(t=>{const a=aliases.find(a=>a.some(v=>norm(v)===t));return (a||[t]).some(v=>norm(s).includes(norm(v)))});const block=c.blocks.find(b=>scoreText(b.text));if(!block&&!scoreText(c.title+' '+c.text))return null;return{c,block,score:scoreText(c.title)?2:1}}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,8)}
function showResults(){const box=$('suggestions');box.replaceChildren();const q=$('query').value.trim();if(!q){if(!recent.length)return;const top=document.createElement('div');top.className='recent-head';top.append(document.createTextNode(T('最近の検索','Recent searches')));const clear=document.createElement('button');clear.textContent=T('履歴を消去','Clear history');clear.onclick=()=>{recent=[];try{localStorage.removeItem(key)}catch(_){}showResults()};top.append(clear);box.append(top);recent.forEach(q=>{const b=document.createElement('button');b.className='result';b.textContent=q;b.onclick=()=>{$('query').value=q;showResults()};box.append(b)});return}
 const list=hits(q);if(!list.length){const p=document.createElement('p');p.className='empty';p.textContent=T('見つかりませんでした。短い言葉や別の表現で検索してください。','No matches. Try a shorter or different term.');box.append(p)}
 list.forEach(({c,block})=>{const b=document.createElement('button');b.className='result';b.textContent=c.title;if(block){const small=document.createElement('small');small.textContent=block.title; b.append(small)}b.onclick=()=>{save(q);openChapter(c.id,block?.id,q);box.replaceChildren();$('query').blur()};box.append(b)})}
$('query').onfocus=showResults;$('query').oninput=showResults;$('searchform').onsubmit=e=>{e.preventDefault();const q=$('query').value.trim();save(q);showResults()};$('query').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();$('suggestions').querySelector('button')?.focus()}if(e.key==='Escape')$('suggestions').replaceChildren()};
let observer=null,current=null,serial=0;
function back(){serial++;observer?.disconnect();$('reader').hidden=true;$('frame').removeAttribute('srcdoc');current=null;buttons.forEach(b=>b.removeAttribute('aria-current'));history.replaceState(null,'',location.pathname+location.search);$('toc').scrollIntoView();$('toctitle').tabIndex=-1;$('toctitle').focus({preventScroll:true})}
function openChapter(id,anchor='',query=''){const c=D.chapters.find(c=>c.id===id);if(!c)return;const s=++serial;observer?.disconnect();current=id;buttons.forEach((b,k)=>b.setAttribute('aria-current',String(k===id)));$('group-'+c.group).open=true;$('reader').hidden=false;$('chaptertitle').textContent=c.title;const frame=$('frame');frame.title=c.title;frame.style.height='200px';frame.onload=()=>{if(s!==serial)return;const doc=frame.contentDocument;if(!doc?.body)return;
 doc.body.classList.toggle('annotations-off',!$('ann-toggle').checked);const resize=()=>{if(s===serial)frame.style.height=Math.ceil(doc.body.getBoundingClientRect().height+20)+'px'};observer=new ResizeObserver(resize);observer.observe(doc.body);resize();
 doc.querySelectorAll('img').forEach(im=>{im.addEventListener('load',resize);im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label',T('画像を拡大：','Enlarge image: ')+(im.alt||c.title));const zoom=()=>{const stage=im.closest('.annotation-stage');const copy=(stage||im).cloneNode(true);$('zoomstage').replaceChildren(copy);$('zoomstage').classList.toggle('annotations-off',!$('ann-toggle').checked);$('zoom').showModal()};im.onclick=zoom;im.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoom()}}});
 if(query){const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let n;const nodes=[];while(n=walker.nextNode())if(!['STYLE','SCRIPT'].includes(n.parentElement.tagName))nodes.push(n);const q=norm(query);nodes.forEach(n=>{const raw=n.textContent;const start=norm(raw).indexOf(q);if(start>=0&&q.length&&norm(raw).length===raw.length){const f=doc.createDocumentFragment();f.append(raw.slice(0,start));const mark=doc.createElement('mark');mark.textContent=raw.slice(start,start+q.length);f.append(mark,raw.slice(start+q.length));n.replaceWith(f)}})}
 const target=anchor?doc.getElementById(anchor):null;setTimeout(()=>{if(s!==serial)return;resize();const top=$('reader').getBoundingClientRect().top+window.scrollY;const offset=target?target.getBoundingClientRect().top+frame.offsetTop-$('reader').offsetTop:0;window.scrollTo({top:Math.max(0,top+offset-14),behavior:'instant'})},100)
 };frame.srcdoc=c.html;history.replaceState(null,'','#'+id)}
if(location.hash)openChapter(decodeURIComponent(location.hash.slice(1)));window.addEventListener('hashchange',()=>{if(location.hash)openChapter(decodeURIComponent(location.hash.slice(1)));else back()});
