important;padding:5px 10px!important;border-radius:7px!important;font-size:14px!important;white-space:nowrap}.callout-heading{font-weight:700;margin:16px 0 8px}.annotation-legend{counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><style>.manual-new-stage{position:relative;max-width:391px;margin:20px auto;padding:30px!important;box-sizing:border-box}.manual-new-stage img{display:block;width:100%;height:auto;margin:0!important;border-radius:0!important}.manual-new-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.annotations-off .manual-new-stage svg{display:none}<\/style><\/head><body data-guide-chapter=\"theater\"><main><header><h1>Home theater &amp; monitoring<\/h1><p>Basic setup and automatic monitoring<\/p><\/header><div class=\"part\">Basic setup<\/div><section id=\"topic-0\"><h2><span class=\"num step-label\">Step 1<\/span>Create a group<\/h2><p>Open Create group from the grid icon. Enter a group name and choose an icon colour. Select “Home theater” as the type, check the member devices, and choose the leader.<\/p><figure><div class=\"annotation-stage\" data-source=\"05-3862.jpg\"><img src=\"images/6e1651d2d1af08fe2f30a8a64568f2b07348f6a5bf14951146d1e1a955586ec9.jpg\" alt=\"Create a group\" loading=\"eager\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 2034.4370860927152\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"50\" y=\"172.9271523178808\" width=\"900\" height=\"193.27152317880794\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"910\" cy=\"142.41059602649005\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"910\" y=\"142.41059602649005\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"50\" y=\"406.8874172185431\" width=\"900\" height=\"406.8874172185431\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"910\" cy=\"406.8874172185431\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"910\" y=\"406.8874172185431\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><rect x=\"50\" y=\"915.4966887417219\" width=\"900\" height=\"122.0662251655629\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"910\" cy=\"874.8079470198676\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"910\" y=\"874.8079470198676\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">3<\/text><rect x=\"50\" y=\"1047.7350993377484\" width=\"900\" height=\"793.4304635761589\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"910\" cy=\"1078.251655629139\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"910\" y=\"1078.251655629139\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">4<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Name: enter a name for the group.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Colour: choose the group icon colour.<\/span><\/li><li><span class=\"badge\">3<\/span><span>Type: select Home theater.<\/span><\/li><li><span class=\"badge\">4<\/span><span>Check the member speakers, then choose the leader further down.<\/span><\/li><\/ol><\/figure><div class=\"note\"><ul><li>In this example, “Bar” is the leader, with WiiM Sound Lite and WiiM Sound as rear speakers.<\/li><li>Beforehand, configure the compatible home theater and surround speakers in WiiM Home.<\/li><\/ul><\/div><\/section><section id=\"topic-1\"><h2><span class=\"num step-label\">Step 2<\/span>Activate the group<\/h2><p>Set the rear speakers to their usual listening volume, then tap “Activate”. Wait for the operation to complete without closing the screen.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/390.765625\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.39769682914151%;width:90%;height:85.92506697588867%\"><img src=\"images/1a41ea24644d3c4204a4bc636d70146f638002c5cceb31f7acba9285318b2afa.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:133.33333333333331%!important;left:-2.6666666666666665%;top:-113.79310344827587%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 390.765625\" aria-hidden=\"true\"><rect x=\"104.0\" y=\"163.93749999999997\" width=\"179.99999999999997\" height=\"138.9375\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><figure><div class=\"annotation-stage\" data-source=\"06-3864.jpg\"><img src=\"images/1a41ea24644d3c4204a4bc636d70146f638002c5cceb31f7acba9285318b2afa.jpg\" alt=\"Activate the group\" loading=\"eager\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 964.84375\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"35.0\" y=\"86.8359375\" width=\"920\" height=\"115.78125\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"67.5390625\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"67.5390625\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"65.0\" y=\"448.65234375\" width=\"145.0\" height=\"106.1328125\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"250\" cy=\"434.1796875\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"250\" y=\"434.1796875\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Leader: select the device connected to the TV.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Set rears to their usual levels, then tap Activate. The first setup also records baseline levels.<\/span><\/li><\/ol><\/figure><div class=\"note\"><ul><li>Activation saves and connects the group. On first setup, normal volume and mute baselines are recorded for members other than the leader.<\/li><li>After the completion message, stay on this screen and continue to volume correction and automatic monitoring below.<\/li><\/ul><\/div><p>The screenshot still contains an instruction to save and reopen the editor. After successful activation, reopening is unnecessary: continue on the same screen.<\/p><\/section><section id=\"topic-2\"><h2><span class=\"num step-label\">Step 3<\/span>Set volume correction<\/h2><p>Review the recorded normal volumes and, if needed, enter a surround-only volume offset for the rear speakers. Leave the value at 0 if no adjustment is needed.<\/p><figure><div class=\"annotation-stage\" data-source=\"07-3866.jpg\"><img src=\"images/f9911c0db5f0d93b9f5161d2feba1c5dba5afd3d8637cab1261f0f5fe9d19ac0.jpg\" alt=\"Set volume correction\" loading=\"eager\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1974.293059125964\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"60\" y=\"315.88688946015424\" width=\"880\" height=\"71.0745501285347\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"296.1439588688946\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"296.1439588688946\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"40\" y=\"927.9177377892031\" width=\"910\" height=\"78.97172236503856\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"908.1748071979434\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"908.1748071979434\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><rect x=\"40\" y=\"1095.73264781491\" width=\"900\" height=\"355.3727506426735\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"1085.8611825192802\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"1085.8611825192802\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">3<\/text><rect x=\"40\" y=\"1470.8483290488432\" width=\"890\" height=\"148.0719794344473\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"1480.719794344473\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"1480.719794344473\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">4<\/text><rect x=\"160\" y=\"1648.53470437018\" width=\"780\" height=\"112.53470437017995\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"1638.6632390745501\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"1638.6632390745501\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">5<\/text><rect x=\"40\" y=\"1776.8637532133675\" width=\"900\" height=\"118.45758354755785\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"1776.8637532133675\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"1776.8637532133675\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">6<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Check the success message and continue on the same screen.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Review the recorded normal volume levels.<\/span><\/li><li><span class=\"badge\">3<\/span><span>Volume offsets: enter the required rear-speaker offsets. See the text for when they apply.<\/span><\/li><li><span class=\"badge\">4<\/span><span>Expand this section to configure automatic monitoring.<\/span><\/li><li><span class=\"badge\">5<\/span><span>Save: saves the basic setup and closes the screen.<\/span><\/li><li><span class=\"badge\">6<\/span><span>After configuring monitoring, use this button to save and start it.<\/span><\/li><\/ol><\/figure><div class=\"note\"><ul><li>Example: a normal volume of 50 plus an offset of 10 results in 60.<\/li><li>Volume corrections apply when automatic monitoring identifies HDMI audio as 5.1-channel. Manually selecting a group does not apply these corrections.<\/li><li>For manual switching, tap the leader device icon to disconnect the group; tap the home theater group icon to reconnect it, then select the TV input.<\/li><\/ul><\/div><div class=\"important\">Basic home theater setup is complete. Tap Save to finish without automatic monitoring, or continue with the settings below.<\/div><\/section><div class=\"part\">Automatic monitoring<\/div><section id=\"topic-3\"><h2><span class=\"num step-label\">Step 4<\/span>Choose the switching method<\/h2><p>Expand “Automatic monitoring settings” and choose how the rear speakers behave when switching to stereo playback.<\/p><figure><div class=\"annotation-stage\" data-source=\"08-3868.jpg\"><img src=\"images/6d312ff5b7cc663446576890aa4b7ddf0baa8e21b07edefa3b208c5552d4b5a8.jpg\" alt=\"Choose the switching method\" loading=\"eager\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 2023.7154150197628\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"60\" y=\"319.7470355731225\" width=\"890\" height=\"131.5415019762846\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"283.3201581027668\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"283.3201581027668\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"50\" y=\"546.4031620553359\" width=\"900\" height=\"384.50592885375494\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"526.1660079051384\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"526.1660079051384\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><rect x=\"50\" y=\"930.9090909090909\" width=\"900\" height=\"121.42292490118577\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"930.9090909090909\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"930.9090909090909\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">3<\/text><rect x=\"50\" y=\"1052.3320158102767\" width=\"900\" height=\"586.8774703557312\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"930\" cy=\"1072.5691699604743\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"930\" y=\"1072.5691699604743\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">4<\/text><rect x=\"45.0\" y=\"1811.2252964426877\" width=\"910\" height=\"121.42292490118577\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"1801.1067193675888\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"1801.1067193675888\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">5<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Switching method: choose Mute or Ungroup.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Check the inputs that should use the rear speakers.<\/span><\/li><li><span class=\"badge\">3<\/span><span>Enable HDMI stereo/5.1 detection if required.<\/span><\/li><li><span class=\"badge\">4<\/span><span>Review advanced settings, long-running checks and screen-off guidance.<\/span><\/li><li><span class=\"badge\">5<\/span><span>Save the settings and start monitoring on this device.<\/span><\/li><\/ol><\/figure><div class=\"note\"><ul><li>Mute: keeps the group connected and automatically mutes or unmutes rear speakers.<\/li><li>Ungroup: disconnects the rear speakers for stereo playback and restores registered stereo pairs; the group reconnects for selected surround inputs.<\/li><\/ul><\/div><\/section><section id=\"topic-4\"><h2><span class=\"num step-label\">Step 5<\/span>Configure inputs and options<\/h2><p>Select the inputs on which the rear speakers should play. Checked inputs use the rears; unchecked inputs do not.<\/p><figure><img src=\"images/2a707c4fc8d91e364d578c2e4087e72a75635e4bd63d4fbca494e3b7d57a0030.png\" alt=\"Configure inputs and options\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>Optionally enable automatic stereo/5.1 detection using HDMI audio information.<\/li><li>For the Mute method, Advanced settings can mute followers when stop or pause is detected.<\/li><\/ul><\/div><\/section><section id=\"topic-5\"><h2><span class=\"num step-label\">Step 6<\/span>Save and start monitoring<\/h2><p>Tap “Save and start automatic switching on this device”. If Android asks for notification permission, grant it and start again. A confirmation message appears.<\/p><figure><img src=\"images/c5fb79e293bd34d837d4f8f35321d9f8824b8b53a484e6a0e26952e0f095f0bd.png\" alt=\"Save and start monitoring\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>Monitoring continues in the background with the screen off.<\/li><li>Manual playback, volume, input or group operations in this app stop monitoring.<\/li><\/ul><\/div><\/section><section id=\"topic-6\"><h2><span class=\"num step-label\">Step 7<\/span>Start monitoring<\/h2><p>When the “Background monitoring started” message appears, tap “Got it” to close it.<\/p><figure><img src=\"images/224b41aeae57d0cfa4f63e96fcbadef039b0861a05fa88b11fe6666ef28080b7.png\" alt=\"Start monitoring\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>Monitoring can continue while the screen is off. Android battery optimisation or other system restrictions may interrupt it.<\/li><\/ul><\/div><\/section><section id=\"topic-7\"><h2><span class=\"num step-label\">Step 8<\/span>Control from notifications<\/h2><p>Open the Android notification panel to check the monitoring status. Tap “Stop” to stop monitoring. After stopping, tap “Resume” to restart it.<\/p><figure><img src=\"images/5bd611e1b8b34aff81f7123721b619269d5fe9ab681996f71d454627d3a20504.png\" alt=\"Control from notifications\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>The notification can also show status and connection information.<\/li><\/ul><\/div><\/section><section id=\"topic-8\"><h2><span class=\"num step-label\">Step 9<\/span>Use the Quick Settings tile<\/h2><p>Open Android Quick Settings editing, find “Theater Monitor” and add it to the panel. Tap the tile to turn monitoring on or off.<\/p><figure><img src=\"images/ea9173327a16dc065bb475f1cc084740cb7118745564c2b556288a5e4f924e5b.png\" alt=\"Use the Quick Settings tile\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\"><ul><li>The tile can be used without opening the app.<\/li><li>Quick Settings editing differs by Android device.<\/li><\/ul><\/div><\/section><section id=\"manual-theater-beta\" data-revision=\"137\"><h2>Manual home theater switching (beta)<\/h2><p>Open the home theater group editor. Activate the group and record the normal follower volumes using the existing baseline controls. If you adjust those volumes, record them again. Configure the follower corrections, then use the separate Manual switching (beta) options and save.<\/p><figure><div class=\"annotation-stage manual-new-stage\"><img src=\"images/manual-theater-beta-137.png\" alt=\"Manual home theater switching (beta)\" loading=\"eager\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 391 555\" aria-hidden=\"true\"><rect x=\"38\" y=\"124\" width=\"315\" height=\"83\" rx=\"6\" fill=\"none\" stroke=\"#f52450\" stroke-width=\"3\"><\/rect><circle cx=\"19\" cy=\"140\" r=\"15\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"19\" y=\"145\" fill=\"white\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"bold\" font-size=\"18\">1<\/text><rect x=\"38\" y=\"212\" width=\"315\" height=\"62\" rx=\"6\" fill=\"none\" stroke=\"#f52450\" stroke-width=\"3\"><\/rect><circle cx=\"19\" cy=\"228\" r=\"15\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"19\" y=\"233\" fill=\"white\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"bold\" font-size=\"18\">2<\/text><rect x=\"38\" y=\"281\" width=\"315\" height=\"228\" rx=\"6\" fill=\"none\" stroke=\"#f52450\" stroke-width=\"3\"><\/rect><circle cx=\"19\" cy=\"297\" r=\"15\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"19\" y=\"302\" fill=\"white\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"bold\" font-size=\"18\">3<\/text><\/svg><\/div><\/figure><ol class=\"manual-numbered\"><li><b>1<\/b><span>Volume correction: enable this option to apply the recorded normal volume plus the saved correction. Repeated activation does not keep adding the correction. Volume stays within 0–100; linked pairs retain their recorded level difference.<\/span><\/li><li><b>2<\/b><span>Channels: enable this independently of volume correction. Channel-only operation does not require a volume baseline.<\/span><\/li><li><b>3<\/b><span>Choose Left (L), Right (R), or Stereo for every follower, then save the group.<\/span><\/li><\/ol><p>Tap the saved group icon or recall one of its scenes. For scenes with playback content, the manual settings are applied after playback or the preset starts and the resulting group is verified. The editor’s Activate button and scheduled alarm recalls do not apply these options.<\/p><p>When leaving through this app, the changed fields are restored to the recorded normal volume and previous channels if the original group and device identities can still be verified. Later external changes are preserved. If another app or a preset has already changed the group, automatic restoration is not guaranteed.<\/p><p>Both options are off by default and separate from automatic monitoring. Manual activation does not wait for HDMI 5.1 detection. If the group changes or volume correction reports a missing baseline, record the normal volumes again. The feature remains beta; check actual follower levels and channel routing.<\/p><\/section><\/main><\/body><\/html>"}, {"id": "presets", "group": "music", "title": "Presets", "blocks": [{"id": "topic-0", "title": "Step 1Automatic Retrieval and Display", "text": "Step 1Automatic Retrieval and DisplayThe presets of the selected WiiM device are automatically displayed.Only registered presets are displayed.Only presets registered in WiiM Home appear. Unregistered preset slots are not shown.Album artwork is retrieved when available.If artwork is available for a preset, it appears alongside the preset name.Updated almost in real time.When you edit or overwrite a preset in WiiM Home, Flex4WiiM retrieves the latest information when you activate the corresponding device."}, {"id": "topic-1", "title": "Step 2Play a Preset with One Tap", "text": "Step 2Play a Preset with One TapTap a preset to start playback on the selected WiiM device or group.Step 1Select a WiiM device or group at the top of the main screen.Step 2Find the preset you want to play in the Presets section.Step 3Tap the preset to start playback on the selected device or group.Note: Depending on the preset content or playback source, playback may take some time to start or may not be available."}, {"id": "topic-2", "title": "Step 3Change Preset Image", "text": "Step 3Change Preset ImageLong press a preset to open the image editing screen. You can set a custom image for that preset.Long pressCurrent imageShows the currently assigned preset image.Choose imageSelect an image from your Android device and use it as the preset image.Restore defaultReverts to the original image when available.× (Close)Closes the image editing screen.Note: The changed image is used only in this app. It does not modify the preset in WiiM Home."}], "text": "PresetsPresets of the selected WiiM device are automatically retrieved and displayed.Step 1Automatic Retrieval and DisplayThe presets of the selected WiiM device are automatically displayed.Only registered presets are displayed.Only presets registered in WiiM Home appear. Unregistered preset slots are not shown.Album artwork is retrieved when available.If artwork is available for a preset, it appears alongside the preset name.Updated almost in real time.When you edit or overwrite a preset in WiiM Home, Flex4WiiM retrieves the latest information when you activate the corresponding device.Step 2Play a Preset with One TapTap a preset to start playback on the selected WiiM device or group.Step 1Select a WiiM device or group at the top of the main screen.Step 2Find the preset you want to play in the Presets section.Step 3Tap the preset to start playback on the selected device or group.Note: Depending on the preset content or playback source, playback may take some time to start or may not be available.Step 3Change Preset ImageLong press a preset to open the image editing screen. You can set a custom image for that preset.Long pressCurrent imageShows the currently assigned preset image.Choose imageSelect an image from your Android device and use it as the preset image.Restore defaultReverts to the original image when available.× (Close)Closes the image editing screen.Note: The changed image is used only in this app. It does not modify the preset in WiiM Home.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Presets Guide<\/title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#25213b;font:16px/1.65 system-ui,-apple-system,\"Noto Sans\",sans-serif}main{max-width:760px;margin:auto;padding:12px 14px 44px}header{background:linear-gradient(100deg,#4900ad,#7b19d2);color:white;border-radius:14px;padding:20px;margin-bottom:17px}h1{font-size:clamp(23px,5vw,32px);line-height:1.3;margin:0}header p{margin:5px 0 0;color:#f3eaff}section{border:1px solid #e6e0f1;border-radius:16px;padding:17px;margin:16px 0}h2{display:flex;gap:12px;align-items:center;color:#6c15be;font-size:21px;line-height:1.3;margin:0 0 10px}.num{flex-shrink:0;display:inline-grid;place-items:center;background:linear-gradient(135deg,#fa0b77,#a14bd5);color:white;width:43px;height:43px;border-radius:14px;font-weight:800}figure{margin:13px 0}img{display:block;max-width:100%;width:100%;height:auto;border-radius:10px;background:#15121d}p{margin:9px 0}ul,ol{padding-left:2 f .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"presets\"><main><header><h1>Presets<\/h1><p>Presets of the selected WiiM device are automatically retrieved and displayed.<\/p><\/header><section id=\"topic-0\"><h2><span class=\"num step-label\">Step 1<\/span>Automatic Retrieval and Display<\/h2><p>The presets of the selected WiiM device are automatically displayed.<\/p><figure><img src=\"images/b2ad3c430ca21fde717096f2423c2c3bfbbc6838fab6808a88d32be773980b9b.png\" alt=\"Automatic Retrieval and Display\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"panel\"><p><strong>Only registered presets are displayed.<\/strong><br>Only presets registered in WiiM Home appear. Unregistered preset slots are not shown.<\/p><p><strong>Album artwork is retrieved when available.<\/strong><br>If artwork is available for a preset, it appears alongside the preset name.<\/p><p><strong>Updated almost in real time.<\/strong><br>When you edit or overwrite a preset in WiiM Home, Flex4WiiM retrieves the latest information when you activate the corresponding device.<\/p><\/div><\/section><section id=\"topic-1\"><h2><span class=\"num step-label\">Step 2<\/span>Play a Preset with One Tap<\/h2><p>Tap a preset to start playback on the selected WiiM device or group.<\/p><figure><img src=\"images/d361df87d3b7cd90ca79f2884f16df6b7a585ddc1a659ff1d095db32e5a95d85.png\" alt=\"Play a Preset with One Tap\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"panel\"><p><strong>Step 1<\/strong><br>Select a WiiM device or group at the top of the main screen.<\/p><p><strong>Step 2<\/strong><br>Find the preset you want to play in the Presets section.<\/p><p><strong>Step 3<\/strong><br>Tap the preset to start playback on the selected device or group.<\/p><\/div><p class=\"note\"><strong>Note:<\/strong> Depending on the preset content or playback source, playback may take some time to start or may not be available.<\/p><\/section><section id=\"topic-2\"><h2><span class=\"num step-label\">Step 3<\/span>Change Preset Image<\/h2><p>Long press a preset to open the image editing screen. You can set a custom image for that preset.<\/p><figure class=\"manual-detail\"><figcaption>Long press<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/542.9204339963833\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:15.656069412293705%;width:90%;height:78.81825903042618%\"><img src=\"images/b2ad3c430ca21fde717096f2423c2c3bfbbc6838fab6808a88d32be773980b9b.png\" alt=\"Long press\" loading=\"eager\" decoding=\"async\" style=\"width:285.7142857142857%!important;left:-91.42857142857143%;top:-43.75000000000001%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 542.9204339963833\" aria-hidden=\"true\"><rect x=\"111.71428571428558\" y=\"124.22603978300182\" width=\"784.2857142857142\" height=\"347.6853526220615\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"641.4285714285714\" cy=\"361.36528028933094\" r=\"25\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"5\"><\/circle><circle cx=\"641.4285714285714\" cy=\"361.36528028933094\" r=\"14\" fill=\"#ed2244\" fill-opacity=\".22\" stroke=\"#ed2244\" stroke-width=\"3\"><\/circle><path d=\"M 676.4285714285714 399.36528028933094 L 648.4285714285714 367.36528028933094 L 653.4285714285714 404.36528028933094\" fill=\"white\" stroke=\"#ed2244\" stroke-width=\"4\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><\/figure><figure><img src=\"images/5a14e3667eebdd164dc491005ddf67172ca60ee9ce1fd199d25511449c7a1bcd.png\" alt=\"Change Preset Image\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"panel\"><p><strong>Current image<\/strong><br>Shows the currently assigned preset image.<\/p><p><strong>Choose image<\/strong><br>Select an image from your Android device and use it as the preset image.<\/p><p><strong>Restore default<\/strong><br>Reverts to the original image when available.<\/p><p><strong>× (Close)<\/strong><br>Closes the image editing screen.<\/p><\/div><p class=\"note\"><strong>Note:<\/strong> The changed image is used only in this app. It does not modify the preset in WiiM Home.<\/p><\/section><\/main><\/body><\/html>"}, {"id": "streams", "group": "music", "title": "Open Network Stream", "blocks": [{"id": "topic-0", "title": "Enable Open Network Stream", "text": "Step 1Enable Open Network StreamTap the gear icon at the top right of the main screen. Open “Layout” and check “Open Network Stream” to show the section.Drag the ≡ handle to change the section order.The layout is saved in this app."}, {"id": "topic-1", "title": "Open Network Stream overview", "text": "Step 2Open Network Stream overviewUse this section to manage registered audio streams. The + button adds a stream, ↑↓ opens stream management, the list-view button switches to category tabs, and “Search streams” searches registered streams. Streams are displayed by category."}, {"id": "topic-2", "title": "Add a new stream", "text": "Step 3Add a new streamTap + to open “Add stream”. Enter the stream name, category, and audio stream URL. Optionally choose an image, then tap “Save”.TapStream name: Display name.Category: Category name; defaults to “Uncategorized” if omitted.Audio stream URL: Direct audio stream URL.Choose image / Remove image: Set or remove an image.Enter an audio stream URL, not a website address. Saving checks URL syntax; playback depends on format and regional restrictions."}, {"id": "topic-3", "title": "Import multiple streams", "text": "Step 4Import multiple streamsTap “Import” in “Add stream”. Select a file using “Choose file”, or paste data into the text field. Tap “Preview” to review, then “Add streams” to register.TapSupported formats: One URL per line; stream name + tab + URL; M3U; or a JSON array.Up to 200 streams in total, including existing registrations. Existing URLs are skipped.M3U group-title values are imported as categories.JSON requires name and url; category and image are optional. For images, use supported embedded JPEG/PNG data, not an image URL or filename. Export from this app to create JSON containing images."}, {"id": "topic-4", "title": "Play a registered stream", "text": "Step 5Play a registered streamTap anywhere on the stream button to start playback on the currently selected WiiM device or group. You do not need to tap precisely on the ▶ icon. Tap the “…” button on the right to open the editor."}, {"id": "topic-5", "title": "Reorder and delete streams", "text": "Step 6Reorder and delete streamsTap ↑↓ at the top right to open “Manage streams”.TapDrag the ≡ handle to reorder streams within their category.Check one or more streams and tap “Delete selected” to remove them.Tap “Delete all” to remove all registered streams.To change a category, use the individual stream editor."}, {"id": "topic-6", "title": "Switch to category tabs", "text": "Step 7Switch to category tabsTap the list-view button at the top right to switch to category tabs such as Chillout, Ambient, and Lounge. Tap a tab to display only the streams in that category.Tap"}, {"id": "topic-7", "title": "Edit a registered stream", "text": "Step 8Edit a registered streamTap “…” beside a stream to open “Edit stream”. Change its name, category, audio stream URL, or image, and tap “Save”. Tap “Delete stream” to remove that stream.TapAfter changing the category, the stream appears under its new category."}, {"id": "topic-8", "title": "Export registered streams", "text": "Export registered streamsOpen the add screen with + and tap Export to save registered streams as a JSON file. It includes names, URLs, categories and saved images. Use Import on another device to load the file.A stream URL may include a private access token. Review the file before sharing it.Tap"}, {"id": "topic-9", "title": "If playback fails / using scenes", "text": "If playback fails / using scenesSelect a device/group first. Use an HTTP/HTTPS audio stream URL, not a web page. Preview checks URL syntax only; it does not guarantee playback.For HLS, register the original M3U8 URL rather than a segment playlist. PLS import is not supported. Correct invalid rows and preview again.In Create scene, choose Open Network Stream to add one, or use Add / update all streams for bulk registration. See Scenes in the contents."}], "text": "Open Network StreamRegister, play and manage Internet radio and other audio streams.Step 1Enable Open Network StreamTap the gear icon at the top right of the main screen. Open “Layout” and check “Open Network Stream” to show the section.Drag the ≡ handle to change the section order.The layout is saved in this app.Step 2Open Network Stream overviewUse this section to manage registered audio streams. The + button adds a stream, ↑↓ opens stream management, the list-view button switches to category tabs, and “Search streams” searches registered streams. Streams are displayed by category.Step 3Add a new streamTap + to open “Add stream”. Enter the stream name, category, and audio stream URL. Optionally choose an image, then tap “Save”.TapStream name: Display name.Category: Category name; defaults to “Uncategorized” if omitted.Audio stream URL: Direct audio stream URL.Choose image / Remove image: Set or remove an image.Enter an audio stream URL, not a website address. Saving checks URL syntax; playback depends on format and regional restrictions.Step 4Import multiple streamsTap “Import” in “Add stream”. Select a file using “Choose file”, or paste data into the text field. Tap “Preview” to review, then “Add streams” to register.TapSupported formats: One URL per line; stream name + tab + URL; M3U; or a JSON array.Up to 200 streams in total, including existing registrations. Existing URLs are skipped.M3U group-title values are imported as categories.JSON requires name and url; category and image are optional. For images, use supported embedded JPEG/PNG data, not an image URL or filename. Export from this app to create JSON containing images.Step 5Play a registered streamTap anywhere on the stream button to start playback on the currently selected WiiM device or group. You do not need to tap precisely on the ▶ icon. Tap the “…” button on the right to open the editor.Step 6Reorder and delete streamsTap ↑↓ at the top right to open “Manage streams”.TapDrag the ≡ handle to reorder streams within their category.Check one or more streams and tap “Delete selected” to remove them.Tap “Delete all” to remove all registered streams.To change a category, use the individual stream editor.Step 7Switch to category tabsTap the list-view button at the top right to switch to category tabs such as Chillout, Ambient, and Lounge. Tap a tab to display only the streams in that category.TapStep 8Edit a registered streamTap “…” beside a stream to open “Edit stream”. Change its name, category, audio stream URL, or image, and tap “Save”. Tap “Delete stream” to remove that stream.TapAfter changing the category, the stream appears under its new category.Export registered streamsOpen the add screen with + and tap Export to save registered streams as a JSON file. It includes names, URLs, categories and saved images. Use Import on another device to load the file.A stream URL may include a private access token. Review the file before sharing it.TapIf playback fails / using scenesSelect a device/group first. Use an HTTP/HTTPS audio stream URL, not a web page. Preview checks URL syntax only; it does not guarantee playback.For HLS, register the original M3U8 URL rather than a segment playlist. PLS import is not supported. Correct invalid rows and preview again.In Create scene, choose Open Network Stream to add one, or use Add / update all streams for bulk registration. See Scenes in the contents.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Open Network Stream Guide<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f8f9fe;color:#151b48;font:16px/1.65 system-ui,-apple-system,\"Segoe UI\",sans-serif}main{max-width:850px;margin:auto;padding:12px 12px 44px}.hero{background:linear-gradient(105deg,#36008b,#6100cc,#2b04d9);color:white;padding:23px 20px;border-radius:15px;margin-bottom:17px}.hero h1{font-size:clamp(23px,4.5vw,35px);line-height:1.2;margin:0 0 8px}.hero p{margin:0;color:#f1eaff}.step{background:#fff;border:1px solid #e0e7f4;border-radius:17px;margin:0 0 16px;padding:15px;box-shadow:0 3px 15px #20206009}.head{display:flex;align-items:center;gap:13px;margin-bottom:8px}.num{display:grid;place-items:center;flex:0 0 47px;height:47px;border-radius:50%;background:linear-gradient(145deg,#ff0075,#f633a4);color:white;font-size:27px;font-weight:800}.head h2{font-size:clamp(19px,3.6vw,24px);line-height:1.3;color:#5000bd;margin:0}.desc{margin:7px 0 14px;white-space:normal}.shot{display:block;max-width:100%;width:auto;height:auto;max-height:720px;object-fit:contain;margin:12px auto;border-radius:10px;border:1px solid #e1e4ed;background:#18151f}.note{background:#edf6ff;color:#0646bf;border-radius:12px;padding:13px 16px;margin-top:13px}.note ul{marg erflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"streams\"><main><header class=\"hero\"><h1>Open Network Stream<\/h1><p>Register, play and manage Internet radio and other audio streams.<\/p><\/header><section class=\"step\" id=\"topic-0\"><div class=\"head\"><span class=\"num step-label\">Step 1<\/span><h2>Enable Open Network Stream<\/h2><\/div><p class=\"desc\">Tap the gear icon at the top right of the main screen. Open “Layout” and check “Open Network Stream” to show the section.<\/p><img class=\"shot\" src=\"images/e58a2669ca19477b5267c45ca35c4f69c0f62cec5641d9a981f4479019b0c217.jpg\" alt=\"Flex4WiiM screenshot 1\" loading=\"eager\" decoding=\"async\"><div class=\"note\"><ul><li>Drag the ≡ handle to change the section order.<\/li><li>The layout is saved in this app.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-1\"><div class=\"head\"><span class=\"num step-label\">Step 2<\/span><h2>Open Network Stream overview<\/h2><\/div><p class=\"desc\">Use this section to manage registered audio streams. The + button adds a stream, ↑↓ opens stream management, the list-view button switches to category tabs, and “Search streams” searches registered streams. Streams are displayed by category.<\/p><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/1495.0\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:1.6722408026755853%;width:90%;height:96.32107023411372%\"><img src=\"images/b3b0e247d8be58031ef6bc84f2474b9906afe4944d216ea7456728d63372cd29.jpg\" alt=\"Flex4WiiM screenshot 2\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1495.0\" aria-hidden=\"true\"><rect x=\"72.5\" y=\"773.8000000000001\" width=\"855.0\" height=\"568.8000000000001\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/247.7734375\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:10.089862840927006%;width:90%;height:77.80230174996059%\"><img src=\"images/86bb4f61048ea1cc04bc2d26e5a920a11f633d7ed2aabc6b4eb0fe085c203135.jpg\" alt=\"Flex4WiiM screenshot 3\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 247.7734375\" aria-hidden=\"true\"><rect x=\"715.9999999999999\" y=\"50.060546875\" width=\"72.0\" height=\"67.470703125\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"788.0\" y=\"50.060546875\" width=\"72.0\" height=\"67.470703125\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"860.0\" y=\"50.060546875\" width=\"72.0\" height=\"67.470703125\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"86.0\" y=\"132.953125\" width=\"828.0000000000001\" height=\"57.83203125\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/section><section class=\"step\" id=\"topic-2\"><div class=\"head\"><span class=\"num step-label\">Step 3<\/span><h2>Add a new stream<\/h2><\/div><p class=\"desc\">Tap + to open “Add stream”. Enter the stream name, category, and audio stream URL. Optionally choose an image, then tap “Save”.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/374.45312500000006\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.6764030878364276%;width:90%;height:85.31191320675985%\"><img src=\"images/86bb4f61048ea1cc04bc2d26e5a920a11f633d7ed2aabc6b4eb0fe085c203135.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:285.7142857142858%!important;left:-185.71428571428578%;top:-1.7241379310344827%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 374.45312500000006\" aria-hidden=\"true\"><rect x=\"281.4285714285711\" y=\"91.09375000000003\" width=\"205.71428571428575\" height=\"192.77343750000003\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img class=\"shot\" src=\"images/5f8b247a6830341471915070485684bb1f226960edbc76be5dccd461dfb3bf2c.jpg\" alt=\"Flex4WiiM screenshot 4\" loading=\"eager\" decoding=\"async\"><div class=\"note\"><ul><li>Stream name: Display name.<\/li><li>Category: Category name; defaults to “Uncategorized” if omitted.<\/li><li>Audio stream URL: Direct audio stream URL.<\/li><li>Choose image / Remove image: Set or remove an image.<\/li><li>Enter an audio stream URL, not a website address. Saving checks URL syntax; playback depends on format and regional restrictions.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-3\"><div class=\"head\"><span class=\"num step-label\">Step 4<\/span><h2>Import multiple streams<\/h2><\/div><p class=\"desc\">Tap “Import” in “Add stream”. Select a file using “Choose file”, or paste data into the text field. Tap “Preview” to review, then “Add streams” to register.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/483.78411910669973\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:5.167594183571411%;width:90%;height:88.6312927961429%\"><img src=\"images/5f8b247a6830341471915070485684bb1f226960edbc76be5dccd461dfb3bf2c.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:322.5806451612903%!important;left:-206.4516129032258%;top:-630.7692307692307%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 483.78411910669973\" aria-hidden=\"true\"><rect x=\"166.1290322580646\" y=\"74.47509066615758\" width=\"348.3870967741935\" height=\"323.2372590188968\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img class=\"shot\" src=\"images/8334d73ac0a5e2bd7a62881710c6b1bb8de55e508c41748e4a416a311e704f90.jpg\" alt=\"Flex4WiiM screenshot 5\" loading=\"eager\" decoding=\"async\"><div class=\"note\"><ul><li>Supported formats: One URL per line; stream name + tab + URL; M3U; or a JSON array.<\/li><li>Up to 200 streams in total, including existing registrations. Existing URLs are skipped.<\/li><li>M3U group-title values are imported as categories.<\/li><li>JSON requires name and url; category and image are optional. For images, use supported embedded JPEG/PNG data, not an image URL or filename. Export from this app to create JSON containing images.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-4\"><div class=\"head\"><span class=\"num step-label\">Step 5<\/span><h2>Play a registered stream<\/h2><\/div><p class=\"desc\">Tap anywhere on the stream button to start playback on the currently selected WiiM device or group. You do not need to tap precisely on the ▶ icon. Tap the “…” button on the right to open the editor.<\/p><img class=\"shot\" src=\"images/dbecfd3fc690184147098562e6d851711a2fbd0d114e6ae5346263c09f79a72f.jpg\" alt=\"Flex4WiiM screenshot 6\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-5\"><div class=\"head\"><span class=\"num step-label\">Step 6<\/span><h2>Reorder and delete streams<\/h2><\/div><p class=\"desc\">Tap ↑↓ at the top right to open “Manage streams”.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/374.45312500000006\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.6764030878364276%;width:90%;height:85.31191320675985%\"><img src=\"images/86bb4f61048ea1cc04bc2d26e5a920a11f633d7ed2aabc6b4eb0fe085c203135.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:285.7142857142858%!important;left:-185.71428571428578%;top:-1.7241379310344827%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 374.45312500000006\" aria-hidden=\"true\"><rect x=\"487.14285714285705\" y=\"91.09375000000003\" width=\"205.71428571428575\" height=\"192.77343750000003\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img class=\"shot\" src=\"images/a3b9e5da29789b6e50afddfcc7a280522ad68f6b4b560f1a0bc4f25c2e06d6b9.jpg\" alt=\"Flex4WiiM screenshot 7\" loading=\"eager\" decoding=\"async\"><div class=\"note\"><ul><li>Drag the ≡ handle to reorder streams within their category.<\/li><li>Check one or more streams and tap “Delete selected” to remove them.<\/li><li>Tap “Delete all” to remove all registered streams.<\/li><li>To change a category, use the individual stream editor.<\/li><\/ul><\/div><\/section><section class=\"step\" id=\"topic-6\"><div class=\"head\"><span class=\"num step-label\">Step 7<\/span><h2>Switch to category tabs<\/h2><\/div><p class=\"desc\">Tap the list-view button at the top right to switch to category tabs such as Chillout, Ambient, and Lounge. Tap a tab to display only the streams in that category.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/374.45312500000006\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.6764030878364276%;width:90%;height:85.31191320675985%\"><img src=\"images/86bb4f61048ea1cc04bc2d26e5a920a11f633d7ed2aabc6b4eb0fe085c203135.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:285.7142857142858%!important;left:-185.71428571428578%;top:-1.7241379310344827%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 374.45312500000006\" aria-hidden=\"true\"><rect x=\"692.857142857143\" y=\"91.09375000000003\" width=\"205.71428571428575\" height=\"192.77343750000003\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img class=\"shot\" src=\"images/146aea46426a2fc3779885cb12ae0a3e5d5b1476bb94ad99fb24e126589bf48c.jpg\" alt=\"Flex4WiiM screenshot 8\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-7\"><div class=\"head\"><span class=\"num step-label\">Step 8<\/span><h2>Edit a registered stream<\/h2><\/div><p class=\"desc\">Tap “…” beside a stream to open “Edit stream”. Change its name, category, audio stream URL, or image, and tap “Save”. Tap “Delete stream” to remove that stream.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/395.90909090909093\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.3145809414466125%;width:90%;height:86.10792192881746%\"><img src=\"images/dbecfd3fc690184147098562e6d851711a2fbd0d114e6ae5346263c09f79a72f.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:303.030303030303%!important;left:-196.969696969697%;top:-190.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 395.90909090909093\" aria-hidden=\"true\"><rect x=\"712.7272727272729\" y=\"94.88636363636355\" width=\"185.45454545454547\" height=\"184.0909090909091\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img class=\"shot\" src=\"images/9d8a0808b2a34c3639663117a1fd29c20f70de07ebbcd6d55367c605cdb320ce.jpg\" alt=\"Flex4WiiM screenshot 9\" loading=\"eager\" decoding=\"async\"><div class=\"note\"><ul><li>After changing the category, the stream appears under its new category.<\/li><\/ul><\/div><\/section><section class=\"new-section\" id=\"topic-8\"><h2>Export registered streams<\/h2><p>Open the add screen with + and tap Export to save registered streams as a JSON file. It includes names, URLs, categories and saved images. Use Import on another device to load the file.<\/p><p>A stream URL may include a private access token. Review the file before sharing it.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/483.78411910669973\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:5.167594183571411%;width:90%;height:88.6312927961429%\"><img src=\"images/5f8b247a6830341471915070485684bb1f226960edbc76be5dccd461dfb3bf2c.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:322.5806451612903%!important;left:-206.4516129032258%;top:-630.7692307692307%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 483.78411910669973\" aria-hidden=\"true\"><rect x=\"578.3870967741932\" y=\"74.47509066615758\" width=\"348.3870967741935\" height=\"323.2372590188968\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><\/section><section class=\"new-section\" id=\"topic-9\"><h2>If playback fails / using scenes<\/h2><p>Select a device/group first. Use an HTTP/HTTPS audio stream URL, not a web page. Preview checks URL syntax only; it does not guarantee playback.<\/p><p>For HLS, register the original M3U8 URL rather than a segment playlist. PLS import is not supported. Correct invalid rows and preview again.<\/p><p>In Create scene, choose Open Network Stream to add one, or use Add / update all streams for bulk registration. See Scenes in the contents.<\/p><\/section><\/main><\/body><\/html>"}, {"id": "share", "group": "music", "title": "Home Music Share", "blocks": [{"id": "topic-0", "title": "Enable the Home Music Share section", "text": "Step 1Enable the Home Music Share sectionOpen Settings → Layout and enable “Home Music Share”. The section will appear on the main screen. You can drag the reorder handle to change its position."}, {"id": "topic-1", "title": "Open Home Music Share", "text": "Step 2Open Home Music ShareTap “Home Music Share” on the main screen. The app searches your home network for media servers and opens the browser. Recently played folders also appear in this section."}, {"id": "topic-2", "title": "Select a media server", "text": "Step 3Select a media serverChoose a detected server, such as a WiiM device with USB storage. If no server appears, return to the main screen and try again, or use Refresh to search again."}, {"id": "topic-3", "title": "Browse folders", "text": "Step 4Browse foldersTap a folder or category to open it. The top bar shows the server or current folder. Use Back, the breadcrumb path, or Home to navigate. Search the current folder, and enable “Include subfolders” to search below it."}, {"id": "topic-4", "title": "Sort and playback controls", "text": "Step 5Sort and playback controlsUse “Server order” to sort by title/name, filename, track number, artist, or album. Tap ↑ to switch ascending/descending order. “Folder settings” controls visible folders, “+ Scene” saves the current folder as a scene, Shuffle plays randomly, and Play starts playback."}, {"id": "topic-5", "title": "Set folders to show and search", "text": "Step 6Set folders to show and searchTap “Folder settings” to choose which top-level folders are shown and included in searches. Unchecked folders are excluded from browsing, subtree search, and collection playback. This does not delete files. Tap Save to apply.Tap"}, {"id": "topic-6", "title": "Add the folder as a scene", "text": "Step 7Add the folder as a sceneOpen the folder you want to save and tap “+ Scene”. In Create scene, set the device/group and scene name, then tap Save. See the separate Scene Guide for more details.Tap"}, {"id": "topic-7", "title": "Play from recently played folders", "text": "Step 8Play from recently played foldersThe main-screen Home Music Share section shows up to five recently played folders. Tap a folder to play it again. Entries show the folder, server, and playback date/time. “More” opens the full history; “Clear history” removes the history."}, {"id": "topic-8", "title": "View the full history", "text": "Step 9View the full historyTap “More” to open the full list of folders played from this app. Tap an entry to start playback again. Tap “Clear history” to delete the playback history.Tap"}], "text": "Flex4WiiMHome Music ShareBrowse and play music from home network media servers or WiiM USB storage.Step 1Enable the Home Music Share sectionOpen Settings → Layout and enable “Home Music Share”. The section will appear on the main screen. You can drag the reorder handle to change its position.Step 2Open Home Music ShareTap “Home Music Share” on the main screen. The app searches your home network for media servers and opens the browser. Recently played folders also appear in this section.Step 3Select a media serverChoose a detected server, such as a WiiM device with USB storage. If no server appears, return to the main screen and try again, or use Refresh to search again.Step 4Browse foldersTap a folder or category to open it. The top bar shows the server or current folder. Use Back, the breadcrumb path, or Home to navigate. Search the current folder, and enable “Include subfolders” to search below it.Step 5Sort and playback controlsUse “Server order” to sort by title/name, filename, track number, artist, or album. Tap ↑ to switch ascending/descending order. “Folder settings” controls visible folders, “+ Scene” saves the current folder as a scene, Shuffle plays randomly, and Play starts playback.Step 6Set folders to show and searchTap “Folder settings” to choose which top-level folders are shown and included in searches. Unchecked folders are excluded from browsing, subtree search, and collection playback. This does not delete files. Tap Save to apply.TapStep 7Add the folder as a sceneOpen the folder you want to save and tap “+ Scene”. In Create scene, set the device/group and scene name, then tap Save. See the separate Scene Guide for more details.TapStep 8Play from recently played foldersThe main-screen Home Music Share section shows up to five recently played folders. Tap a folder to play it again. Entries show the folder, server, and playback date/time. “More” opens the full history; “Clear history” removes the history.Step 9View the full historyTap “More” to open the full list of folders played from this app. Tap an entry to start playback again. Tap “Clear history” to delete the playback history.Tap", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Home Music Share Guide (EN)<\/title><style>\n:root{--purple:#4b00a7;--pink:#fa0a77;--blue:#0749df}*{box-sizing:border-box}body{margin:0;background:#f8f9ff;color:#191634;font-family:system-ui,-apple-system,'Noto Sans',sans-serif;line-height:1.65}main{max-width:790px;margin:auto;padding:12px 12px 40px}header{background:linear-gradient(105deg,#4d078d,#3500d7);color:white;border-radius:12px;padding:20px 22px;margin-bottom:16px}header .brand{font-weight:850;font-size:1.45rem}header h1{font-size:clamp(1.25rem,4.8vw,2rem);margin:4px 0}header p{margin:0;color:#f3eaff;font-size:.94rem}.step{border:1px solid #e3e2f1;border-radius:17px;background:white;padding:18px;margin:0 0 15px;box-shadow:0 2px 8px #22116608}.head{display:flex;align-items:center;gap:13px}.num{flex:none;display:grid;place-items:center erflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"share\"><main><header><div class=\"brand\">Flex4WiiM<\/div><h1>Home Music Share<\/h1><p>Browse and play music from home network media servers or WiiM USB storage.<\/p><\/header><section class=\"step\" id=\"topic-0\"><div class=\"head\"><span class=\"num step-label\">Step 1<\/span><h2>Enable the Home Music Share section<\/h2><\/div><p>Open Settings → Layout and enable “Home Music Share”. The section will appear on the main screen. You can drag the reorder handle to change its position.<\/p><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 1\" src=\"images/025bd5ad7ffe1629c276b6ba2c3b48c81aa17cde6e16cdb2a5a94172feff5ea4.png\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-1\"><div class=\"head\"><span class=\"num step-label\">Step 2<\/span><h2>Open Home Music Share<\/h2><\/div><p>Tap “Home Music Share” on the main screen. The app searches your home network for media servers and opens the browser. Recently played folders also appear in this section.<\/p><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 2\" src=\"images/3c85fe715b2fa3e8e72d6a1586cdae645108088b79a6daf0f748930b5f7e73b3.png\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-2\"><div class=\"head\"><span class=\"num step-label\">Step 3<\/span><h2>Select a media server<\/h2><\/div><p>Choose a detected server, such as a WiiM device with USB storage. If no server appears, return to the main screen and try again, or use Refresh to search again.<\/p><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 3\" src=\"images/fcca22c8cf92cfb55157fec246f24db89b71583be8cfb9f3b9b42ab38a23e46a.png\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-3\"><div class=\"head\"><span class=\"num step-label\">Step 4<\/span><h2>Browse folders<\/h2><\/div><p>Tap a folder or category to open it. The top bar shows the server or current folder. Use Back, the breadcrumb path, or Home to navigate. Search the current folder, and enable “Include subfolders” to search below it.<\/p><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 4\" src=\"images/586b89646b7e15c74a1e36e840e72a097b216d57165cd90aeebc22bfaf770d97.png\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-4\"><div class=\"head\"><span class=\"num step-label\">Step 5<\/span><h2>Sort and playback controls<\/h2><\/div><p>Use “Server order” to sort by title/name, filename, track number, artist, or album. Tap ↑ to switch ascending/descending order. “Folder settings” controls visible folders, “+ Scene” saves the current folder as a scene, Shuffle plays randomly, and Play starts playback.<\/p><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 5\" src=\"images/b24fe2d1717a64c473e730029501daec343bae59426e202be39ceb2f01be8617.png\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-5\"><div class=\"head\"><span class=\"num step-label\">Step 6<\/span><h2>Set folders to show and search<\/h2><\/div><p>Tap “Folder settings” to choose which top-level folders are shown and included in searches. Unchecked folders are excluded from browsing, subtree search, and collection playback. This does not delete files. Tap Save to apply.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/281.85950413223145\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:8.869667204222253%;width:90%;height:80.48673215071105%\"><img src=\"images/586b89646b7e15c74a1e36e840e72a097b216d57165cd90aeebc22bfaf770d97.png\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:142.8571428571429%!important;left:-35.71428571428572%;top:-192.85714285714286%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 281.85950413223145\" aria-hidden=\"true\"><rect x=\"191.42857142857142\" y=\"89.81700118063749\" width=\"282.85714285714295\" height=\"121.53187721369542\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 6\" src=\"images/b1b578f8f9671d47eb75e28ef8548f629f1e610d548986d40ed5a7991e68dbe1.png\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-6\"><div class=\"head\"><span class=\"num step-label\">Step 7<\/span><h2>Add the folder as a scene<\/h2><\/div><p>Open the folder you want to save and tap “+ Scene”. In Create scene, set the device/group and scene name, then tap Save. See the separate Scene Guide for more details.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/281.85950413223145\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:8.869667204222253%;width:90%;height:80.48673215071105%\"><img src=\"images/586b89646b7e15c74a1e36e840e72a097b216d57165cd90aeebc22bfaf770d97.png\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:142.8571428571429%!important;left:-35.71428571428572%;top:-192.85714285714286%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 281.85950413223145\" aria-hidden=\"true\"><rect x=\"487.1428571428572\" y=\"89.81700118063749\" width=\"192.8571428571429\" height=\"121.53187721369542\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 7\" src=\"images/c75ef967585e590cc01460ce43955a1caa1ce133a29679cc552144ac4ad7a21b.png\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-7\"><div class=\"head\"><span class=\"num step-label\">Step 8<\/span><h2>Play from recently played folders<\/h2><\/div><p>The main-screen Home Music Share section shows up to five recently played folders. Tap a folder to play it again. Entries show the folder, server, and playback date/time. “More” opens the full history; “Clear history” removes the history.<\/p><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 8\" src=\"images/c608f7ec5a81e08648cb0d6ccdc47cf410215c6c59d1d4f41a86e8a0ce49b414.png\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-8\"><div class=\"head\"><span class=\"num step-label\">Step 9<\/span><h2>View the full history<\/h2><\/div><p>Tap “More” to open the full list of folders played from this app. Tap an entry to start playback again. Tap “Clear history” to delete the playback history.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/420.3526970954357\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:5.947386604807265%;width:90%;height:86.91574946942401%\"><img src=\"images/c608f7ec5a81e08648cb0d6ccdc47cf410215c6c59d1d4f41a86e8a0ce49b414.png\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:277.7777777777778%!important;left:-172.22222222222223%;top:-11.111111111111112%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 420.3526970954357\" aria-hidden=\"true\"><rect x=\"162.50000000000009\" y=\"89.95159059474412\" width=\"282.5\" height=\"211.0926694329184\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><img loading=\"eager\" alt=\"Flex4WiiM screenshot for step 9\" src=\"images/ec44d4010b2c36790414eee3b84813563c94cb14a1dfc570fd406a357b7946f9.png\" decoding=\"async\"><\/section><\/main><\/body><\/html>"}, {"id": "local", "group": "music", "title": "My Music", "blocks": [{"id": "topic-0", "title": "Enable the My music section", "text": "Step 1Enable the My music sectionOpen the app settings and, under “Layout”, check “My music”. The section will appear on the main screen. You can drag the reorder handle to change its position."}, {"id": "topic-1", "title": "Open My music and allow access", "text": "Step 2Open My music and allow accessTap “My music” on the main screen, then tap “Load music”. When Android requests permission to access music and audio files, tap “Allow”. The app will then read the Music folder on your device."}, {"id": "topic-2", "title": "Browse and play music", "text": "Step 3Browse and play musicUse the tabs to switch between Folders, Albums, Artists, Tracks, Album artists, Composers, and Genres. Use the search box to find music. Change the display order with the sort menu and toggle ascending/descending order with the arrow. Tap a folder to browse inside it, the play button to start playback, or the shuffle button for random playback. Tap the refresh icon at the top right to reload the music list, or the home icon to return to the app’s main screen. The shuffle button starts random playback of music in the current view. Tap “+ Scene” to open the scene creation screen and register the selected music folder as a scene for quick playback."}, {"id": "topic-3", "title": "Play from recently played music", "text": "Step 4Play from recently played musicThe My music section shows up to five recently played items. Tap an item to play it again. Tap “More” to view the complete playback history, or “Clear history” to delete the history."}], "text": "Flex4WiiMMy MusicBrowse, search, and play music stored in your Android device’s Music folder.Step 1Enable the My music sectionOpen the app settings and, under “Layout”, check “My music”. The section will appear on the main screen. You can drag the reorder handle to change its position.Step 2Open My music and allow accessTap “My music” on the main screen, then tap “Load music”. When Android requests permission to access music and audio files, tap “Allow”. The app will then read the Music folder on your device.Step 3Browse and play musicUse the tabs to switch between Folders, Albums, Artists, Tracks, Album artists, Composers, and Genres. Use the search box to find music. Change the display order with the sort menu and toggle ascending/descending order with the arrow. Tap a folder to browse inside it, the play button to start playback, or the shuffle button for random playback. Tap the refresh icon at the top right to reload the music list, or the home icon to return to the app’s main screen. The shuffle button starts random playback of music in the current view. Tap “+ Scene” to open the scene creation screen and register the selected music folder as a scene for quick playback.Step 4Play from recently played musicThe My music section shows up to five recently played items. Tap an item to play it again. Tap “More” to view the complete playback history, or “Clear history” to delete the history.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta content=\"width=device-width,initial-scale=1\" name=\"viewport\"><title>Flex4WiiM | My Music Guide<\/title><style> :root{--purple:#4b00a7;--pink:
