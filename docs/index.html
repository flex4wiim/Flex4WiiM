 this source, tap “Settings”."}, {"id": "topic-2", "title": "Allow installation from this source", "text": "Step 3Allow installation from this sourceOn the settings screen, turn on “Allow apps from this source”. After enabling it, go back to the previous screen.Only install APK files from a trusted source. For security, we recommend turning this setting off after installation is complete."}, {"id": "topic-3", "title": "Install Flex4WiiM", "text": "Step 4Install Flex4WiiMA confirmation screen will appear. Make sure the app name is “Flex4WiiM”, then tap “Install”.After the installation is complete, open the app."}, {"id": "topic-4", "title": "Select your language", "text": "Step 5Select your languageWhen you first launch Flex4WiiM, the language selection screen will appear. Choose your preferred language."}, {"id": "topic-5", "title": "Start the setup guide", "text": "Step 6Start the setup guideAfter selecting the language, the setup guide will be displayed. The area to tap is highlighted with a pink frame. Tap the “+” button at the top right to start registering a device.To close the setup guide, tap the “×” button at the top right of the guide window."}, {"id": "topic-6", "title": "Next: register your devices", "text": "Next: register your devicesAfter installation, open Device registration from the contents. Android permission screens and labels vary by device."}], "text": "InstallationInstall the app and start the initial setup.Step 1Download the APK fileDownload the Flex4WiiM APK file from the provided link. When the download is complete, tap “Open” to proceed.Step 2Security warning (Android)When installing an app from outside Google Play, a security warning may appear. If you see a message saying the app cannot be installed from this source, tap “Settings”.Step 3Allow installation from this sourceOn the settings screen, turn on “Allow apps from this source”. After enabling it, go back to the previous screen.Only install APK files from a trusted source. For security, we recommend turning this setting off after installation is complete.Step 4Install Flex4WiiMA confirmation screen will appear. Make sure the app name is “Flex4WiiM”, then tap “Install”.After the installation is complete, open the app.Step 5Select your languageWhen you first launch Flex4WiiM, the language selection screen will appear. Choose your preferred language.Step 6Start the setup guideAfter selecting the language, the setup guide will be displayed. The area to tap is highlighted with a pink frame. Tap the “+” button at the top right to start registering a device.To close the setup guide, tap the “×” button at the top right of the guide window.Next: register your devicesAfter installation, open Device registration from the contents. Android permission screens and labels vary by device.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Setup Guide (1/2)<\/title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222038;font-family:system-ui,-apple-system,\"Noto Sans\",sans-serif;line-height:1.65}.page{max-width:780px;margin:auto;padding:12px 14px 40px}header{background:linear-gradient(105deg,#301079,#4000bd);border-radius:13px;color:#fff;padding:18px 20px;margin-bottom:15px}header h1{font-size:clamp(22px,5vw,34px);line-height:1.2;margin:0 0 8px;font-weight:800}header p{font-size:14px;margin:0;opacity:.95}.step{background:#fff;border:1px solid #e2e6f0;border-radius:17px;padding:16px;margin:0 0 15px;box-shadow:0 2px 8px #0d1d4010}.heading{display:flex;align-items:center;gap:13px;margin-bottom:10px}.num{flex:none;background:#f50066;color:white;border-radius:50%;width:49px;height:49px;display:grid;place-items:center;font-size:27px;font-weight:800}.step h2{font-size:20px;color:#260b8f;margin:0;line-height:1.3}.step p{margin:9px 0 14px;font-size:16px}.screen{display:block;width:100%;height:auto;object-fit:contain;border-radius:9px;ba ;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"install\"><main class=\"page\"><header><h1>Installation<\/h1><p>Install the app and start the initial setup.<\/p><\/header><section class=\"step\" id=\"topic-0\"><div class=\"heading\"><span class=\"num step-label\">Step 1<\/span><h2>Download the APK file<\/h2><\/div><p>Download the Flex4WiiM APK file from the provided link. When the download is complete, tap “Open” to proceed.<\/p><img class=\"screen\" src=\"images/e8c93a51c6ea69dc275a201ab15e27a7bded532ea072c2ffba9094f49065eaa7.png\" alt=\"Flex4WiiM screenshot for step 1\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-1\"><div class=\"heading\"><span class=\"num step-label\">Step 2<\/span><h2>Security warning (Android)<\/h2><\/div><p>When installing an app from outside Google Play, a security warning may appear. If you see a message saying the app cannot be installed from this source, tap “Settings”.<\/p><img class=\"screen\" src=\"images/58533fd4a593b9d37e15fc884aad822df9f61415530298260f9229e38ba9deae.png\" alt=\"Flex4WiiM screenshot for step 2\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-2\"><div class=\"heading\"><span class=\"num step-label\">Step 3<\/span><h2>Allow installation from this source<\/h2><\/div><p>On the settings screen, turn on “Allow apps from this source”. After enabling it, go back to the previous screen.<\/p><img class=\"screen\" src=\"images/8a66afcbe8fba18bf04b0ec75e49d6e1dfd832e95715130f875b6284986c60b2.png\" alt=\"Flex4WiiM screenshot for step 3\" loading=\"eager\" decoding=\"async\"><aside class=\"note\">Only install APK files from a trusted source. For security, we recommend turning this setting off after installation is complete.<\/aside><\/section><section class=\"step\" id=\"topic-3\"><div class=\"heading\"><span class=\"num step-label\">Step 4<\/span><h2>Install Flex4WiiM<\/h2><\/div><p>A confirmation screen will appear. Make sure the app name is “Flex4WiiM”, then tap “Install”.<\/p><img class=\"screen\" src=\"images/e0980742a03b09550429d8c0fc19d8354c602e2c260a3205aa81f4826f80dbe1.png\" alt=\"Flex4WiiM screenshot for step 4\" loading=\"eager\" decoding=\"async\"><aside class=\"note\">After the installation is complete, open the app.<\/aside><\/section><section class=\"step\" id=\"topic-4\"><div class=\"heading\"><span class=\"num step-label\">Step 5<\/span><h2>Select your language<\/h2><\/div><p>When you first launch Flex4WiiM, the language selection screen will appear. Choose your preferred language.<\/p><img class=\"screen\" src=\"images/1550a42c855aa841db2e50066ced4dd93b70a6abace457dabef010c8c170e048.png\" alt=\"Flex4WiiM screenshot for step 5\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-5\"><div class=\"heading\"><span class=\"num step-label\">Step 6<\/span><h2>Start the setup guide<\/h2><\/div><p>After selecting the language, the setup guide will be displayed. The area to tap is highlighted with a pink frame. Tap the “+” button at the top right to start registering a device.<\/p><img class=\"screen\" src=\"images/2481bfb16699863648205b1c0388a32daa9fa8118e4b4ebb2b4a0a161f89a6ca.png\" alt=\"Flex4WiiM screenshot for step 6\" loading=\"eager\" decoding=\"async\"><aside class=\"note\">To close the setup guide, tap the “×” button at the top right of the guide window.<\/aside><\/section><section class=\"new-section\" id=\"topic-6\"><h2>Next: register your devices<\/h2><p>After installation, open Device registration from the contents. Android permission screens and labels vary by device.<\/p><\/section><\/main><\/body><\/html>"}, {"id": "registration", "group": "start", "title": "Device registration", "blocks": [{"id": "topic-0", "title": "Open Add device", "text": "Step 1Open Add deviceTap the + button at the top of the main screen to open Add device."}, {"id": "topic-1", "title": "Register one device manually", "text": "Step 2Register one device manuallyEnter the device name and IP address, choose an icon color, and check “I have checked that the selected devices are my WiiM speakers.” after verifying the device in WiiM Home. Tap “Trust and add” to register it and create its icon. A name entered manually will not be overwritten by a discovered name."}, {"id": "topic-2", "title": "Discover devices", "text": "Step 3Discover devicesTap “Discover devices” while connected to the same home network as your WiiM devices. The list can include speakers currently joined to a group; you do not need to ungroup them. Scroll to review all devices."}, {"id": "topic-3", "title": "Open bulk registration", "text": "Step 4Open bulk registrationIn the discovered-device list, tap “Add multiple devices”. This opens the bulk registration screen."}, {"id": "topic-4", "title": "Review the devices", "text": "Step 5Review the devicesFor each device, check the WiiM Home name, model, discovered name and IP address against WiiM Home. The WiiM Home name is prefilled when available. Optionally edit the name and icon color. Uncheck devices you do not want to register. These name changes apply only inside Flex4WiiM."}, {"id": "topic-5", "title": "Confirm trust and add devices / groups", "text": "Step 6Confirm trust and add devices / groupsOptionally check “Import persistent groups from WiiM Home” to import ordinary persistent groups and create group icons. Stereo pairs and home theaters are excluded. After verifying the selected devices, check “I have checked that the selected devices are my WiiM speakers.” Then tap “Trust and add N devices” or, if importing groups, “Add devices and import groups”. Registration and initial trust approval are handled together."}], "text": "Flex4WiiMDevice registrationRegister a single WiiM or multiple devices, with optional import of WiiM Home persistent groups.Step 1Open Add deviceTap the + button at the top of the main screen to open Add device.Step 2Register one device manuallyEnter the device name and IP address, choose an icon color, and check “I have checked that the selected devices are my WiiM speakers.” after verifying the device in WiiM Home. Tap “Trust and add” to register it and create its icon. A name entered manually will not be overwritten by a discovered name.Step 3Discover devicesTap “Discover devices” while connected to the same home network as your WiiM devices. The list can include speakers currently joined to a group; you do not need to ungroup them. Scroll to review all devices.Step 4Open bulk registrationIn the discovered-device list, tap “Add multiple devices”. This opens the bulk registration screen.Step 5Review the devicesFor each device, check the WiiM Home name, model, discovered name and IP address against WiiM Home. The WiiM Home name is prefilled when available. Optionally edit the name and icon color. Uncheck devices you do not want to register. These name changes apply only inside Flex4WiiM.Step 6Confirm trust and add devices / groupsOptionally check “Import persistent groups from WiiM Home” to import ordinary persistent groups and create group icons. Stereo pairs and home theaters are excluded. After verifying the selected devices, check “I have checked that the selected devices are my WiiM speakers.” Then tap “Trust and add N devices” or, if importing groups, “Add devices and import groups”. Registration and initial trust approval are handled together.After registrationTap a newly added device icon to control it; long-press to see its control panel, including its IP address. Registration alone does not start playback or alter existing group connections. Already registered devices are not duplicated. If a device fails to respond, review the reason, select it again and tap “Retry connection checks”. Importing groups does not change playback or connections. Existing imported groups retain their names and colors; groups with unresolved members are skipped with an explanation.Connection safetyIf the certificate of an already registered endpoint changes, it is not automatically trusted. Use “Review changed connection” to verify and approve the endpoint individually, then select it again and retry the connection check. Do not approve a device you cannot identify. A device name alone does not prove its identity.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Device Registration Guide<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8ff;color:#141a43;font-family:system-ui,-apple-system,\"Noto Sans\",sans-serif;line-height:1.65}.wrap{max-width:760px;margin:auto;padding:12px}.hero{background:linear-gradient(110deg,#26005d,#6700c6,#2100dd);color:white;border-radius:12px;padding:19px 22px;margin-bottom:12px}.brand{font-size:15px;font-weight:800;letter-spacing:.03em}.hero h1{font-size:clamp(23px,5vw,33px);line-height:1.3;margin:4px 0}.hero p{margin:4px 0 0;color:#f0eaff}.step{background:#fff;border:1px solid #e4e8f7;border-radius:16px;margin:12px 0;padding:17px;box-shadow:0 2px 12px #28206308}.heading{display:flex;align-items:cente notation-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotation-legend{font-size:16px;line-height:1.75;margin:12px 0 22px!important;padding:0!important;list-style:none!important}.annotation-legend li{display:flex;align-items:flex-start;gap:10px;margin:9px 0}.annotation-legend .badge{display:inline-flex;align-items:center;justify-content:center;background:#b81024;color:white;border:2px solid white;box-shadow:0 0 0 1px #b81024;border-radius:50%;min-width:25px;height:25px;font:700 14px/1 system-ui;margin-top:2px;flex-shrink:0}.annotations-off .annotation-stage>svg{display:none}.annotation-stage:focus-within{outline:2px solid #bd97ff}<\/style><style>.step-label{width:auto!important;min-width:0!important;height:auto!important;padding:5px 10px!important;border-radius:7px!important;font-size:14px!important;white-space:nowrap}.callout-heading{font-weight:700;margin:16px 0 8px}.annotation-legend{counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"registration\"><main class=\"wrap\"><header class=\"hero\"><div class=\"brand\">Flex4WiiM<\/div><h1>Device registration<\/h1><p>Register a single WiiM or multiple devices, with optional import of WiiM Home persistent groups.<\/p><\/header><section class=\"step\" id=\"topic-0\"><div class=\"heading\"><span class=\"num step-label\">Step 1<\/span><h2>Open Add device<\/h2><\/div><p class=\"desc\">Tap the + button at the top of the main screen to open Add device.<\/p><img class=\"shot\" src=\"images/cc36fa10ff9ff4e69b61e6941b7d1cd0a9cc4cca1c8ec8af3de2a7096fb043b1.jpg\" alt=\"Screenshot: Open Add device\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-1\"><div class=\"heading\"><span class=\"num step-label\">Step 2<\/span><h2>Register one device manually<\/h2><\/div><p class=\"desc\">Enter the device name and IP address, choose an icon color, and check “I have checked that the selected devices are my WiiM speakers.” after verifying the device in WiiM Home. Tap “Trust and add” to register it and create its icon. A name entered manually will not be overwritten by a discovered name.<\/p><img class=\"shot\" src=\"images/b7919bb09cf807d9ed3fc74fcd65e3a7d4758808892c2c6e13c670c5e06dbd9c.jpg\" alt=\"Screenshot: Register one device manually\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-2\"><div class=\"heading\"><span class=\"num step-label\">Step 3<\/span><h2>Discover devices<\/h2><\/div><p class=\"desc\">Tap “Discover devices” while connected to the same home network as your WiiM devices. The list can include speakers currently joined to a group; you do not need to ungroup them. Scroll to review all devices.<\/p><img class=\"shot\" src=\"images/e33010c896053d8dae5148451661183d90ebe8b518bb7413360190714e716438.jpg\" alt=\"Screenshot: Discover devices\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-3\"><div class=\"heading\"><span class=\"num step-label\">Step 4<\/span><h2>Open bulk registration<\/h2><\/div><p class=\"desc\">In the discovered-device list, tap “Add multiple devices”. This opens the bulk registration screen.<\/p><img class=\"shot\" src=\"images/8380286b444efd5b10b3733127929129e5e4fa13eead8db1000bbfdfffbc225a.jpg\" alt=\"Screenshot: Open bulk registration\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-4\"><div class=\"heading\"><span class=\"num step-label\">Step 5<\/span><h2>Review the devices<\/h2><\/div><p class=\"desc\">For each device, check the WiiM Home name, model, discovered name and IP address against WiiM Home. The WiiM Home name is prefilled when available. Optionally edit the name and icon color. Uncheck devices you do not want to register. These name changes apply only inside Flex4WiiM.<\/p><img class=\"shot\" src=\"images/830fb165722e498be548e423078ec2ae8e0d0df5ffd61d9eef2d450eb917c3f9.jpg\" alt=\"Screenshot: Review the devices\" loading=\"eager\" decoding=\"async\"><\/section><section class=\"step\" id=\"topic-5\"><div class=\"heading\"><span class=\"num step-label\">Step 6<\/span><h2>Confirm trust and add devices / groups<\/h2><\/div><p class=\"desc\">Optionally check “Import persistent groups from WiiM Home” to import ordinary persistent groups and create group icons. Stereo pairs and home theaters are excluded. After verifying the selected devices, check “I have checked that the selected devices are my WiiM speakers.” Then tap “Trust and add N devices” or, if importing groups, “Add devices and import groups”. Registration and initial trust approval are handled together.<\/p><img class=\"shot\" src=\"images/3cd029d13094258cbaa18b34a26d16e855c62ce719b1a565770c7a94f1c7d4c5.jpg\" alt=\"Screenshot: Confirm trust and add devices / groups\" loading=\"eager\" decoding=\"async\"><\/section><aside class=\"note\"><h2>After registration<\/h2><p>Tap a newly added device icon to control it; long-press to see its control panel, including its IP address. Registration alone does not start playback or alter existing group connections. Already registered devices are not duplicated. If a device fails to respond, review the reason, select it again and tap “Retry connection checks”. Importing groups does not change playback or connections. Existing imported groups retain their names and colors; groups with unresolved members are skipped with an explanation.<\/p><\/aside><aside class=\"note\"><h2>Connection safety<\/h2><p>If the certificate of an already registered endpoint changes, it is not automatically trusted. Use “Review changed connection” to verify and approve the endpoint individually, then select it again and retry the connection check. Do not approve a device you cannot identify. A device name alone does not prove its identity.<\/p><\/aside><\/main><\/body><\/html>"}, {"id": "bulk", "group": "start", "title": "Bulk registration & group import", "blocks": [{"id": "topic-3", "title": "Import groups without adding devices", "text": "Import groups without adding devicesFor already registered speakers, select Import persistent groups from WiiM Home without selecting new devices. Only ordinary persistent groups are eligible; official stereo pairs and home theater groups are excluded.Previously imported groups are matched using their saved source ID, so a renamed source is not added again. Groups with unresolved members may be skipped. Importing alone does not change speaker connections or playback."}, {"id": "operation-complete", "title": "Completing an operation", "text": "Completing an operationThe scene picker closes when a scene recall is accepted; progress and errors appear on the main screen. Device registration closes after the selected devices are saved successfully. Bulk scene registration closes when nothing was skipped. Failed checks, import issues, and skipped targets remain visible. Image, colour, volume, and channel adjustment panels stay open for further changes."}], "text": "Flex4WiiM | Bulk Device Registration & Group ImportAdd multiple WiiM devices and import existing persistent groups in one operation.Step 1Open bulk registrationAfter discovering WiiM devices on your network, tap “Add multiple devices” on the Add device screen.Step 2Choose devices and import groupsCheck the devices you want to register. You can review or edit each device name and icon colour. To bring in ordinary persistent groups already created in WiiM Home, check “Import persistent groups from WiiM Home”.Step 3Add devices and groupsReview each device’s WiiM Home name, model and IP address. Edit its app name rgin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"bulk\"><main class=\"wrap\"><header><div class=\"brand\">Flex4WiiM | Bulk Device Registration &amp; Group Import<\/div><div class=\"subtitle\">Add multiple WiiM devices and import existing persistent groups in one operation.<\/div><\/header><article id=\"topic-0\"><div class=\"head\"><span class=\"num step-label\">Step 1<\/span><div class=\"heading\">Open bulk registration<\/div><\/div><p>After discovering WiiM devices on your network, tap “Add multiple devices” on the Add device screen.<\/p><img class=\"shot\" src=\"images/8380286b444efd5b10b3733127929129e5e4fa13eead8db1000bbfdfffbc225a.jpg\" alt=\"Original Flex4WiiM app screenshot 1\" loading=\"eager\" decoding=\"async\"><\/article><article id=\"topic-1\"><div class=\"head\"><span class=\"num step-label\">Step 2<\/span><div class=\"heading\">Choose devices and import groups<\/div><\/div><p>Check the devices you want to register. You can review or edit each device name and icon colour. To bring in ordinary persistent groups already created in WiiM Home, check “Import persistent groups from WiiM Home”.<\/p><img class=\"shot\" src=\"images/830fb165722e498be548e423078ec2ae8e0d0df5ffd61d9eef2d450eb917c3f9.jpg\" alt=\"Original Flex4WiiM app screenshot 2\" loading=\"eager\" decoding=\"async\"><\/article><article id=\"topic-2\"><div class=\"head\"><span class=\"num step-label\">Step 3<\/span><div class=\"heading\">Add devices and groups<\/div><\/div><p>Review each device’s WiiM Home name, model and IP address. Edit its app name and colour if needed. Check the confirmation that these are your own speakers, then use the approval/add button at the bottom. With group import selected, tap Add devices and import groups.<\/p><img class=\"shot\" src=\"images/3cd029d13094258cbaa18b34a26d16e855c62ce719b1a565770c7a94f1c7d4c5.jpg\" alt=\"Screenshot: Confirm trust and add devices / groups\" loading=\"eager\" decoding=\"async\"><\/article><aside class=\"note\">Group import supports ordinary persistent groups only. Stereo pairs and home theatre groups are excluded. Importing does not change current speaker connections or playback. Previously imported groups are not added again; groups with unresolved members may be skipped.<\/aside><section class=\"new-section\" id=\"topic-3\"><h2>Import groups without adding devices<\/h2><p>For already registered speakers, select Import persistent groups from WiiM Home without selecting new devices. Only ordinary persistent groups are eligible; official stereo pairs and home theater groups are excluded.<\/p><p>Previously imported groups are matched using their saved source ID, so a renamed source is not added again. Groups with unresolved members may be skipped. Importing alone does not change speaker connections or playback.<\/p><\/section><section id=\"operation-complete\" data-revision=\"137\"><h2>Completing an operation<\/h2><p>The scene picker closes when a scene recall is accepted; progress and errors appear on the main screen. Device registration closes after the selected devices are saved successfully. Bulk scene registration closes when nothing was skipped. Failed checks, import issues, and skipped targets remain visible. Image, colour, volume, and channel adjustment panels stay open for further changes.<\/p><\/section><\/main><\/body><\/html>"}, {"id": "main", "group": "basics", "title": "Main screen & icons", "blocks": [{"id": "update133-5", "title": "Offline devices and partially available groups", "text": "Offline devices and partially available groups11Offline icons are dimmed. A normal group with an online leader can play through its available members even if a follower is offline; the warning shows the available/total count. An offline leader makes its group unavailable. A stereo pair or home theater requires all its members. An unavailable target does not prevent switching to other available devices. Smart sort places confirmed offline devices and unavailable groups at the end; playable partial groups remain in the normal section. Fixed sorting is unchanged."}, {"id": "update133-6", "title": "Copy a status message", "text": "Copy a status message11Tap the overlapping-squares button beside the status message to copy it for troubleshooting. Check power and network connectivity before retrying. A failed connection alone does not prove that a device is powered off: it may be restarting or temporarily unreachable. If a changed IP address or identity warning is shown, check the device registration. Review copied information before sharing it."}, {"id": "topic-0", "title": "Step 1Top Menu Buttons", "text": "Step 1Top Menu ButtonsThe following buttons are located at the top right of the screen.123451RefreshUpdates the WiiM devices and playback status information.2Toggle orientationSwitches the screen between portrait and landscape mode.3Add deviceOpens the screen to register a new WiiM device.4Create groupOpens the screen to create a new group.5SettingsOpens the app settings screen."}, {"id": "topic-1", "title": "Step 2Device and Group Icons", "text": "Step 2Device and Group IconsEach icon displays the current device or group and its playback controls.123451Device/Group nameThe registered device name or group name is displayed at the top of the icon.2Device/Group imageThe device icon shows the WiiM product image by default. The group icon displays the selected image or room name.3Playback indicatorThe analyzer icon at the bottom left shows the playback status. When it is animated, that device is playing.4Ripple animationA ripple animation appears on the icon when playing. In group playback, both the group icon and the leader device icon are active and show this animation.5Play/Pause buttonTap the button at the bottom right to play or pause the device or group."}, {"id": "topic-2", "title": "Step 3Basic Icon Operations", "text": "Step 3Basic Icon Operations1231TapSelect and switch the device or saved group.2Long pressOpen the control panel for the device or group.3Tap the play buttonPlay or pause the selected device or group."}, {"id": "topic-3", "title": "Icons without an image", "text": "Icons without an imageFor both devices and groups, an icon without an image uses the image area to show a larger name. Icons with images retain the separate name and picture layout.123Numbers in this image1Group with an image. ↔ identifies a stereo-pair group.2Group without an image. Its name is shown larger.3Device icon: shows the product image and name.Examples of groups with/without images and device icons"}, {"id": "startup-refresh", "title": "Startup and refresh", "text": "Startup and refreshThe selected speakers are checked first. Playback information for a confirmed available target can appear while other speakers are still being checked. During regular refresh, replies are displayed as they arrive. Unknown or offline speakers still require connection checks before group operations; this does not start playback or change speaker connections."}], "text": "Main screen & iconsOffline devices and partially available groups11Offline icons are dimmed. A normal group with an online leader can play through its available members even if a follower is offline; the warning shows the available/total count. An offline leader makes its group unavailable. A stereo pair or home theater requires all its members. An unavailable target does not prevent switching to other available devices. Smart sort places confirmed offline devices and unavailable groups at the end; playable partial groups remain in the normal section. Fixed sorting is unchanged.Copy a status message11Tap the overlapping-squares button beside the status message to copy it for troubleshooting. Check power and network connectivity before retrying. A failed connection alone does not prove that a device is powered off: it may be restarting or temporarily unreachable. If a changed IP address or identity warning is shown, check the device registration. Review copied information before sharing it.Step 1Top Menu ButtonsThe following buttons are located at the top right of the screen.123451RefreshUpdates the WiiM devices and playback status information.2Toggle orientationSwitches the screen between portrait and landscape mode.3Add deviceOpens the screen to register a new WiiM device.4Create groupOpens the screen to create a new group.5SettingsOpens the app settings screen.Step 2Device and Group IconsEach icon displays the current device or group and its playback controls.123451Device/Group nameThe registered device name or group name is displayed at the top of the icon.2Device/Group imageThe device icon shows the WiiM product image by default. The group icon displays the selected image or room name.3Playback indicatorThe analyzer icon at the bottom left shows the playback status. When it is animated, that device is playing.4Ripple animationA ripple animation appears on the icon when playing. In group playback, both the group icon and the leader device icon are active and show this animation.5Play/Pause buttonTap the button at the bottom right to play or pause the device or group.Step 3Basic Icon Operations1231TapSelect and switch the device or saved group.2Long pressOpen the control panel for the device or group.3Tap the play buttonPlay or pause the selected device or group.Icons without an imageFor both devices and groups, an icon without an image uses the image area to show a larger name. Icons with images retain the separate name and picture layout.123Numbers in this image1Group with an image. ↔ identifies a stereo-pair group.2Group without an image. Its name is shown larger.3Device icon: shows the product image and name.Examples of groups with/without images and device iconsStartup and refreshThe selected speakers are checked first. Playback information for a confirmed available target can appear while other speakers are still being checked. During regular refresh, replies are displayed as they arrive. Unknown or offline speakers still require connection checks before group operations; this does not start playback or change speaker connections.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Main Screen Guide<\/title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fff;color:#20213c;font-family:system-ui,-apple-system,\"Noto Sans\",sans-serif;line-height:1.6}.wrap{max-width:720px;margin:auto;padding:12px 12px 36px}header{background:linear-gradi 936.jpg\"><img src=\"images/v133-06-3936.jpg\" alt=\"Offline devices and partially available groups\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1536 600\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"522.24\" y=\"150.0\" width=\"990.72\" height=\"324.0\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"576.0\" cy=\"92.24\" r=\"53.760000000000005\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"576.0\" y=\"92.24\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"67.2\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Offline icons are dimmed. A normal group with an online leader can play through its available members even if a follower is offline; the warning shows the available/total count. An offline leader makes its group unavailable. A stereo pair or home theater requires all its members. An unavailable target does not prevent switching to other available devices. Smart sort places confirmed offline devices and unavailable groups at the end; playable partial groups remain in the normal section. Fixed sorting is unchanged.<\/span><\/li><\/ol><\/section><section class=\"manual-update\" id=\"update133-6\"><h2>Copy a status message<\/h2><div class=\"annotation-stage\" data-source=\"07-3935.jpg\"><img src=\"images/v133-07-3935.jpg\" alt=\"Copy a status message\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1536 339\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"1290.24\" y=\"145.77\" width=\"92.16\" height=\"77.97\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"1344.0\" cy=\"88.01\" r=\"53.760000000000005\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"1344.0\" y=\"88.01\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"67.2\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Tap the overlapping-squares button beside the status message to copy it for troubleshooting. Check power and network connectivity before retrying. A failed connection alone does not prove that a device is powered off: it may be restarting or temporarily unreachable. If a changed IP address or identity warning is shown, check the device registration. Review copied information before sharing it.<\/span><\/li><\/ol><\/section><section id=\"topic-0\"><h2><span class=\"num step-label\">Step 1<\/span>Top Menu Buttons<\/h2><p class=\"lead\">The following buttons are located at the top right of the screen.<\/p><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/185.64846416382252\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:45.785458222263074%;width:90%;height:38.05496828752643%\"><img src=\"images/bde83a57dedaf619f4740c908598b203c5e082472df835897d06e050e3726172.png\" alt=\"Original Flex4WiiM screenshot\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 185.64846416382252\" aria-hidden=\"true\"><rect x=\"644.0000000000001\" y=\"88.53242320819113\" width=\"58.50000000000001\" height=\"62.170648464163826\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"703.4\" y=\"88.53242320819113\" width=\"58.50000000000001\" height=\"62.170648464163826\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"762.8000000000001\" y=\"88.53242320819113\" width=\"58.50000000000001\" height=\"62.170648464163826\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"822.2\" y=\"88.53242320819113\" width=\"58.50000000000001\" height=\"62.170648464163826\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"881.6000000000001\" y=\"88.53242320819113\" width=\"58.50000000000001\" height=\"62.170648464163826\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"671.0\" cy=\"65.21843003412968\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"671.0\" y=\"66.21843003412968\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">1<\/text><circle cx=\"730.4\" cy=\"65.21843003412968\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"730.4\" y=\"66.21843003412968\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">2<\/text><circle cx=\"789.8000000000001\" cy=\"65.21843003412968\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"789.8000000000001\" y=\"66.21843003412968\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">3<\/text><circle cx=\"849.1999999999999\" cy=\"65.21843003412968\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"849.1999999999999\" y=\"66.21843003412968\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">4<\/text><circle cx=\"908.6\" cy=\"65.21843003412968\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"908.6\" y=\"66.21843003412968\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">5<\/text><\/svg><\/div><div class=\"items\"><div class=\"item\"><span class=\"smallnum\">1<\/span><div><h3>Refresh<\/h3><p>Updates the WiiM devices and playback status information.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">2<\/span><div><h3>Toggle orientation<\/h3><p>Switches the screen between portrait and landscape mode.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">3<\/span><div><h3>Add device<\/h3><p>Opens the screen to register a new WiiM device.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">4<\/span><div><h3>Create group<\/h3><p>Opens the screen to create a new group.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">5<\/span><div><h3>Settings<\/h3><p>Opens the app settings screen.<\/p><\/div><\/div><\/div><\/section><section id=\"topic-1\"><h2><span class=\"num step-label\">Step 2<\/span>Device and Group Icons<\/h2><p class=\"lead\">Each icon displays the current device or group and its playback controls.<\/p><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/307.6096997690531\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:27.63241863433312%;width:90%;height:62.61496302413755%\"><img src=\"images/b36a879b4c088b69402a58cde8654c12d9a71414e8d95744146ab276bf67c5c0.png\" alt=\"Original Flex4WiiM screenshot\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 307.6096997690531\" aria-hidden=\"true\"><rect x=\"590.9\" y=\"129.3002309468822\" width=\"121.5\" height=\"113.63972286374133\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"64.4\" cy=\"108.11316397228637\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"64.4\" y=\"109.11316397228637\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">1<\/text><circle cx=\"64.4\" cy=\"175.52655889145495\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"64.4\" y=\"176.52655889145495\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">2<\/text><circle cx=\"55.4\" cy=\"250.64434180138568\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"55.4\" y=\"251.64434180138568\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">3<\/text><circle cx=\"666.5\" cy=\"169.74826789838338\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"666.5\" y=\"170.74826789838338\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">4<\/text><circle cx=\"275.0\" cy=\"248.71824480369514\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"275.0\" y=\"249.71824480369514\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">5<\/text><\/svg><\/div><div class=\"items\"><div class=\"item\"><span class=\"smallnum\">1<\/span><div><h3>Device/Group name<\/h3><p>The registered device name or group name is displayed at the top of the icon.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">2<\/span><div><h3>Device/Group image<\/h3><p>The device icon shows the WiiM product image by default. The group icon displays the selected image or room name.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">3<\/span><div><h3>Playback indicator<\/h3><p>The analyzer icon at the bottom left shows the playback status. When it is animated, that device is playing.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">4<\/span><div><h3>Ripple animation<\/h3><p>A ripple animation appears on the icon when playing. In group playback, both the group icon and the leader device icon are active and show this animation.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">5<\/span><div><h3>Play/Pause button<\/h3><p>Tap the button at the bottom right to play or pause the device or group.<\/p><\/div><\/div><\/div><\/section><section id=\"topic-2\"><h2><span class=\"num step-label\">Step 3<\/span>Basic Icon Operations<\/h2><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/1228.75;max-width:280px!important;margin:12px auto!important\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.917599186164802%;width:90%;height:90.64089521871821%\"><img src=\"images/3d792002f82fa8c6893282773348901122ad8d85a093f869f170810f5d2c7aa7.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:400.0%!important;left:-208.0%;top:-31.944444444444446%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1228.75\" aria-hidden=\"true\"><rect x=\"158.0000000000001\" y=\"177.81249999999991\" width=\"720.0000000000001\" height=\"943.5937499999999\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"158.0000000000001\" cy=\"38.59374999999997\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"158.0000000000001\" y=\"39.59374999999997\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">1<\/text><\/svg><\/div><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/1228.75;max-width:280px!important;margin:12px auto!important\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.917599186164802%;width:90%;height:90.64089521871821%\"><img src=\"images/3d792002f82fa8c6893282773348901122ad8d85a093f869f170810f5d2c7aa7.jpg\" alt=\"Long press\" loading=\"eager\" decoding=\"async\" style=\"width:400.0%!important;left:-208.0%;top:-31.944444444444446%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1228.75\" aria-hidden=\"true\"><rect x=\"158.0000000000001\" y=\"177.81249999999991\" width=\"720.0000000000001\" height=\"943.5937499999999\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"158.0000000000001\" cy=\"38.59374999999997\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"158.0000000000001\" y=\"39.59374999999997\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">2<\/text><circle cx=\"518.0000000000002\" cy=\"626.4062499999999\" r=\"25\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"5\"><\/circle><circle cx=\"518.0000000000002\" cy=\"626.4062499999999\" r=\"14\" fill=\"#ed2244\" fill-opacity=\".22\" stroke=\"#ed2244\" stroke-width=\"3\"><\/circle><path d=\"M 553.0000000000002 664.4062499999999 L 525.0000000000002 632.4062499999999 L 530.0000000000002 669.4062499999999\" fill=\"white\" stroke=\"#ed2244\" stroke-width=\"4\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/888.4374999999999;max-width:280px!important;margin:12px auto!important\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:9.56735842419979%;width:90%;height:87.05592683784734%\"><img src=\"images/3d792002f82fa8c6893282773348901122ad8d85a093f869f170810f5d2c7aa7.jpg\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:499.9999999999999%!important;left:-275.0%;top:-132.5%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 888.4374999999999\" aria-hidden=\"true\"><rect x=\"724.9999999999992\" y=\"471.71874999999994\" width=\"225.0\" height=\"309.375\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"158.00000000000009\" cy=\"27\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"158.00000000000009\" y=\"28\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">3<\/text><\/svg><\/div><div class=\"items\"><div class=\"item\"><span class=\"smallnum\">1<\/span><div><h3>Tap<\/h3><p>Select and switch the device or saved group.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">2<\/span><div><h3>Long press<\/h3><p>Open the control panel for the device or group.<\/p><\/div><\/div><div class=\"item\"><span class=\"smallnum\">3<\/span><div><h3>Tap the play button<\/h3><p>Play or pause the selected device or group.<\/p><\/div><\/div><\/div><\/section><section class=\"new-section\" id=\"topic-3\"><h2>Icons without an image<\/h2><p>For both devices and groups, an icon without an image uses the image area to show a larger name. Icons with images retain the separate name and picture layout.<\/p><figure><div class=\"annotation-stage\" data-source=\"05-5783.jpg\"><img src=\"images/3d792002f82fa8c6893282773348901122ad8d85a093f869f170810f5d2c7aa7.jpg\" alt=\"Examples of groups with/without images and device icons\" loading=\"eager\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 429.6875\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"30\" y=\"154.6875\" width=\"235.0\" height=\"232.03125\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"70\" cy=\"146.09375\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"70\" y=\"146.09375\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"285.0\" y=\"154.6875\" width=\"235.0\" height=\"232.03125\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"330\" cy=\"146.09375\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"330\" y=\"146.09375\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><rect x=\"535.0\" y=\"154.6875\" width=\"240\" height=\"232.03125\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"580\" cy=\"146.09375\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"580\" y=\"146.09375\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">3<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Group with an image. ↔ identifies a stereo-pair group.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Group without an image. Its name is shown larger.<\/span><\/li><li><span class=\"badge\">3<\/span><span>Device icon: shows the product image and name.<\/span><\/li><\/ol><figcaption>Examples of groups with/without images and device icons<\/figcaption><\/figure><\/section><section id=\"startup-refresh\" data-revision=\"137\"><h2>Startup and refresh<\/h2><p>The selected speakers are checked first. Playback information for a confirmed available target can appear while other speakers are still being checked. During regular refresh, replies are displayed as they arrive. Unknown or offline speakers still require connection checks before group operations; this does not start playback or change speaker connections.<\/p><\/section><\/main><\/body><\/html>"}, {"id": "card", "group": "basics", "title": "Device cards & volume", "blocks": [{"id": "update133-4", "title": "Direct volume for each device or group", "text": "Direct volume for each device or groupLong press11Long-press a direct-volume button to open this window, or open the device/group-specific settings from Audio settings. With Use common settings enabled, the target follows the common values. Disable it to set three values for this target. Blank fields hide buttons; 0 is a valid value. Changes save automatically; Close returns to the player. Editing does not change playback volume. A group’s direct-volume buttons still adjust the whole group. These settings are included in backups."}, {"id": "topic-0", "title": "Device Card Overview and Controls", "text": "Step 1Device Card Overview and ControlsThe device card shows the current device or group information and provides playback and control functions.1Device or Group NameDisplays the name of the current device or group.2Device(s) in GroupFor a single device, the device name is shown. For a group, all devices are displayed in order with the leader device first.3Playback SourceShows the current input or streaming source (e.g., Spotify, HDMI).4Track TitleShows the currently playing track title.5Artist and AlbumShows the artist name and album name.6Create Scene ButtonTap the “+” button at the top right to create a scene for the current device or group.Depending on the playback source, track information may not be available."}, {"id": "topic-1", "title": "Group volume and individual speaker levels", "text": "Group volume and individual speaker levelsThe circular G badge identifies a group card. The main volume slider or knob and direct-volume buttons adjust the group as a whole.Tap the down arrow to show one row per speaker, with the leader first and followers below. Each row has its own mute button and volume slider. Drag the thumb to adjust the volume. Tap the bar to the left or right of the thumb to lower or raise the volume by one point. Tap the up arrow to collapse the rows.Individual levels use sliders even with the knob layout. The number of direct-volume buttons and visibility of lower function buttons depend on your settings.1234Numbers in this image1G badge: identifies a group card.2Main volume bar: adjusts the whole group.3Expand button: shows individual speaker controls.4Direct volume: switches to a saved level; this example has one button for 30.Slider layout: collapsed1234Numbers in this image1Up arrow: collapses individual controls.2Leader row: controls this speaker’s volume and mute.3Follower row: adjusts each follower individually.4Speaker button: toggles mute for this row.Slider layout: individual levels expanded1234Numbers in this image1Knob: controls the whole group’s volume.2Expand button: individual controls use sliders even in the knob layout.3The first row controls the leader individually.4Follower controls appear below the leader.Knob layout: individual levels expanded"}, {"id": "topic-2", "title": "Volume Controller", "text": "Step 2Volume ControllerThe device card provides playback and volume controls. Choose between a slider type (default) and a knob type in Settings.1Mute ButtonTap to toggle mute on or off.2Play/Pause ButtonTap to play or pause.3Volume SliderDrag the knob to adjust the volume.4Current VolumeShows the current volume level.B. Knob TypeSwipe left or right on the volume number to adjust it, use +/− for single steps, tap the speaker icon to mute, or tap the play button to play/pause."}, {"id": "topic-3", "title": "Direct Volume Buttons", "text": "Step 3Direct Volume ButtonsRegister up to 3 frequently used volume levels in Settings and switch to them with a single tap.Up to three volume levels can be registered. Tap a button to set the volume directly. For example, 20 / 40 / 60. Be careful when setting high levels to avoid sudden loud playback."}, {"id": "topic-4", "title": "Function Buttons (Up to 4)", "text": "Step 4Function Buttons (Up to 4)Up to four function buttons can appear at the bottom of the device card. They are hidden by default and can be shown or hidden in Settings.12341Input (Input Switching)Switches the WiiM input source, such as Spotify or HDMI. Depending on the device or playback status, switching may not respond.2Output (Output Switching)Switches the audio output destination. Options vary by device; Bluetooth output switching is not supported at this time.3EQ (Equalizer)Switches WiiM EQ settings: saved PEQ profiles, custom GEQ settings, or preset GEQ (Preset EQ).4ScenesOpens registered scenes. Select a scene to switch groups and start playback with a single tap."}, {"id": "topic-5", "title": "Open Operation Panel (Long Press)", "text": "Step 5Open Operation Panel (Long Press)Long press the device or group name area on the device card to open its operation panel. This also works by long pressing a device or group icon."}, {"id": "topic-6", "title": "Switch Devices by Swipe", "text": "Step 6Switch Devices by SwipeSwipe left or right on the device or group name area to open the device switching preview.Swipe1SwipeSwipe left or right on the device or group name area.2PreviewA preview screen with available devices will appear.3SelectTap “Tap to switch” on the desired device.4SwitchThe selected device or group becomes active.To cancel, tap “Cancel” at the top right to return to the original device card."}], "text": "Device cards & volumeDevice card controls, volume, functions and switchingDirect volume for each device or groupLong press11Long-press a direct-volume button to open this window, or open the device/group-specific settings from Audio settings. With Use common settings enabled, the target follows the common values. Disable it to set three values for this target. Blank fields hide buttons; 0 is a valid value. Changes save automatically; Close returns to the player. Editing does not change playback volume. A group’s direct-volume buttons still adjust the whole group. These settings are included in backups.Step 1Device Card Overview and ControlsThe device card shows the current device or group information and provides playback and control functions.1Device or Group NameDisplays the name of the current device or group.2Device(s) in GroupFor a single device, the device name is shown. For a group, all devices are displayed in order with the leader device first.3Playback SourceShows the current input or streaming source (e.g., Spotify, HDMI).4Track TitleShows the currently playing track title.5Artist and AlbumShows the artist name and album name.6Create Scene ButtonTap the “+” button at the top right to create a scene for the current device or group.Depending on the playback source, track information may not be available.Group volume and individual speaker levelsThe circular G badge identifies a group card. The main volume slider or knob and direct-volume buttons adjust the group as a whole.Tap the down arrow to show one row per speaker, with the leader first and followers below. Each row has its own mute button and volume slider. Drag the thumb to adjust the volume. Tap the bar to the left or right of the thumb to lower or raise the volume by one point. Tap the up arrow to collapse the rows.Individual levels use sliders even with the knob layout. The number of direct-volume buttons and visibility of lower function buttons depend on your settings.1234Numbers in this image1G badge: identifies a group card.2Main volume bar: adjusts the whole group.3Expand button: shows individual speaker controls.4Direct volume: switches to a saved level; this example has one button for 30.Slider layout: collapsed1234Numbers in this image1Up arrow: collapses individual controls.2Leader row: controls this speaker’s volume and mute.3Follower row: adjusts each follower individually.4Speaker button: toggles mute for this row.Slider layout: individual levels expanded1234Numbers in this image1Knob: controls the whole group’s volume.2Expand button: individual controls use sliders even in the knob layout.3The first row controls the leader individually.4Follower controls appear below the leader.Knob layout: individual levels expandedStep 2Volume ControllerThe device card provides playback and volume controls. Choose between a slider type (default) and a knob type in Settings.1Mute ButtonTap to toggle mute on or off.2Play/Pause ButtonTap to play or pause.3Volume SliderDrag the knob to adjust the volume.4Current VolumeShows the current volume level.B. Knob TypeSwipe left or right on the volume number to adjust it, use +/− for single steps, tap the speaker icon to mute, or tap the play button to play/pause.Step 3Direct Volume ButtonsRegister up to 3 frequently used volume levels in Settings and switch to them with a single tap.Up to three volume levels can be registered. Tap a button to set the volume directly. For example, 20 / 40 / 60. Be careful when setting high levels to avoid sudden loud playback.Step 4Function Buttons (Up to 4)Up to four function buttons can appear at the bottom of the device card. They are hidden by default and can be shown or hidden in Settings.12341Input (Input Switching)Switches the WiiM input source, such as Spotify or HDMI. Depending on the device or playback status, switching may not respond.2Output (Output Switching)Switches the audio output destination. Options vary by device; Bluetooth output switching is not supported at this time.3EQ (Equalizer)Switches WiiM EQ settings: saved PEQ profiles, custom GEQ settings, or preset GEQ (Preset EQ).4ScenesOpens registered scenes. Select a scene to switch groups and start playback with a single tap.Step 5Open Operation Panel (Long Press)Long press the device or group name area on the device card to open its operation panel. This also works by long pressing a device or group icon.Step 6Switch Devices by SwipeSwipe left or right on the device or group name area to open the device switching preview.Swipe1SwipeSwipe left or right on the device or group name area.2PreviewA preview screen with available devices will appear.3SelectTap “Tap to switch” on the desired device.4SwitchThe selected device or group becomes active.To cancel, tap “Cancel” at the top right to return to the original device card.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM Device Card Guide<\/title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#24243a;font-family:system-ui,-apple-system,\"Noto Sans\",sans-serif;line-height:1.55}.wrap{max-width:680px;margin:auto;padding:10px 12px 40px}header{background:linear-gradient(100deg,#351078,#4c00c9);color:white;border-radius:12px;padding:18px 20px;margin-bottom:14px}header h1{font-size:clamp(23px,5vw,33px);line-height:1.2;margin:0}header p{margin:7px 0 0;font-size:14px}section{border:1px solid #e4e5f2;border-radius:17px;background:#fff;padding:15px;margin:13px 0;box-shadow:0 2px 10px #14104408}.heading{display:flex;gap:12px;align-items:center;margin-bottom:10px}.num{display:grid;place-items:center;background:#f7257e;color:white;border-radius:50%;font-size:24px;font-weight:800;min-width:44px;height:44px}.heading h2{margin:0;color:#4106a3;font-size:21px;line-height:1.25}p{margin:9px 0 12px}.shot{display:block;width:100%;height:auto;border-radius:9px;background:#15131b;margin:12px 0}.subhead{font-weight:750;color:#4915a0;margin-top:17px}.points{display:grid;gap:9px;margin-top:12px}.point{display:flex;gap:10px;align-items:flex-start;padding:10px;background:#f5f4fd;border-radius:11px}.tiny{background:#f7257e;color:white;border-radius:50%;font-size:14px;font-weight:750;min-width:26px;height:26px;display:grid;place-items:center}.point strong{display:block;color:#42148d}.point p{margin:2px 0 0;font-size:14px}.note{background:#eaf1ff;border-radius:10px;padding:11px 13px;font-size:14px;color:#27486d;margin-top:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pair figure{margin:0}.pair figcaption{font-weight:700;color:#48109d;text-align:center}@media(max-width:440px){.wrap{padding:7px}section{padding:12px}.pair{gap:8px}.heading h2{font-size:19px}}<\/style><s
