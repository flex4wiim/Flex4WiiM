ng:5px 10px!important;border-radius:7px!important;font-size:14px!important;white-space:nowrap}.callout-heading{font-weight:700;margin:16px 0 8px}.annotation-legend{counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"card\"><main class=\"wrap\"><header><h1>Device cards &amp; volume<\/h1><p>Device card controls, volume, functions and switching<\/p><\/header><section class=\"manual-update\" id=\"update133-4\"><h2>Direct volume for each device or group<\/h2><figure class=\"manual-detail\"><figcaption>Long press<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/210.78918192866126\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:40.32465007087844%;width:90%;height:45.44312049234093%\"><img src=\"images/v133-01-3938.jpg\" alt=\"Long press\" loading=\"eager\" decoding=\"async\" style=\"width:112.35955056179773%!important;left:-11.235955056179774%;top:-1358.4615384615383%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 210.78918192866126\" aria-hidden=\"true\"><rect x=\"76.29213483146067\" y=\"108.57887555167049\" width=\"875.7303370786517\" height=\"58.94718887917617\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"474.7191011235956\" cy=\"138.0524699912586\" r=\"25\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"5\"><\/circle><circle cx=\"474.7191011235956\" cy=\"138.0524699912586\" r=\"14\" fill=\"#ed2244\" fill-opacity=\".22\" stroke=\"#ed2244\" stroke-width=\"3\"><\/circle><path d=\"M 509.7191011235956 176.0524699912586 L 481.7191011235956 144.0524699912586 L 486.7191011235956 181.0524699912586\" fill=\"white\" stroke=\"#ed2244\" stroke-width=\"4\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><\/figure><div class=\"annotation-stage\" data-source=\"05-3928.jpg\"><img src=\"images/v133-05-3928.jpg\" alt=\"Direct volume for each device or group\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1431 1536\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"71.55\" y=\"176.64000000000001\" width=\"1037.475\" height=\"629.76\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"121.635\" cy=\"122.555\" r=\"50.08500000000001\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"121.635\" y=\"122.555\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"62.60625000000001\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Long-press a direct-volume button to open this window, or open the device/group-specific settings from Audio settings. With Use common settings enabled, the target follows the common values. Disable it to set three values for this target. Blank fields hide buttons; 0 is a valid value. Changes save automatically; Close returns to the player. Editing does not change playback volume. A group’s direct-volume buttons still adjust the whole group. These settings are included in backups.<\/span><\/li><\/ol><\/section><section id=\"topic-0\"><div class=\"heading\"><span class=\"num step-label\">Step 1<\/span><h2>Device Card Overview and Controls<\/h2><\/div><p>The device card shows the current device or group information and provides playback and control functions.<\/p><img class=\"shot\" src=\"images/994bb2ed883668217c49a2ebc533c060e27d5fb576dee5cac86e9dc24637fb8a.png\" alt=\"Device Card Overview and Controls\" loading=\"eager\" decoding=\"async\"><div class=\"points\"><div class=\"point\"><span class=\"tiny\">1<\/span><div><strong>Device or Group Name<\/strong><p>Displays the name of the current device or group.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">2<\/span><div><strong>Device(s) in Group<\/strong><p>For a single device, the device name is shown. For a group, all devices are displayed in order with the leader device first.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">3<\/span><div><strong>Playback Source<\/strong><p>Shows the current input or streaming source (e.g., Spotify, HDMI).<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">4<\/span><div><strong>Track Title<\/strong><p>Shows the currently playing track title.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">5<\/span><div><strong>Artist and Album<\/strong><p>Shows the artist name and album name.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">6<\/span><div><strong>Create Scene Button<\/strong><p>Tap the “+” button at the top right to create a scene for the current device or group.<\/p><\/div><\/div><\/div><div class=\"note\">Depending on the playback source, track information may not be available.<\/div><\/section><section class=\"new-section\" id=\"topic-1\"><h2>Group volume and individual speaker levels<\/h2><p>The circular G badge identifies a group card. The main volume slider or knob and direct-volume buttons adjust the group as a whole.<\/p><p>Tap the down arrow to show one row per speaker, with the leader first and followers below. Each row has its own mute button and volume slider. Drag the thumb to adjust the volume. Tap the bar to the left or right of the thumb to lower or raise the volume by one point. Tap the up arrow to collapse the rows.<\/p><p>Individual levels use sliders even with the knob layout. The number of direct-volume buttons and visibility of lower function buttons depend on your settings.<\/p><figure><div class=\"annotation-stage\" data-source=\"01-3852.jpg\"><img src=\"images/4ca71fb9b8e008426722279c6e98a679088072b3cf6789921ab582edb213f92a.jpg\" alt=\"Slider layout: collapsed\" loading=\"eager\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 370.4427083333333\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"40\" y=\"29.635416666666664\" width=\"250\" height=\"40.748697916666664\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"330\" cy=\"48.15755208333333\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"330\" y=\"48.15755208333333\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"165.0\" y=\"222.265625\" width=\"790\" height=\"40.748697916666664\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"940\" cy=\"196.33463541666663\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"940\" y=\"196.33463541666663\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><rect x=\"43.0\" y=\"275.9798177083333\" width=\"97.0\" height=\"55.56640625\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"60\" cy=\"255.60546875\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"60\" y=\"255.60546875\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">3<\/text><rect x=\"150\" y=\"275.9798177083333\" width=\"805.0\" height=\"55.56640625\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"920\" cy=\"266.71875\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"920\" y=\"266.71875\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">4<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>G badge: identifies a group card.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Main volume bar: adjusts the whole group.<\/span><\/li><li><span class=\"badge\">3<\/span><span>Expand button: shows individual speaker controls.<\/span><\/li><li><span class=\"badge\">4<\/span><span>Direct volume: switches to a saved level; this example has one button for 30.<\/span><\/li><\/ol><figcaption>Slider layout: collapsed<\/figcaption><\/figure><figure><div class=\"annotation-stage\" data-source=\"02-3854.jpg\"><img src=\"images/3196c2172e7cfaf7db10d62a058171d6169413903c1f38623651021f87d74998.jpg\" alt=\"Slider layout: individual levels expanded\" loading=\"eager\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 520.1822916666666\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"43.0\" y=\"273.09570312499994\" width=\"97.0\" height=\"54.619140625\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"60\" cy=\"249.6875\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"60\" y=\"249.6875\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"40\" y=\"348.52213541666663\" width=\"920\" height=\"57.22005208333333\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"80\" cy=\"343.3203125\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"80\" y=\"343.3203125\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><rect x=\"40\" y=\"421.34765625\" width=\"920\" height=\"57.22005208333333\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"80\" cy=\"416.14583333333326\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"80\" y=\"416.14583333333326\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">3<\/text><rect x=\"397.0\" y=\"358.92578125\" width=\"45.0\" height=\"30.170572916666664\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"470\" cy=\"353.72395833333326\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"470\" y=\"353.72395833333326\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">4<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Up arrow: collapses individual controls.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Leader row: controls this speaker’s volume and mute.<\/span><\/li><li><span class=\"badge\">3<\/span><span>Follower row: adjusts each follower individually.<\/span><\/li><li><span class=\"badge\">4<\/span><span>Speaker button: toggles mute for this row.<\/span><\/li><\/ol><figcaption>Slider layout: individual levels expanded<\/figcaption><\/figure><figure><div class=\"annotation-stage\" data-source=\"03-3856.jpg\"><img src=\"images/21815ac1fc3022d92628298247034cfe3666cc6897c24563897edc87077c7c49.jpg\" alt=\"Knob layout: individual levels expanded\" loading=\"eager\" decoding=\"async\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 466.796875\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"790\" y=\"28.0078125\" width=\"150\" height=\"135.37109375\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"750\" cy=\"42.01171875\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"750\" y=\"42.01171875\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">1<\/text><rect x=\"605.0\" y=\"217.060546875\" width=\"100\" height=\"56.015625\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"570\" cy=\"224.0625\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"570\" y=\"224.0625\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">2<\/text><rect x=\"40\" y=\"298.75\" width=\"920\" height=\"56.015625\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"80\" cy=\"294.08203125\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"80\" y=\"294.08203125\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">3<\/text><rect x=\"40\" y=\"368.76953125\" width=\"920\" height=\"56.015625\" rx=\"9\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"2.5\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"80\" cy=\"364.1015625\" r=\"29\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\/circle><text x=\"80\" y=\"364.1015625\" fill=\"white\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Arial, sans-serif\" font-size=\"40\" font-weight=\"700\">4<\/text><\/svg><\/div><p class=\"callout-heading\">Numbers in this image<\/p><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Knob: controls the whole group’s volume.<\/span><\/li><li><span class=\"badge\">2<\/span><span>Expand button: individual controls use sliders even in the knob layout.<\/span><\/li><li><span class=\"badge\">3<\/span><span>The first row controls the leader individually.<\/span><\/li><li><span class=\"badge\">4<\/span><span>Follower controls appear below the leader.<\/span><\/li><\/ol><figcaption>Knob layout: individual levels expanded<\/figcaption><\/figure><\/section><section id=\"topic-2\"><div class=\"heading\"><span class=\"num step-label\">Step 2<\/span><h2>Volume Controller<\/h2><\/div><p>The device card provides playback and volume controls. Choose between a slider type (default) and a knob type in Settings.<\/p><img class=\"shot\" src=\"images/942fff6eb5a96576d9dfd45399726606c617a92c2a1f3dcb3d7e6e62609def93.png\" alt=\"Volume Controller\" loading=\"eager\" decoding=\"async\"><div class=\"points\"><div class=\"point\"><span class=\"tiny\">1<\/span><div><strong>Mute Button<\/strong><p>Tap to toggle mute on or off.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">2<\/span><div><strong>Play/Pause Button<\/strong><p>Tap to play or pause.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">3<\/span><div><strong>Volume Slider<\/strong><p>Drag the knob to adjust the volume.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">4<\/span><div><strong>Current Volume<\/strong><p>Shows the current volume level.<\/p><\/div><\/div><\/div><div class=\"subhead\">B. Knob Type<\/div><img class=\"shot\" style=\"max-width:240px;margin-left:auto;margin-right:auto\" src=\"images/40083364f59655fd42a38e0740c2a7aea6480f782e6246d6d6ce2fecdeccb786.png\" alt=\"Knob controller\" loading=\"eager\" decoding=\"async\"><p>Swipe left or right on the volume number to adjust it, use +/− for single steps, tap the speaker icon to mute, or tap the play button to play/pause.<\/p><\/section><section id=\"topic-3\"><div class=\"heading\"><span class=\"num step-label\">Step 3<\/span><h2>Direct Volume Buttons<\/h2><\/div><p>Register up to 3 frequently used volume levels in Settings and switch to them with a single tap.<\/p><img class=\"shot\" src=\"images/5a56a1e58d217542ae7c159a1f844334ad7fd375aca24bbf5dab65546a0d3b0e.png\" alt=\"Direct Volume Buttons\" loading=\"eager\" decoding=\"async\"><div class=\"note\">Up to three volume levels can be registered. Tap a button to set the volume directly. For example, 20 / 40 / 60. Be careful when setting high levels to avoid sudden loud playback.<\/div><\/section><section id=\"topic-4\"><div class=\"heading\"><span class=\"num step-label\">Step 4<\/span><h2>Function Buttons (Up to 4)<\/h2><\/div><p>Up to four function buttons can appear at the bottom of the device card. They are hidden by default and can be shown or hidden in Settings.<\/p><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/189.38016528925618\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:44.88326423739909%;width:90%;height:39.27558367881301%\"><img src=\"images/dda9cfe4248568d7b2f1781270b21951c969b1d5029bc83893f01d2e65886ae2.png\" alt=\"Function Buttons (Up to 4)\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 189.38016528925618\" aria-hidden=\"true\"><rect x=\"68.0\" y=\"93.92561983471074\" width=\"202.5\" height=\"56.528925619834716\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"279.5\" y=\"93.92561983471074\" width=\"211.5\" height=\"56.528925619834716\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"500.00000000000006\" y=\"93.92561983471074\" width=\"211.5\" height=\"56.528925619834716\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><rect x=\"720.5\" y=\"93.92561983471074\" width=\"211.5\" height=\"56.528925619834716\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"158.0\" cy=\"62.68595041322314\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"158.0\" y=\"63.68595041322314\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">1<\/text><circle cx=\"380.3\" cy=\"62.68595041322314\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"380.3\" y=\"63.68595041322314\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">2<\/text><circle cx=\"602.6\" cy=\"62.68595041322314\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"602.6\" y=\"63.68595041322314\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">3<\/text><circle cx=\"824.9000000000001\" cy=\"62.68595041322314\" r=\"23\" fill=\"#c51130\" stroke=\"white\" stroke-width=\"3\"><\/circle><text x=\"824.9000000000001\" y=\"63.68595041322314\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-size=\"28.06\" font-family=\"Arial,sans-serif\" font-weight=\"700\">4<\/text><\/svg><\/div><div class=\"points\"><div class=\"point\"><span class=\"tiny\">1<\/span><div><strong>Input (Input Switching)<\/strong><p>Switches the WiiM input source, such as Spotify or HDMI. Depending on the device or playback status, switching may not respond.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">2<\/span><div><strong>Output (Output Switching)<\/strong><p>Switches the audio output destination. Options vary by device; Bluetooth output switching is not supported at this time.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">3<\/span><div><strong>EQ (Equalizer)<\/strong><p>Switches WiiM EQ settings: saved PEQ profiles, custom GEQ settings, or preset GEQ (Preset EQ).<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">4<\/span><div><strong>Scenes<\/strong><p>Opens registered scenes. Select a scene to switch groups and start playback with a single tap.<\/p><\/div><\/div><\/div><\/section><section id=\"topic-5\"><div class=\"heading\"><span class=\"num step-label\">Step 5<\/span><h2>Open Operation Panel (Long Press)<\/h2><\/div><p>Long press the device or group name area on the device card to open its operation panel. This also works by long pressing a device or group icon.<\/p><img class=\"shot\" src=\"images/5517fb4e592dd81e492e63479be832b4929076202e31af044574e02f0b16d8f3.png\" alt=\"Open Operation Panel (Long Press)\" loading=\"eager\" decoding=\"async\"><\/section><section id=\"topic-6\"><div class=\"heading\"><span class=\"num step-label\">Step 6<\/span><h2>Switch Devices by Swipe<\/h2><\/div><p>Swipe left or right on the device or group name area to open the device switching preview.<\/p><figure class=\"manual-detail\"><figcaption>Swipe<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/280.65982404692085\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:8.90758058617627%;width:90%;height:80.40332271041221%\"><img src=\"images/994bb2ed883668217c49a2ebc533c060e27d5fb576dee5cac86e9dc24637fb8a.png\" alt=\"Swipe\" loading=\"eager\" decoding=\"async\" style=\"width:161.29032258064515%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 280.65982404692085\" aria-hidden=\"true\"><rect x=\"86.29032258064517\" y=\"36.572298669072865\" width=\"391.9354838709678\" height=\"75.21994134897362\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/373.3673469387755\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.695818529652911%;width:90%;height:85.26919923476359%\"><img src=\"images/47767c440151e9bda2050eb178706557e2461b69e9dfff4b3c94dd59e6d1823d.png\" alt=\"Switch Devices by Swipe\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 373.3673469387755\" aria-hidden=\"true\"><rect x=\"248.0\" y=\"228.75510204081633\" width=\"387.0\" height=\"89.14285714285715\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><div class=\"points\"><div class=\"point\"><span class=\"tiny\">1<\/span><div><strong>Swipe<\/strong><p>Swipe left or right on the device or group name area.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">2<\/span><div><strong>Preview<\/strong><p>A preview screen with available devices will appear.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">3<\/span><div><strong>Select<\/strong><p>Tap “Tap to switch” on the desired device.<\/p><\/div><\/div><div class=\"point\"><span class=\"tiny\">4<\/span><div><strong>Switch<\/strong><p>The selected device or group becomes active.<\/p><\/div><\/div><\/div><div class=\"note\">To cancel, tap “Cancel” at the top right to return to the original device card.<\/div><\/section><\/main><\/body><\/html>"}, {"id": "artwork", "group": "basics", "title": "Artwork & playback", "blocks": [{"id": "topic-0", "title": "Step 1Artwork & Playback", "text": "Step 1Artwork & PlaybackThis section displays the current album artwork, track information, and playback controls.1. Album artworkShows the artwork of the currently playing track.2. Playback sourceDisplays the active source, such as Spotify or YouTube Music.3. Track titleShows the currently playing track title.4. Artist and albumShows the artist name and album name.5. Audio informationWhen available, shows the sampling rate (kHz) and bit rate (kbps); this depends on the source."}, {"id": "topic-1", "title": "Step 2Album Artwork Touch Operations", "text": "Step 2Album Artwork Touch OperationsUse gestures on the album artwork to control playback.Double tapOpens the fullscreen player.Swipe leftSkips to the next track.Swipe rightGoes to the previous track. On some services, this may return to the beginning of the current track; double-tap the previous-track button if needed."}, {"id": "topic-2", "title": "Step 3Playback Controller Position", "text": "Step 3Playback Controller PositionChoose top, bottom, left, or right in Settings. The default position is the right side (vertical)."}, {"id": "topic-3", "title": "Step 4Playback Control Buttons", "text": "Step 4Playback Control ButtonsThe following controls are available in the playback controller.1. ShuffleTurns shuffle playback on or off.2. Previous trackGoes to the previous track or returns to the beginning of the current track.3. Play / PauseStarts or pauses playback.4. Next trackSkips to the next track.5. RepeatCycles through Off → All tracks → One track → Off.6. Playback queueWhen supported, opens the list of upcoming tracks."}, {"id": "topic-4", "title": "Step 5Repeat Button Operation", "text": "Step 5Repeat Button OperationEach tap advances the repeat mode: Off → All tracks → One track → Off.OffAll tracks1One trackOffNoteTurning shuffle on also turns repeat on. Queue availability and some controls depend on the playback source."}, {"id": "topic-5", "title": "Step 6Progress Bar (Seek Bar)", "text": "Step 6Progress Bar (Seek Bar)The bar below the playback controls indicates the current playback position.1. Elapsed timeTime played so far.2. Progress barDrag the knob to change playback position, when seeking is supported by the source and device.3. Remaining timeTime left in the track."}], "text": "Artwork & playbackStep 1Artwork & PlaybackThis section displays the current album artwork, track information, and playback controls.1. Album artworkShows the artwork of the currently playing track.2. Playback sourceDisplays the active source, such as Spotify or YouTube Music.3. Track titleShows the currently playing track title.4. Artist and albumShows the artist name and album name.5. Audio informationWhen available, shows the sampling rate (kHz) and bit rate (kbps); this depends on the source.Step 2Album Artwork Touch OperationsUse gestures on the album artwork to control playback.Double tapOpens the fullscreen player.Swipe leftSkips to the next track.Swipe rightGoes to the previous track. On some services, this may return to the beginning of the current track; double-tap the previous-track button if needed.Step 3Playback Controller PositionChoose top, bottom, left, or right in Settings. The default position is the right side (vertical).Step 4Playback Control ButtonsThe following controls are available in the playback controller.1. ShuffleTurns shuffle playback on or off.2. Previous trackGoes to the previous track or returns to the beginning of the current track.3. Play / PauseStarts or pauses playback.4. Next trackSkips to the next track.5. RepeatCycles through Off → All tracks → One track → Off.6. Playback queueWhen supported, opens the list of upcoming tracks.Step 5Repeat Button OperationEach tap advances the repeat mode: Off → All tracks → One track → Off.OffAll tracks1One trackOffNoteTurning shuffle on also turns repeat on. Queue availability and some controls depend on the playback source.Step 6Progress Bar (Seek Bar)The bar below the playback controls indicates the current playback position.1. Elapsed timeTime played so far.2. Progress barDrag the knob to change playback position, when seeking is supported by the source and device.3. Remaining timeTime left in the track.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM Artwork &amp; Playback<\/title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#202037;font:16px/1.65 system-ui,-apple-system,'Noto Sans',sans-serif}\nmain{max-width:760px;margin:auto;padding:12px 14px 40px}\nheader{background:linear-gradient(100deg,#4800a8,#7d18d1);color:white;border-radius:13px;padding:18px 20px;margin-bottom:16px}\nheader h1{font-size:clamp(22px,5vw,31px);line-height:1.25;margin:0}header p{margin:7px 0 0;color:#f3eaff}\nsection{border:1px solid #e6e2f0;border-radius:16px;padding:17px;margin:15px 0;background:#fff}\nh2{color:#6415bd;font-size:21px;line-height:1.3;margin:0 0 12px;display:flex;gap:10px;align-items:center}\n.num{background:linear-gradient(135deg,#e90079,#a03fda);color:white;min-width:39px;height:39px;border-radius:13px;display:inline-grid;place-items:center;font-weight:800}\nfigure{margin:12px 0}figure img{display:block;width:100%;height:auto;border-radius:10px;background:#15131b}\np{margin:9px 0}ul,ol{padding-left:23px}li{margin:7px 0}strong{color:#4d1598}\n.note{background:#fbedf7;border-left:4px solid #e90086;border-radius:8px;padding:10px 13px}\n.sub{background:#f7f5fc;border-radius:10px;padding:12px;margin:12px 0}\nfooter{color:#666;font-size:13px;margin-top:24px}<\/style><style>html,body{margin:0!important;min-height:0!important;overflow-x:hidden!important}body{padding:8px!important;box-sizing:border-box!important}main,.wrap,.page{width:auto!important;max-width:100%!important;margin:0 auto!important;box-sizing:border-box!important}img{max-width:100%!important;height:auto!important;object-fit:contain!important;cursor:zoom-in}figure{max-width:100%;margin-left:0!important;margin-right:0!important}h1{font-size:clamp(23px,4vw,34px)!important}p,li,figcaption{overflow-wrap:anywhere}section,article{min-width:0;box-sizing:border-box}.new-section{padding:20px;border:1px solid #aaa6;border-radius:16px;margin:20px 0}.new-section p{line-height:1.8}.new-section figure{margin-top:20px}mark{background:#ffe476;color:#17131f} @media(max-width:520px){main,.wrap,.page{padding:8px!important}section,article{padding-left:12px!important;padding-right:12px!important}.items,.points,.grid{grid-template-columns:1fr!important}}<\/style><style>.annotation-stage{position:relative;display:block;width:100%;margin:0 auto;line-height:0}.annotation-stage>img{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;margin:0!important;border-radius:0!important}.annotation-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotation-legend{font-size:16px;line-height:1.75;margin:12px 0 22px!important;padding:0!important;list-style:none!important}.annotation-legend li{display:flex;align-items:flex-start;gap:10px;margin:9px 0}.annotation-legend .badge{display:inline-flex;align-items:center;justify-content:center;background:#b81024;color:white;border:2px solid white;box-shadow:0 0 0 1px #b81024;border-radius:50%;min-width:25px;height:25px;font:700 14px/1 system-ui;margin-top:2px;flex-shrink:0}.annotations-off .annotation-stage>svg{display:none}.annotation-stage:focus-within{outline:2px solid #bd97ff}<\/style><style>.step-label{width:auto!important;min-width:0!important;height:auto!important;padding:5px 10px!important;border-radius:7px!important;font-size:14px!important;white-space:nowrap}.callout-heading{font-weight:700;margin:16px 0 8px}.annotation-legend{counter-reset:none}.annotation-legend li{list-style:none}<\/style><style>.manual-update{border:1px solid #aaa6;border-radius:16px;padding:18px;margin:20px 0}.manual-update h2{font-size:clamp(20px,4vw,28px)}.manual-update .annotation-stage{position:relative;width:100%;max-width:950px;margin:16px auto}.manual-update .annotation-stage img{display:block;width:100%;height:auto}.manual-update .annotation-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.manual-update .annotation-legend{list-style:none;padding:0}.manual-update .annotation-legend li{display:flex;gap:12px;line-height:1.8}.manual-update .badge{flex-shrink:0;background:#b81024;color:white;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}.annotations-off .annotation-stage svg{display:none}<\/style><style>.manual-detail{margin:18px auto!important;max-width:520px}.manual-detail figcaption{font-size:16px;line-height:1.6;margin:8px 0;font-weight:650}.revised-stage{position:relative!important;display:block!important;width:100%!important;line-height:0;background:#fff;border-radius:0!important;overflow:visible!important}.revised-stage .detail-window{position:absolute;overflow:hidden;background:#fff}.revised-stage .detail-window img{position:absolute!important;max-width:none!important;height:auto!important;margin:0!important;padding:0!important;border-radius:0!important;object-fit:fill!important}.revised-stage>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.annotations-off .revised-stage>svg{display:none}.manual-numbered{list-style:none!important;padding:0!important;margin:14px 0!important}.manual-numbered li{display:flex;gap:12px;margin:10px 0;line-height:1.7}.manual-numbered b{flex:none;border-radius:50%;background:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"artwork\"><main><header><h1>Artwork &amp; playback<\/h1><\/header><section id=\"topic-0\"><h2><span class=\"num step-label\">Step 1<\/span>Artwork &amp; Playback<\/h2><p>This section displays the current album artwork, track information, and playback controls.<\/p><figure><img src=\"images/8ef52ac1d207590d1fc002c9078e59417f43c8dcecc5cf429e0000568ef888f4.png\" alt=\"Artwork &amp; Playback\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"sub\"><p><strong>1. Album artwork<\/strong><br>Shows the artwork of the currently playing track.<\/p><p><strong>2. Playback source<\/strong><br>Displays the active source, such as Spotify or YouTube Music.<\/p><p><strong>3. Track title<\/strong><br>Shows the currently playing track title.<\/p><p><strong>4. Artist and album<\/strong><br>Shows the artist name and album name.<\/p><p><strong>5. Audio information<\/strong><br>When available, shows the sampling rate (kHz) and bit rate (kbps); this depends on the source.<\/p><\/div><\/section><section id=\"topic-1\"><h2><span class=\"num step-label\">Step 2<\/span>Album Artwork Touch Operations<\/h2><p>Use gestures on the album artwork to control playback.<\/p><figure><img src=\"images/d8b4fbfc0d931e63574ddd748dc3261569f0de502f2c8f7079dc2703ac4cb6ae.png\" alt=\"Album Artwork Touch Operations\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"sub\"><p><strong>Double tap<\/strong><br>Opens the fullscreen player.<\/p><p><strong>Swipe left<\/strong><br>Skips to the next track.<\/p><p><strong>Swipe right<\/strong><br>Goes to the previous track. On some services, this may return to the beginning of the current track; double-tap the previous-track button if needed.<\/p><\/div><\/section><section id=\"topic-2\"><h2><span class=\"num step-label\">Step 3<\/span>Playback Controller Position<\/h2><p>Choose top, bottom, left, or right in Settings. The default position is the right side (vertical).<\/p><figure><img src=\"images/a6e12061834363cd44ce57834cd7062cb75345cce859800a5d24b45e203b8979.png\" alt=\"Playback Controller Position\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-3\"><h2><span class=\"num step-label\">Step 4<\/span>Playback Control Buttons<\/h2><p>The following controls are available in the playback controller.<\/p><figure><img src=\"images/a2c7d2a2eed06c8572cbe7af9499a52a5264672e62138bcdef71f88475947921.png\" alt=\"Playback Control Buttons\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"sub\"><p><strong>1. Shuffle<\/strong><br>Turns shuffle playback on or off.<\/p><p><strong>2. Previous track<\/strong><br>Goes to the previous track or returns to the beginning of the current track.<\/p><p><strong>3. Play / Pause<\/strong><br>Starts or pauses playback.<\/p><p><strong>4. Next track<\/strong><br>Skips to the next track.<\/p><p><strong>5. Repeat<\/strong><br>Cycles through Off → All tracks → One track → Off.<\/p><p><strong>6. Playback queue<\/strong><br>When supported, opens the list of upcoming tracks.<\/p><\/div><\/section><section id=\"topic-4\"><h2><span class=\"num step-label\">Step 5<\/span>Repeat Button Operation<\/h2><p>Each tap advances the repeat mode: Off → All tracks → One track → Off.<\/p><figure><div class=\"repeat-sequence\"><div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M 10 18 H 37 L 31 12 M 37 18 L 31 24 M 38 30 H 11 L 17 24 M 11 30 L 17 36\" fill=\"none\" stroke=\"#272036\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>Off<\/span><\/div><div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M 10 18 H 37 L 31 12 M 37 18 L 31 24 M 38 30 H 11 L 17 24 M 11 30 L 17 36\" fill=\"none\" stroke=\"#272036\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>All tracks<\/span><\/div><div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M 10 18 H 37 L 31 12 M 37 18 L 31 24 M 38 30 H 11 L 17 24 M 11 30 L 17 36\" fill=\"none\" stroke=\"#272036\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><text x=\"24\" y=\"28\" text-anchor=\"middle\" font-size=\"14\" fill=\"#272036\">1<\/text><\/svg><span>One track<\/span><\/div><div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M 10 18 H 37 L 31 12 M 37 18 L 31 24 M 38 30 H 11 L 17 24 M 11 30 L 17 36\" fill=\"none\" stroke=\"#272036\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span>Off<\/span><\/div><\/div><\/figure><div class=\"sub\"><p><strong>Note<\/strong><br>Turning shuffle on also turns repeat on. Queue availability and some controls depend on the playback source.<\/p><\/div><\/section><section id=\"topic-5\"><h2><span class=\"num step-label\">Step 6<\/span>Progress Bar (Seek Bar)<\/h2><p>The bar below the playback controls indicates the current playback position.<\/p><figure><img src=\"images/c3c38341aa08ee43ba3151d57170dca10f88d1c884e01ad2fad6a7b84eb03349.png\" alt=\"Progress Bar (Seek Bar)\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"sub\"><p><strong>1. Elapsed time<\/strong><br>Time played so far.<\/p><p><strong>2. Progress bar<\/strong><br>Drag the knob to change playback position, when seeking is supported by the source and device.<\/p><p><strong>3. Remaining time<\/strong><br>Time left in the track.<\/p><\/div><\/section><\/main><\/body><\/html>"}, {"id": "player", "group": "basics", "title": "Mini & full-screen player", "blocks": [{"id": "update133-7", "title": "Portrait: enlarge track information", "text": "Portrait: enlarge track information111Double-tap the title or artist/album area to switch between the normal and enlarged text sizes. Portrait starts at its normal size; enlarging slightly reduces the artwork to make room. Artist and album remain on one line, at about two-thirds of the title size. Long text continues to scroll. Audio-format text keeps its size."}, {"id": "update133-8", "title": "Landscape: reduce track information", "text": "Landscape: reduce track information111Double-tap the title or artist/album area to switch between the large and smaller text sizes. The clock keeps its size. The text-size switch is available in all player display modes. Swipe left/right on the artwork or track-information area to change tracks, both in the main artwork/playback section and in the full-screen player. Swipe down on either area to close the full-screen player when unlocked. Device-card swipes still preview another target; they do not skip tracks."}, {"id": "topic-0", "title": "Step 1Mini player (bottom of the screen)", "text": "Step 1Mini player (bottom of the screen)When enabled in Settings, the mini player stays at the bottom of the main screen and shows album artwork, the track title, artist and album, plus playback controls. Tap the mini player to open the full screen player. Swipe left or right on the mini player to change tracks. The playback and queue buttons can be positioned on the left or right in Settings."}, {"id": "topic-1", "title": "Step 2Full screen player", "text": "Step 2Full screen playerTap the mini player to open the full screen player. Album artwork, track information and playback controls are displayed in a larger view.Swipe left on the album artwork for the next track, or right for the previous track. You can also swipe on the track information. Swipe down on the artwork or track information to close the full-screen player when it is unlocked.Swipe"}, {"id": "topic-2", "title": "Step 3Full screen player controls", "text": "Step 3Full screen player controlsThe full screen player provides shuffle, previous track, play/pause, next track, repeat and playback queue (when available). It also provides mute and volume, direct volume control, input, output, EQ and Scenes.Available buttons and track information depend on the device and music service."}, {"id": "topic-3", "title": "Step 4Sleep timer", "text": "Step 4Sleep timerTap the sleep timer icon to turn the timer on or off. Long press it to open the duration settings, enter 1–1440 minutes, then tap Save. The new duration applies the next time the timer is turned on; playback stops after the set time.Long press"}, {"id": "topic-4", "title": "Step 5Album artwork display mode", "text": "Step 5Album artwork display modeTap the record icon to open Player display settings. Choose Standard Artwork, Vinyl, Listening Room or Minimal. Standard Artwork displays the cover normally; Vinyl alternates artwork with a rotating record; Listening Room shows a room scene with audio equipment; Minimal simplifies the display.Tap"}, {"id": "topic-5", "title": "Step 6Date and time display", "text": "Step 6Date and time displayTap the clock icon to show or hide the current date and time at the top of the full screen player. When shown, an alarm icon may also appear for a scene alarm; tap it to set an alarm.Tap"}, {"id": "topic-6", "title": "Step 7Large clock display", "text": "Step 7Large clock displayWhen the date and time are displayed, tap the time to show a larger clock.Tap"}, {"id": "topic-7", "title": "Step 8Lock the player", "text": "Step 8Lock the playerTap the lock icon to lock the full screen player. This helps keep the player open and prevents accidental closing by swipe gestures. It is useful on a dedicated music-control tablet."}, {"id": "topic-8", "title": "Step 9Close the player or show/hide top controls", "text": "Step 9Close the player or show/hide top controlsTap × to close the full screen player and return to the main screen. Tap the > icon to show or hide the top control icons for a cleaner view of the artwork and track information."}, {"id": "topic-9", "title": "Step 10Additional feature: expand group volume sliders", "text": "Step 10Additional feature: expand group volume slidersDuring group playback, an expand button appears to the left of the direct volume button. Tap it once to show the volume sliders for all group members, allowing individual volume adjustment. Tap it again to collapse the sliders. This button appears only during group playback.Tap"}, {"id": "topic-10", "title": "Individual group volume in full screen", "text": "Individual group volume in full screenWhen a group is selected, use the expand button to the left of the direct-volume buttons. The leader appears first, followed by the followers. The main volume bar controls the group; each expanded row controls that speaker.Expanding reduces the artwork and moves the playback and main volume controls upward to make room. Direct-volume buttons and the controls below them stay in place."}, {"id": "topic-11", "title": "Sleep timer confirmation", "text": "Sleep timer confirmationAfter a tap on the sleep button and a confirmed device response, “Sleep on” or “Sleep off” appears in the centre for about two seconds. Hold the button to set the number of minutes. A failed request does not show a success message."}, {"id": "full-player-devices-138", "title": "Mini & full-screen player", "text": "In Settings → Layout → Mini player, enable “Show device icons in the full-screen player”. When the device/group section is pinned first, icons appear at the top in portrait or on the left in landscape. Tap an icon to switch without leaving the player. Text and control sizes are preserved; artwork fits the remaining space. Off by default. Icons are not shown when the section is hidden, is not first, or uses the Wrap layout."}], "text": "Mini & full-screen playerPlayback controls, display modes, and group volume sliders.Portrait: enlarge track information111Double-tap the title or artist/album area to switch between the normal and enlarged text sizes. Portrait starts at its normal size; enlarging slightly reduces the artwork to make room. Artist and album remain on one line, at about two-thirds of the title size. Long text continues to scroll. Audio-format text keeps its size.Landscape: reduce track information111Double-tap the title or artist/album area to switch between the large and smaller text sizes. The clock keeps its size. The text-size switch is available in all player display modes. Swipe left/right on the artwork or track-information area to change tracks, both in the main artwork/playback section and in the full-screen player. Swipe down on either area to close the full-screen player when unlocked. Device-card swipes still preview another target; they do not skip tracks.Step 1Mini player (bottom of the screen)When enabled in Settings, the mini player stays at the bottom of the main screen and shows album artwork, the track title, artist and album, plus playback controls. Tap the mini player to open the full screen player. Swipe left or right on the mini player to change tracks. The playback and queue buttons can be positioned on the left or right in Settings.Step 2Full screen playerTap the mini player to open the full screen player. Album artwork, track information and playback controls are displayed in a larger view.Swipe left on the album artwork for the next track, or right for the previous track. You can also swipe on the track information. Swipe down on the artwork or track information to close the full-screen player when it is unlocked.SwipeStep 3Full screen player controlsThe full screen player provides shuffle, previous track, play/pause, next track, repeat and playback queue (when available). It also provides mute and volume, direct volume control, input, output, EQ and Scenes.Available buttons and track information depend on the device and music service.Step 4Sleep timerTap the sleep timer icon to turn the timer on or off. Long press it to open the duration settings, enter 1–1440 minutes, then tap Save. The new duration applies the next time the timer is turned on; playback stops after the set time.Long pressStep 5Album artwork display modeTap the record icon to open Player display settings. Choose Standard Artwork, Vinyl, Listening Room or Minimal. Standard Artwork displays the cover normally; Vinyl alternates artwork with a rotating record; Listening Room shows a room scene with audio equipment; Minimal simplifies the display.TapStep 6Date and time displayTap the clock icon to show or hide the current date and time at the top of the full screen player. When shown, an alarm icon may also appear for a scene alarm; tap it to set an alarm.TapStep 7Large clock displayWhen the date and time are displayed, tap the time to show a larger clock.TapStep 8Lock the playerTap the lock icon to lock the full screen player. This helps keep the player open and prevents accidental closing by swipe gestures. It is useful on a dedicated music-control tablet.Step 9Close the player or show/hide top controlsTap × to close the full screen player and return to the main screen. Tap the > icon to show or hide the top control icons for a cleaner view of the artwork and track information.Step 10Additional feature: expand group volume slidersDuring group playback, an expand button appears to the left of the direct volume button. Tap it once to show the volume sliders for all group members, allowing individual volume adjustment. Tap it again to collapse the sliders. This button appears only during group playback.TapIndividual group volume in full screenWhen a group is selected, use the expand button to the left of the direct-volume buttons. The leader appears first, followed by the followers. The main volume bar controls the group; each expanded row controls that speaker.Expanding reduces the artwork and moves the playback and main volume controls upward to make room. Direct-volume buttons and the controls below them stay in place.Sleep timer confirmationAfter a tap on the sleep button and a confirmed device response, “Sleep on” or “Sleep off” appears in the centre for about two seconds. Hold the button to set the number of minutes. A failed request does not show a success message. In Settings → Layout → Mini player, enable “Show device icons in the full-screen player”. When the device/group section is pinned first, icons appear at the top in portrait or on the left in landscape. Tap an icon to switch without leaving the player. Text and control sizes are preserved; artwork fits the remaining space. Off by default. Icons are not shown when the section is hidden, is not first, or uses the Wrap layout.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Mini Player and Full Screen Player<\/title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#25223c;font:16px/1.65 system-ui,-apple-system,\"Noto Sans\",sans-serif}main{max-width:760px;margin:0 auto;padding:12px 14px 42px}header{background:linear-gradient(105deg,#42009c,#7312bd);color:white;border-radius:14px;padding:19px 20px;margin-bottom:16px}h1{font-size:clamp(22px,5vw,31px);line-height:1.25;margin:0}header p{margin:8px 0 0;color:#f0e9ff}section{border:1px solid #e5e0f1;border-radius:16px;padding:17px;margin:15px 0;background:white}h2{color:#6410bc;font-size:21px;line-height:1.35;margin:0 0 12px;display:flex;gap:11px;align-items:center}.num{background:linear-gradient(145deg,#fc006f,#a832d1);color:white;border-radius:50%;flex:0 0 42px;height:42px;display:inline-grid;place-items:center;font-weight:800}p{margin:9px 0}figure{margin:14px 0}img{display:block;width:100%;height:auto;border-radius:10px;background:#17131d}.note{background:#eaf2ff;color:#244b80;border-radius:10px;padding:12px 14px;margin:13px 0}.supplement{border-color:#d5b8ec;background:#fdfbff}footer{font-size:13px;color:#777;margin:20px 4px}@media(max-width:420px){main{padding:9px 10px 30px}section{padding:13px}h2{font- round:#c51130;color:white;width:28px;height:28px;display:inline-grid;place-items:center}.repeat-sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.repeat-sequence>div{position:relative;text-align:center;background:#f4f0fa;padding:12px 4px;border-radius:10px;overflow-wrap:anywhere}.repeat-sequence svg{width:48px;height:48px;display:block;margin:auto}.repeat-sequence>div:not(:last-child):after{content:'›';position:absolute;right:-9px;top:20px;color:#c51130;font-size:26px}.manual-action{border-left:4px solid #c51130;padding-left:12px}.annotation-stage{overflow:visible!important}<\/style><\/head><body data-guide-chapter=\"player\"><main><header><h1>Mini &amp; full-screen player<\/h1><p>Playback controls, display modes, and group volume sliders.<\/p><\/header><section class=\"manual-update\" id=\"update133-7\"><h2>Portrait: enlarge track information<\/h2><div class=\"annotation-stage\" data-source=\"01-3938.jpg\"><img src=\"images/v133-01-3938.jpg\" alt=\"Portrait: enlarge track information\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1054 1536\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"15.809999999999999\" y=\"1032.192\" width=\"1017.11\" height=\"121.344\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"52.7\" cy=\"991.302\" r=\"36.89\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"52.7\" y=\"991.302\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"46.1125\" font-weight=\"700\">1<\/text><\/svg><\/div><div class=\"annotation-stage\" data-source=\"02-3940.jpg\"><img src=\"images/v133-02-3940.jpg\" alt=\"Portrait: enlarge track information\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1043 1536\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"15.645\" y=\"998.4000000000001\" width=\"1006.495\" height=\"153.60000000000002\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"52.150000000000006\" cy=\"957.8950000000001\" r=\"36.505\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"52.150000000000006\" y=\"957.8950000000001\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"45.63125\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Double-tap the title or artist/album area to switch between the normal and enlarged text sizes. Portrait starts at its normal size; enlarging slightly reduces the artwork to make room. Artist and album remain on one line, at about two-thirds of the title size. Long text continues to scroll. Audio-format text keeps its size.<\/span><\/li><\/ol><\/section><section class=\"manual-update\" id=\"update133-8\"><h2>Landscape: reduce track information<\/h2><div class=\"annotation-stage\" data-source=\"03-3946.jpg\"><img src=\"images/v133-03-3946.jpg\" alt=\"Landscape: reduce track information\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1536 841\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"783.36\" y=\"306.965\" width=\"737.28\" height=\"206.045\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"837.12\" cy=\"249.20499999999998\" r=\"53.760000000000005\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"837.12\" y=\"249.20499999999998\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"67.2\" font-weight=\"700\">1<\/text><\/svg><\/div><div class=\"annotation-stage\" data-source=\"04-3948.jpg\"><img src=\"images/v133-04-3948.jpg\" alt=\"Landscape: reduce track information\" loading=\"eager\" decoding=\"async\" class=\"shot\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1536 845\" preserveaspectratio=\"xMidYMid meet\" aria-hidden=\"true\"><rect x=\"783.36\" y=\"359.125\" width=\"737.28\" height=\"114.075\" rx=\"8\" fill=\"none\" stroke=\"#ff334b\" stroke-width=\"3\" vector-effect=\"non-scaling-stroke\"><\/rect><circle cx=\"837.12\" cy=\"301.365\" r=\"53.760000000000005\" fill=\"#b81024\" stroke=\"white\" stroke-width=\"2\"><\/circle><text x=\"837.12\" y=\"301.365\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"white\" font-family=\"Arial,sans-serif\" font-size=\"67.2\" font-weight=\"700\">1<\/text><\/svg><\/div><ol class=\"annotation-legend\"><li><span class=\"badge\">1<\/span><span>Double-tap the title or artist/album area to switch between the large and smaller text sizes. The clock keeps its size. The text-size switch is available in all player display modes. Swipe left/right on the artwork or track-information area to change tracks, both in the main artwork/playback section and in the full-screen player. Swipe down on either area to close the full-screen player when unlocked. Device-card swipes still preview another target; they do not skip tracks.<\/span><\/li><\/ol><\/section><section id=\"topic-0\"><h2><span class=\"num step-label\">Step 1<\/span>Mini player (bottom of the screen)<\/h2><p>When enabled in Settings, the mini player stays at the bottom of the main screen and shows album artwork, the track title, artist and album, plus playback controls. Tap the mini player to open the full screen player. Swipe left or right on the mini player to change tracks. The playback and queue buttons can be positioned on the left or right in Settings.<\/p><figure><img src=\"images/4439c940916e66a4d01b581b7b4e0f1eeeac99a92ec92185a08ddbc2152dcc3f.png\" alt=\"Mini player (bottom of the screen)\" loading=\"eager\" decoding=\"async\"><\/figure><figure><img src=\"images/f22278f6da642d5ea3df43387ec183f4025f6b647fb4be1311a4b3a29af32c9b.jpg\" alt=\"Mini player (bottom of the screen)\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-1\"><h2><span class=\"num step-label\">Step 2<\/span>Full screen player<\/h2><p>Tap the mini player to open the full screen player. Album artwork, track information and playback controls are displayed in a larger view.<\/p><p class=\"manual-action\">Swipe left on the album artwork for the next track, or right for the previous track. You can also swipe on the track information. Swipe down on the artwork or track information to close the full-screen player when it is unlocked.<\/p><figure class=\"manual-detail\"><figcaption>Swipe<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/897.2385620915034\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:2.7863269654531875%;width:90%;height:93.87008067600298%\"><img src=\"images/febf32a481d99393ccab81b2c6cf42f2ddda8e4eaa12f5a81982db9cf0aac5fb.png\" alt=\"Swipe\" loading=\"eager\" decoding=\"async\" style=\"width:119.04761904761905%!important;left:-9.523809523809524%;top:-19.780219780219777%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 897.2385620915034\" aria-hidden=\"true\"><rect x=\"76.78571428571429\" y=\"62.021475256769406\" width=\"846.4285714285716\" height=\"766.344537815126\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><figure><img src=\"images/febf32a481d99393ccab81b2c6cf42f2ddda8e4eaa12f5a81982db9cf0aac5fb.png\" alt=\"Full screen player\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-2\"><h2><span class=\"num step-label\">Step 3<\/span>Full screen player controls<\/h2><p>The full screen player provides shuffle, previous track, play/pause, next track, repeat and playback queue (when available). It also provides mute and volume, direct volume control, input, output, EQ and Scenes.<\/p><figure><img src=\"images/c6b4a152e4f905500b248a84794c2031169404a3f21cd233eacf3e9c1e122931.png\" alt=\"Full screen player controls\" loading=\"eager\" decoding=\"async\"><\/figure><div class=\"note\">Available buttons and track information depend on the device and music service.<\/div><\/section><section id=\"topic-3\"><h2><span class=\"num step-label\">Step 4<\/span>Sleep timer<\/h2><p>Tap the sleep timer icon to turn the timer on or off. Long press it to open the duration settings, enter 1–1440 minutes, then tap Save. The new duration applies the next time the timer is turned on; playback stops after the set time.<\/p><figure class=\"manual-detail\"><figcaption>Long press<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/383.56900572397706\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:22.160288952326738%;width:90%;height:70.01843259391089%\"><img src=\"images/5f04c5737413d8d3f0547c15a8436c2bd8a5e14cf9fd6421bd389034875b2693.png\" alt=\"Long press\" loading=\"eager\" decoding=\"async\" style=\"width:188.67924528301884%!important;left:-84.90566037735849%;top:-5.555555555555556%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 383.56900572397706\" aria-hidden=\"true\"><rect x=\"100.94339622641508\" y=\"141.69790120839517\" width=\"195.28301886792454\" height=\"164.125503497986\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><circle cx=\"196.03773584905665\" cy=\"219.28450286198853\" r=\"25\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"5\"><\/circle><circle cx=\"196.03773584905665\" cy=\"219.28450286198853\" r=\"14\" fill=\"#ed2244\" fill-opacity=\".22\" stroke=\"#ed2244\" stroke-width=\"3\"><\/circle><path d=\"M 231.03773584905665 257.2845028619885 L 203.03773584905665 225.28450286198853 L 208.03773584905665 262.2845028619885\" fill=\"white\" stroke=\"#ed2244\" stroke-width=\"4\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><\/figure><figure><img src=\"images/5f04c5737413d8d3f0547c15a8436c2bd8a5e14cf9fd6421bd389034875b2693.png\" alt=\"Sleep timer\" loading=\"eager\" decoding=\"async\"><\/figure><figure><img src=\"images/23071be484db03d8dd4cdf6538b51316a13e748caf65f2eae6d341ff870c1b27.png\" alt=\"Sleep timer\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-4\"><h2><span class=\"num step-label\">Step 5<\/span>Album artwork display mode<\/h2><p>Tap the record icon to open Player display settings. Choose Standard Artwork, Vinyl, Listening Room or Minimal. Standard Artwork displays the cover normally; Vinyl alternates artwork with a rotating record; Listening Room shows a room scene with audio equipment; Minimal simplifies the display.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/373.94535653026213\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.685468762593616%;width:90%;height:85.29196872229404%\"><img src=\"images/0aec9355bd62263eb35c2024d834ba7f3267593a69dc5402f4b4e4c044b791bc.png\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:181.8181818181818%!important;left:-80.0%;top:-5.434782608695652%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 373.94535653026213\" aria-hidden=\"true\"><rect x=\"107.2727272727272\" y=\"97.80274442538592\" width=\"163.63636363636363\" height=\"190.6738544474393\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><figure><img src=\"images/0aec9355bd62263eb35c2024d834ba7f3267593a69dc5402f4b4e4c044b791bc.png\" alt=\"Album artwork display mode\" loading=\"eager\" decoding=\"async\"><\/figure><figure><img src=\"images/38deb3f996dc36c3bda8bcddb34005d05e6ba4c1275ed0e21185ca3c336f6e40.png\" alt=\"Album artwork display mode\" loading=\"eager\" decoding=\"async\"><\/figure><figure><img src=\"images/27a2aab7a4156f199a16cad4c0cad67db18dbdc9157c61d2c02ae2f24a2232ca.jpg\" alt=\"Album artwork display modes\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-5\"><h2><span class=\"num step-label\">Step 6<\/span>Date and time display<\/h2><p>Tap the clock icon to show or hide the current date and time at the top of the full screen player. When shown, an alarm icon may also appear for a scene alarm; tap it to set an alarm.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/465.2446043165467\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:5.373517450401274%;width:90%;height:88.17826160911719%\"><img src=\"images/0e8f92421cfcaeb41c75e28f9a81391a459f09041e0ba107ee61e6f1e35d8fa9.png\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:200.0%!important;left:-96.0%;top:0.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 465.2446043165467\" aria-hidden=\"true\"><rect x=\"319.9999999999999\" y=\"42.093525179856115\" width=\"216.0\" height=\"239.30935251798562\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><figure><img src=\"images/0e8f92421cfcaeb41c75e28f9a81391a459f09041e0ba107ee61e6f1e35d8fa9.png\" alt=\"Date and time display\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-6\"><h2><span class=\"num step-label\">Step 7<\/span>Large clock display<\/h2><p>When the date and time are displayed, tap the time to show a larger clock.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/384.03675918979735\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:6.509793503294456%;width:90%;height:85.67845429275219%\"><img src=\"images/af4d8046e3b4cb6e50d18de48e135165f355425b3a2ac1f6272e074c3981e635.png\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:161.29032258064515%!important;left:-32.25806451612903%;top:-84.74576271186443%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 384.03675918979735\" aria-hidden=\"true\"><rect x=\"122.5806451612903\" y=\"75.19204801200293\" width=\"725.8064516129032\" height=\"234.2295573893473\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><figure><img src=\"images/af4d8046e3b4cb6e50d18de48e135165f355425b3a2ac1f6272e074c3981e635.png\" alt=\"Large clock display\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-7\"><h2><span class=\"num step-label\">Step 8<\/span>Lock the player<\/h2><p>Tap the lock icon to lock the full screen player. This helps keep the player open and prevents accidental closing by swipe gestures. It is useful on a dedicated music-control tablet.<\/p><figure><img src=\"images/fd294fdc5998677a0522f07afddb8d18ae758198de7857c129598bdd1bb91ea0.png\" alt=\"Lock the player\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section id=\"topic-8\"><h2><span class=\"num step-label\">Step 9<\/span>Close the player or show/hide top controls<\/h2><p>Tap × to close the full screen player and return to the main screen. Tap the &gt; icon to show or hide the top control icons for a cleaner view of the artwork and track information.<\/p><figure><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/1188.3753726209586\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:2.1037123939098947%;width:90%;height:95.37183273339824%\"><img src=\"images/f19406103d6069f054935f9af6370d67fa35860462aa622685d141fa5d5659cf.png\" alt=\"Close the player or show/hide top controls\" loading=\"eager\" decoding=\"async\" style=\"width:102.04081632653062%!important;left:-2.0408163265306123%;top:-19.27710843373494%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 1188.3753726209586\" aria-hidden=\"true\"><\/svg><\/div><\/figure><\/section><section class=\"supplement\" id=\"topic-9\"><h2><span class=\"num step-label\">Step 10<\/span>Additional feature: expand group volume sliders<\/h2><p>During group playback, an expand button appears to the left of the direct volume button. Tap it once to show the volume sliders for all group members, allowing individual volume adjustment. Tap it again to collapse the sliders. This button appears only during group playback.<\/p><figure class=\"manual-detail\"><figcaption>Tap<\/figcaption><div class=\"annotation-stage revised-stage\" style=\"aspect-ratio:1000/187.78688524590163\" data-revision=\"134\"><div class=\"detail-window\" style=\"left:5%;top:13.312963771278918%;width:90%;height:70.71147970318637%\"><img src=\"images/3990d5a51353828dedb427b8f21cc42d349e2b28353557d6a116edda16cb25a2.png\" alt=\"Tap\" loading=\"eager\" decoding=\"async\" style=\"width:100.0%!important;left:0.0%;top:-300.0%\"><\/div><svg xmlns=\"http://www.w3.org/2000/svg\" viewbox=\"0 0 1000 187.78688524590163\" aria-hidden=\"true\"><rect x=\"59.0\" y=\"46.24590163934428\" width=\"216.0\" height=\"100.91803278688523\" rx=\"7\" fill=\"none\" stroke=\"#ed2244\" stroke-width=\"4\"><\/rect><\/svg><\/div><\/figure><figure><img src=\"images/3990d5a51353828dedb427b8f21cc42d349e2b28353557d6a116edda16cb25a2.png\" alt=\"Additional feature: expand group volume sliders\" loading=\"eager\" decoding=\"async\"><\/figure><\/section><section class=\"new-section\" id=\"topic-10\"><h2>Individual group volume in full screen<\/h2><p>When a group is selected, use the expand button to the left of the direct-volume buttons. The leader appears first, followed by the followers. The main volume bar controls the group; each expanded row controls that speaker.<\/p><p>Expanding reduces the artwork and moves the playback and main volume controls upward to make room. Direct-volume buttons and the controls below them stay in place.<\/p><\/section><section id=\"topic-11\"><h2>Sleep timer confirmation<\/h2><p>After a tap on the sleep button and a confirmed device response, “Sleep on” or “Sleep off” appears in the centre for about two seconds. Hold the button to set the number of minutes. A failed request does not show a success message.<\/p><\/section><\/main><section id=\"full-player-devices-138\"><p>In Settings → Layout → Mini player, enable “Show device icons in the full-screen player”. When the device/group section is pinned first, icons appear at the top in portrait or on the left in landscape. Tap an icon to switch without leaving the player. Text and control sizes are preserved; artwork fits the remaining space. Off by default. Icons are not shown when the section is hidden, is not first, or uses the Wrap layout.<\/p><\/section><\/body><\/html>"}, {"id": "group", "group": "groups", "title": "Create & switch groups", "blocks": [{"id": "update133-9", "title": "Group changes and related scenes", "text": "Group changes and related scenes11Saving a different group leader deletes that group’s scenes after showing the affected count. Deleting a saved group also deletes its related scenes. Cancel keeps them. Recreate the scenes for the new leader, whose presets may differ. Changing the name or keeping the same leader does not trigger this automatic cleanup. Deleting the saved group does not erase presets on the devices or change current playback. This screenshot shows the group-deletion confirmation; Android’s dialog buttons may follow the system language."}, {"id": "topic-0", "title": "Step 1Open the group creation screen", "text": "Step 1Open the group creation screenTap the grid icon at the top right of the app to open the group creation screen."}, {"id": "topic-1", "title": "Step 2Enter a group name", "text": "Step 2Enter a group nameEnter a name for the group. Use an easy-to-understand name, such as “Living Room” or “Whole House”."}, {"id": "topic-2", "title": "Step 3Select the group type", "text": "Step 3Select the group typeTap “Type” and select the group type.Multi-room: Group multiple WiiM devices for synchronized playback.Home theater: For home theater setup.Stereo pair (linked volume): Pair two WiiM devices as left/right with linked volume.In this example, select “Multi-room”."}, {"id": "topic-3", "title": "Step 4Select the devices to include", "text": "Step 4Select the devices to includeSelect the WiiM devices to include in the group. Registered devices on the same network are listed. In this example, three devices are selected."}, {"id": "topic-4", "title": "Step 5Select the leader device", "text": "Step 5Select the leader deviceTap “Leader” and select the device that will control the group. The leader manages group playback. In this example, “WiiM Bar-DB90” is selected."}, {"id": "topic-5", "title": "Step 6Save the group", "text": "Step 6Save the groupAfter confirming the name, color, type, devices and leader, tap “Save” to register the group.Saving the group does not change the actual speaker connections."}, {"id": "topic-6", "title": "Step 7The group is added", "text": "Step 7The group is addedThe group icon is added at the top of the main screen. Tap it to select the group. The device card and player will follow your selection."}, {"id": "topic-7", "title": "Step 8Open the group control panel", "text": "Step 8Open the group control panelLong press a group icon to open its control panel. Here you can change the display name, icon colour and image; these changes are saved automatically and apply only in this app. You can also adjust each member's volume, check the saved and current leaders, and use the Input, Output, EQ and Scenes controls. Tap the pencil icon at the top to open the group editor.Long pressThe saved group configuration may differ from the current speaker connections."}, {"id": "topic-8", "title": "Step 9Edit the group", "text": "Step 9Edit the groupTap the pencil icon in the group control panel to open Edit group. Choose the group type, select or deselect member devices, and choose the leader. Tap Save to save these group-configuration changes.TapThe group name, icon colour and image are edited in the control panel and saved automatically."}, {"id": "topic-9", "title": "Step 10Change the group icon image", "text": "Step 10Change the group icon imageTap “Change image” to select a group icon. Choose a preset room label or symbol, or upload your own image using “Choose image”."}], "text": "Create & switch groupsCreate, save and manage a group of WiiM devices.Group changes and related scenes11Saving a different group leader deletes that group’s scenes after showing the affected count. Deleting a saved group also deletes its related scenes. Cancel keeps them. Recreate the scenes for the new leader, whose presets may differ. Changing the name or keeping the same leader does not trigger this automatic cleanup. Deleting the saved group does not erase presets on the devices or change current playback. This screenshot shows the group-deletion confirmation; Android’s dialog buttons may follow the system language.Step 1Open the group creation screenTap the grid icon at the top right of the app to open the group creation screen.Step 2Enter a group nameEnter a name for the group. Use an easy-to-understand name, such as “Living Room” or “Whole House”.Step 3Select the group typeTap “Type” and select the group type.Multi-room: Group multiple WiiM devices for synchronized playback.Home theater: For home theater setup.Stereo pair (linked volume): Pair two WiiM devices as left/right with linked volume.In this example, select “Multi-room”.Step 4Select the devices to includeSelect the WiiM devices to include in the group. Registered devices on the same network are listed. In this example, three devices are selected.Step 5Select the leader deviceTap “Leader” and select the device that will control the group. The leader manages group playback. In this example, “WiiM Bar-DB90” is selected.Step 6Save the groupAfter confirming the name, color, type, devices and leader, tap “Save” to register the group.Saving the group does not change the actual speaker connections.Step 7The group is addedThe group icon is added at the top of the main screen. Tap it to select the group. The device card and player will follow your selection.Step 8Open the group control panelLong press a group icon to open its control panel. Here you can change the display name, icon colour and image; these changes are saved automatically and apply only in this app. You can also adjust each member's volume, check the saved and current leaders, and use the Input, Output, EQ and Scenes controls. Tap the pencil icon at the top to open the group editor.Long pressThe saved group configuration may differ from the current speaker connections.Step 9Edit the groupTap the pencil icon in the group control panel to open Edit group. Choose the group type, select or deselect member devices, and choose the leader. Tap Save to save these group-configuration changes.TapThe group name, icon colour and image are edited in the control panel and saved automatically.Step 10Change the group icon imageTap “Change image” to select a group icon. Choose a preset room label or symbol, or upload your own image using “Choose image”.", "html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Flex4WiiM | Group Creation Guide<\/title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#25213a;font:16px/1.65 system-ui,-apple-system,'Noto Sans',sans-serif}\nmain{max-width:760px;margin:0 auto;padding:12px 14px 40px}\nheader{background:linear-gradient(100deg,#44049f,#7710bc);color:white;border-radius:13px;padding:18px 20px;margin-bottom:16px}\nheader h1{font-size:clamp(22px,5vw,31px);line-height:1.25;margin:0}\nheader p{margin:7px 0 0;color:#f5eaff}\nsection{border:1px solid #e6e2f0;border-radius:16px;padding:17px;margin:15px 0;background:white}\nh2{color:#6415bd;font-size:21px;line-height:1.3;margin:0 0 12px;display:flex;g
